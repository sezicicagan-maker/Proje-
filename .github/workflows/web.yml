name: Web yayın

# Elle çalıştır: GitHub > Actions > "Web yayın" > Run workflow.
# Oyunun web sürümünü gh-pages dalına yazar. Sonra Settings > Pages > Source: "Deploy from a branch" > gh-pages / (root).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:www
      - run: mkdir -p www/core-shift && cp games/core-shift/index.html www/core-shift/index.html
      - run: touch www/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
