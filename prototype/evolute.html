function toVirt(ev) {

}
function cellAt(x, y) {
  if (y < BOARD_Y || y >= BOARD_Y + ROWS * CELL || x < 0 || x >= W) return null;
  return idx(Math.floor((y - BOARD_Y) / CELL), Math.floor(x / CELL));
}
cv.addEventListener('pointerdown', ev => {
  ensureAudio();
  if (screen === 'hab' && !ov.hidden) { const [hx, hy] = toVirt(ev); habTap(hx, hy); return; }
  if (!G || G.mode !== 'play') return;
  const [x, y] = toVirt(ev);
  taps.push({ x, y, t0: T });
  const hf = (k, ...a) => { hudFx = { k, t0: T }; try { save.vib && navigator.vibrate && navigator.vibrate(8); } catch (e) {} };
  if (x >= 318 && y <= 40) { hf('pause'); pauseGame(); return; }
  if (x >= 290 && x <= 350 && y >= 679 && y <= 713) { hf('snd'); toggleMute(); return; }
  if (x >= 12 && x <= 72 && y >= 679 && y <= 713) { hf('spd'); save.speed = save.speed === 2 ? 1 : 2; persist(); return; }
  if (x >= 88 && x <= 272 && y >= 679 && y <= 713) { hf('spawn'); spawnManual(); G.idle = 0; return; }
  const i = cellAt(x, y);
  if (i !== null && G.board[i] && G.board[i].lock > 0) { G.texts.push({ x: cellXY(Math.floor(i / COLS), i % COLS)[0], y: cellXY(Math.floor(i / COLS), i % COLS)[1] - 24, s: '✕', life: 0.5, max: 0.5, c: '#ff7a88', big: true }); return; }
  if (i !== null && G.board[i]) { drag = { from: i, x, y }; G.idle = 0; try { cv.setPointerCapture(ev.pointerId); } catch (e) {} }
});

  if (G && G.mode === 'play') { pauseGame(); return true; }
  if (G && G.mode === 'paused') { G.mode = 'play'; hideOv(); return true; }
  if (screen === 'pick') return true;
  if (screen === 'tut') { tutFromSettings ? showSettings() : showMenu(); return true; }
  if (screen === 'lab' || screen === 'codex' || screen === 'settings' || screen === 'ach' || screen === 'hab') { backTo === 'result' && G && G.mode === 'over' ? showResult() : showMenu(); return true; }
  if (screen === 'result') { showMenu(); return true; }
  return false;
}
