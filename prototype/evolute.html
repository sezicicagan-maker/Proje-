function spawnUnit() {
  const empty = [];
  for (let i = 0; i < G.board.length; i++) if (!G.board[i]) empty.push(i);
  if (!empty.length) return false;
  const i = empty[Math.floor(Math.random() * empty.length)];

function neighbors(r, c, el) {
  let n = 0;
  for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {

    if (rr < 0 || cc < 0 || rr >= ROWS || cc >= COLS) continue;
    const u = G.board[idx(rr, cc)];
    if (u && u.el === el) n++;

/* Sürükle-bırak: boş hücreye taşır, aynı el+tier ise birleştirir, aksi halde yer değiştirir. */
function drop(from, to) {
  if (!G || G.mode !== 'play' || from === to) return 'none';
  const A = G.board[from], B = G.board[to];

  if (!B) { G.board[to] = A; G.board[from] = null; return 'move'; }

    const nu = mkUnit(A.el, A.tier + 1); nu.pop = 1.6;
    G.board[to] = nu; G.board[from] = null;

    burst(x, y, EL[A.el].c, 10);

      for (const e of G.enemies) if (e.lane === c && !e.dead) hurt(e, d);

    }
    try { save.vib && navigator.vibrate && navigator.vibrate(12); } catch (e) {}
    return 'merge';
  }
  G.board[to] = A; G.board[from] = B;

}

function hurt(e, d) {

  e.hp -= d; e.flash = 0.08;
  if (e.hp <= 0) {
    e.dead = true; G.kills++; G.gold += e.boss ? 40 : 3; sfx('kill');
    burst(e.x, e.y, e.boss ? '#ffb347' : '#ff7a88', e.boss ? 26 : 8);

  }
}

  let dmg = BASE_DMG * Math.pow(TIERMUL, u.tier - 1) * (1 + 0.08 * save.up.atk) * eraBonus();

  const cl = mutLv('crit');
  if (cl && Math.random() < 0.15 * cl) { dmg *= 2.2; crit = true; }
  const [x, y] = cellXY(r, c);
  G.proj.push({ x, y, t, dmg, el: u.el, crit });
}
function impact(p) {

  if (p.el === 0 && mutLv('slow')) t.slow = 1.2 + 0.4 * mutLv('slow');
  if (p.el === 1 && mutLv('tox')) {

    }
  }
}

function step(dt) {

      }
    }
    for (let i = g.proj.length - 1; i >= 0; i--) {
      const p = g.proj[i];
      if (p.t.dead) { g.proj.splice(i, 1); continue; }
      const dx = p.t.x - p.x, dy = p.t.y - p.y, d = Math.hypot(dx, dy), s = 620 * dt;

  }
  for (let i = g.fx.length - 1; i >= 0; i--) {
    const f = g.fx[i]; f.life -= dt;

  if (g.toast) { g.toast.life -= dt; if (g.toast.life <= 0) g.toast = null; }
  if (g.banner) { g.banner.life -= dt; if (g.banner.life <= 0) g.banner = null; }
  g.shake = Math.max(0, g.shake - dt);
  if (g.mode === 'ending') { g.endT -= dt; if (g.endT <= 0) { g.mode = 'over'; finishRun(); } }
}

function finishRun() {
  const g = G;
  const gain = Math.round((g.waveReached * 8 + g.kills * 0.6 + (g.win ? 60 : 0)) * ERAS[g.era].dnaMul);
  g.gain = gain;
  save.dna += gain; save.runs++;
  if (g.win) {
    save.wins++; save.clears[g.era] = (save.clears[g.era] || 0) + 1;
    if (g.era === save.unlocked && save.unlocked < ERAS.length - 1) { save.unlocked++; g.newEra = true; }

function toVirt(ev) {
  const r = cv.getBoundingClientRect();
  return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
}
function cellAt(x, y) {
  if (y < BOARD_Y || y >= BOARD_Y + ROWS * CELL || x < 0 || x >= W) return null;
  return idx(Math.floor((y - BOARD_Y) / CELL), Math.floor(x / CELL));
}
cv.addEventListener('pointerdown', ev => {
  ensureAudio();
  if (!G || G.mode !== 'play') return;
  const [x, y] = toVirt(ev);
  if (x >= 318 && y <= 40) { pauseGame(); return; }
  if (x >= 290 && x <= 350 && y >= 679 && y <= 713) { toggleMute(); return; }
  if (x >= 88 && x <= 272 && y >= 679 && y <= 713) { spawnManual(); G.idle = 0; return; }
  const i = cellAt(x, y);
  if (i !== null && G.board[i]) { drag = { from: i, x, y }; G.idle = 0; try { cv.setPointerCapture(ev.pointerId); } catch (e) {} }
});
cv.addEventListener('pointermove', ev => { if (drag) { const [x, y] = toVirt(ev); drag.x = x; drag.y = y; } });
function endDrag(ev) {
  if (!drag) return;
  const [x, y] = toVirt(ev); const to = cellAt(x, y), from = drag.from; drag = null;
  if (to !== null) drop(from, to);
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { drag = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

function showResult() {
  const g = G; screen = 'result';
  const fm = g.firstMerge === null ? '-' : g.firstMerge.toFixed(1) + ' ' + t('sec');
  const nxt = g.newEra ? `<div class="bank"><b>${t('newEra', eraName(save.unlocked))}</b></div>` : '';
  setOv(`<span class="tag">${g.win ? t('winTag') : t('loseTag')}</span><h2>${g.win ? t('win') : t('lose')}</h2>
    <div class="stats"><span>${t('sWave')} <b>${g.waveReached}/${WAVES}</b></span><span>${t('sTier')} <b>${g.maxTier}</b></span>
    <span>${t('sMerge')} <b>${g.merges}</b></span><span>${t('sKill')} <b>${g.kills}</b></span>
    <span>${t('sFirst')} <b>${fm}</b></span><span>${t('sTime')} <b>${Math.round(g.t)} ${t('sec')}</b></span></div>
    ${nxt}<div class="bank">${t('gainDna', g.gain)}${g.disc ? ' · ' + t('gainCodex', g.disc) : ''} · ${t('bank')} <b>${save.dna}</b></div>
    <button class="btn" data-act="again">${t('next')}</button>
    <div class="pair"><button class="ghost" data-act="lab">${t('lab')}</button><button class="ghost" data-act="menu">${t('pickEra')}</button><button class="ghost" data-act="codex">${t('codex')}</button></div>`);
}
function showCodex() {
  screen = 'codex';
  const rows = [0, 1, 2].map(el => {
    const names = [1, 2, 3, 4, 5, 6, 7, 8].map(i => save.codex[codexEra + ':' + el + ':' + i] ? `<b>${i}</b> ${speciesName(codexEra, el, i)}` : `<i>${i} ???</i>`).join(' · ');
    return `<div class="crow"><span class="dot" style="background:${EL[el].c}"></span><div><b>${t(ELN[el])}</b><small>${names}</small></div></div>`;
  }).join('');
  setOv(`<span class="tag">${t('codexTitle')} ${codexCount()}/${CODEX_TOTAL}</span>
    <div class="eras"><button class="mini" data-cera="-1" aria-label="‹" ${codexEra <= 0 ? 'disabled' : ''}>‹</button><div><span class="tag">${t('era')} ${codexEra + 1}</span><b>${eraName(codexEra)}</b></div><button class="mini" data-cera="1" aria-label="›" ${codexEra >= ERAS.length - 1 ? 'disabled' : ''}>›</button></div>
    <div class="lab">${rows}</div><p>${t('codexNote')}</p><button class="btn" data-act="back">${t('back')}</button>`);
}
function showSettings() {
  screen = 'settings';
  const langs = Object.keys(LANGS).map(l => `<button class="ghost ${l === LANG ? 'sel' : ''}" data-lang="${l}">${LANGS[l]}</button>`).join('');
  const rst = confirmReset
    ? `<div class="row"><small>${t('resetAsk')}</small></div><div class="pair"><button class="ghost danger" data-act="resetyes">${t('resetYes')}</button><button class="ghost" data-act="resetno">${t('cancel')}</button></div>`
    : `<div class="row"><b>${t('reset')}</b><button class="mini danger" data-act="reset">!</button></div>`;
  setOv(`<span class="tag">${t('settings')}</span><div class="lab"><div class="row"><b>${t('lang')}</b></div><div class="pair">${langs}</div>
    <div class="row"><b>${t('sound')}</b><button class="mini" data-act="mute">${save.muted ? t('off') : t('on')}</button></div>
    <div class="row"><b>${t('vib')}</b><button class="mini" data-act="vib">${save.vib ? t('on') : t('off')}</button></div>
    <div class="row"><b>${t('howTo')}</b><button class="mini" data-act="tut">?</button></div>${rst}</div>
    <button class="btn" data-act="back">${t('back')}</button>`);
}
function showTutorial() {
  screen = 'tut';
  const last = tutStep >= 2;
  const dots = '<div class="how"><span class="dot" style="background:var(--water)"></span><span class="dot" style="background:var(--poison)"></span><span class="dot" style="background:var(--volt)"></span></div>';
  setOv(`<span class="tag">${t('howTo')} ${tutStep + 1}/3</span>${dots}<p class="big">${t('tut' + (tutStep + 1))}</p>
    <button class="btn" data-act="tnext">${last ? t('startBtn') : t('nextBtn')}</button>`);
}
function startRun() { if (!save.tut) { tutStep = 0; tutFromSettings = false; showTutorial(); } else newGame(); }
function showPause() {
  screen = 'pause';
  setOv(`<h2>${t('pauseT')}</h2><button class="btn" data-act="resume">${t('resume')}</button>
    <div class="pair"><button class="ghost" data-act="mute">${t('sound')}: ${save.muted ? t('off') : t('on')}</button><button class="ghost" data-act="vib">${t('vib')}: ${save.vib ? t('on') : t('off')}</button></div>
    <button class="ghost" data-act="quit">${t('toMenu')}</button>`);
}
function pauseGame() { if (G && G.mode === 'play') { G.mode = 'paused'; drag = null; showPause(); } }
function showPick() {
  screen = 'pick';
  setOv(`<span class="tag">${t('wave')} ${G.waveReached}</span><h2>${t('pick')}</h2><div class="cards">` +
    G.pickOffer.map(id => { const l = G.muts[id] || 0;
      return `<button class="card" data-pick="${id}"><b>${t(id)}${l ? ' · ' + (l + 1) : ''}</b><span>${t(id + 'D')}</span></button>`; }).join('') + '</div>');
}
const goSub = fn => { if (screen === 'menu' || screen === 'result') backTo = screen; fn(); };
ov.addEventListener('click', ev => {
  ensureAudio();
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.act === 'start') { startRun(); return; }
  if (d.act === 'again') { newGame(); return; }
  if (d.act === 'daily') { claimDaily(); sfx('discover'); showMenu(); return; }
  if (d.act === 'idle') { collectIdle(); sfx('discover'); showMenu(); return; }
  if (d.act === 'lab') { goSub(showLab); return; }
  if (d.act === 'codex') { codexEra = save.era; goSub(showCodex); return; }
  if (d.act === 'settings') { confirmReset = false; goSub(showSettings); return; }
  if (d.act === 'menu') { showMenu(); return; }
  if (d.act === 'back') { backTo === 'result' && G && G.mode === 'over' ? showResult() : showMenu(); return; }
  if (d.act === 'mute') { toggleMute(); render(); return; }
  if (d.act === 'vib') { save.vib = !save.vib; persist(); render(); return; }
  if (d.act === 'tut') { tutStep = 0; tutFromSettings = true; showTutorial(); return; }
  if (d.act === 'tnext') {
    if (tutStep < 2) { tutStep++; showTutorial(); return; }
    save.tut = 1; persist(); if (tutFromSettings) showSettings(); else newGame(); return;
  }
  if (d.act === 'reset') { confirmReset = true; showSettings(); return; }
  if (d.act === 'resetno') { confirmReset = false; showSettings(); return; }
  if (d.act === 'resetyes') {
    const keep = save.lang; try { localStorage.removeItem(KEY); } catch (e) {}
    Object.assign(save, { dna: 0, runs: 0, wins: 0, bestWave: 0, up: { atk: 0, hp: 0, spawn: 0 }, era: 0, unlocked: 0, clears: [0, 0, 0], codex: {}, tut: 0, daily: { last: '', streak: 0 }, idleT: Date.now(), lang: keep });
    persist(); confirmReset = false; G = null; backTo = 'menu'; showSettings(); return;
  }
  if (d.act === 'resume') { if (G && G.mode === 'paused') { G.mode = 'play'; hideOv(); } return; }
  if (d.act === 'quit') { G = null; drag = null; showMenu(); return; }
  if (d.lang) { LANG = d.lang; save.lang = d.lang; persist(); try { document.documentElement.lang = LANG; } catch (e) {} showSettings(); return; }
  if (d.era) { save.era = Math.max(0, Math.min(save.unlocked, save.era + (+d.era))); persist(); showMenu(); return; }
  if (d.cera) { codexEra = Math.max(0, Math.min(ERAS.length - 1, codexEra + (+d.cera))); showCodex(); return; }
  if (d.pick) { pickMut(d.pick); return; }
  if (d.up) {
    const k = d.up, u = UPS[k], l = save.up[k], cost = u.cost(l);
    if (save.dna >= cost && l < UPMAX) { save.dna -= cost; save.up[k]++; persist(); showLab(); }
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* Android geri tuşu ve uygulama arka plana geçişi (Capacitor App eklentisi varsa; tarayıcıda etkisiz). */
function handleBack() {
  if (G && G.mode === 'play') { pauseGame(); return true; }
  if (G && G.mode === 'paused') { G.mode = 'play'; hideOv(); return true; }
  if (screen === 'pick') return true;
  if (screen === 'tut') { tutFromSettings ? showSettings() : showMenu(); return true; }
  if (screen === 'lab' || screen === 'codex' || screen === 'settings') { backTo === 'result' && G && G.mode === 'over' ? showResult() : showMenu(); return true; }
  if (screen === 'result') { showMenu(); return true; }
  return false;
}
try {
  const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (CapApp) {
    CapApp.addListener('backButton', () => { if (!handleBack()) CapApp.exitApp(); });
    CapApp.addListener('pause', () => pauseGame());
  }
} catch (e) {}

/* ---------- Döngü ---------- */
let last = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  step(dt); draw(now);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', fit);
fit(); showMenu();
requestAnimationFrame(frame);

// Test ve denge ayarı için dış erişim
window.__evolute = { handleBack, ERAS, t, STR, LANGS, SPECIES, setLang(l) { LANG = l; save.lang = l; }, pauseGame, showMenu, showSettings, showTutorial, claimDaily, idleAcc, dailyReady, get g() { return G; }, get save() { return save; }, newGame, step, drop, spawnManual, pickMut, endRun, cellXY, cellAt, MUTS, UPS, EL, idx, COLS, ROWS, MAXT, WAVES, spawnCost, findPair, get mode() { return G ? G.mode : 'menu'; } };
})();
</script>
