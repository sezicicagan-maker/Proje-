<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#060b14">
<meta name="description" content="Reactor Lab: an educational nuclear reactor simulator (RBMK, PWR, BWR, CANDU).">
<title>Reactor Lab</title>
<style>
:root{color-scheme:dark;--bg:#060b14;--ink:#e6f0ff;--muted:#8199b8;--dim:#5d7698;--acc:#5fd3ff;--ok:#46e0a0;--warn:#ffc83d;--bad:#ff5468;--line:#22395c;--p1:#16283f;--p2:#0e1a2e;--font:'Trebuchet MS','Segoe UI',system-ui,sans-serif;--fs:1;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% -10%,#16304f,#060b14 65%);color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{position:relative;height:100dvh;margin:0 auto;max-width:480px}
#stage{height:100%;display:flex;flex-direction:column}
#cw{position:relative;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;touch-action:none}
#app.wide{max-width:1500px}
#app.wide #stage{display:grid;grid-template-columns:minmax(0,1fr) 350px;grid-template-rows:minmax(0,1fr);gap:12px;padding:12px;height:100%}
#app.wide #ctl{min-height:0;overflow-y:auto;overscroll-behavior:contain;justify-content:flex-end;gap:12px;padding:16px;background:linear-gradient(180deg,#12223a,#0a1424);border:1px solid var(--line);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.35)}
#app.wide .row{padding:8px 14px 6px}
#app.wide .rh{font-size:calc(12.5px*var(--fs))}
#app.wide .b,#app.wide #az,#app.wide #rst{height:50px}
#app.wide #kbHint{display:block}
/* üst çubuk */
#top{position:absolute;inset-inline-end:6px;top:4px;display:flex;gap:5px;z-index:3;align-items:center}
#top button{height:24px;min-width:28px;padding:0 7px;border-radius:8px;border:1px solid #2b4a74;background:rgba(10,20,36,.85);font:700 13px/1 var(--font);cursor:pointer;transition:transform .12s var(--ease),border-color .2s,background .2s}
#top button:active{transform:scale(.92)}
#bProt{font-size:9.5px!important;letter-spacing:.07em;font-weight:800!important}
#bProt.full{color:var(--ok);border-color:#2f6b4f}#bProt.assist{color:var(--acc);border-color:#2b5f86}#bProt.off{color:var(--bad);border-color:#8f2a38;background:rgba(80,10,20,.85)}
#bProt.arm,.chip.arm{animation:blink .45s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
/* bildirim ve ipucu */
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(88%,420px)}
.tst{padding:10px 16px;border-radius:13px;font:800 calc(14px*var(--fs))/1.3 var(--font);text-align:center;background:rgba(8,14,26,.93);border:2px solid var(--warn);color:#fff;box-shadow:0 10px 32px rgba(0,0,0,.6);animation:tIn .38s cubic-bezier(.2,1.5,.4,1) both;max-width:100%}
.tst.bad{border-color:var(--bad);box-shadow:0 0 0 1px rgba(255,84,104,.3),0 10px 40px rgba(255,40,70,.35)}.tst.ok{border-color:var(--ok)}.tst.info{border-color:var(--acc)}
.tst.out{animation:tOut .4s var(--ease) both}
@keyframes tIn{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}@keyframes tOut{to{opacity:0;transform:translateY(-10px) scale(.96)}}
#tip{position:absolute;left:10px;right:10px;bottom:10px;z-index:6;max-width:420px;margin:0 auto;padding:14px 16px 12px;border-radius:16px;background:linear-gradient(180deg,#18304f,#0f1d33);border:1px solid #31557f;box-shadow:0 16px 40px rgba(0,0,0,.6);animation:tipIn .32s var(--ease) both}
#tip[hidden]{display:none}#tip b{display:block;font-size:calc(15px*var(--fs));margin-bottom:4px}#tip p{margin:0 0 10px;color:#b7c9e2;font-size:calc(13px*var(--fs));line-height:1.45}#tip small{display:block;color:var(--dim);font-size:11px;margin:-6px 0 8px}
#tip button{float:inline-end;font:700 13px/1 var(--font);padding:9px 14px;border-radius:10px;border:1px solid #2b4a74;background:#13243d;cursor:pointer}
@keyframes tipIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
/* kontroller */
#ctl{flex:none;display:flex;flex-direction:column;gap:5px;padding:4px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(6,11,20,0),#0a1424 30%)}
.row{position:relative;background:linear-gradient(180deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:4px 12px 2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:opacity .25s,border-color .25s,box-shadow .25s}
.row.dis{opacity:.5}.row.hot{border-color:var(--warn);box-shadow:0 0 0 1px rgba(255,200,61,.25),inset 0 1px 0 rgba(255,255,255,.05)}
.rh{display:flex;align-items:center;gap:6px;min-height:19px;font-size:calc(11px*var(--fs));color:var(--muted)}
.rl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em;font-weight:700}
.rv{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.rs{position:relative;height:26px;--m:0}
.rs input{position:absolute;inset:0;width:100%;height:26px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.rs input:disabled{cursor:default}
.rs input::-webkit-slider-runnable-track{height:9px;border-radius:6px;background:linear-gradient(180deg,#09111e,#1b3050);box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
.rs input::-moz-range-track{height:9px;border-radius:6px;background:linear-gradient(180deg,#09111e,#1b3050)}
.rs input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:22px;margin-top:-7px;border-radius:7px;background:linear-gradient(180deg,#e2ebf7,#93a7c1 55%,#6c809b);border:1px solid #2a3a52;box-shadow:0 2px 6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .12s}
.rs input:active::-webkit-slider-thumb{transform:scale(1.08)}
.rs input::-moz-range-thumb{width:28px;height:20px;border-radius:7px;background:linear-gradient(180deg,#e2ebf7,#93a7c1);border:1px solid #2a3a52}
.mk{position:absolute;top:0;left:calc(var(--m) * (100% - 30px) + 15px);width:0;height:0;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--warn);filter:drop-shadow(0 0 4px rgba(255,200,61,.8));transition:left .18s linear;pointer-events:none}
[dir=rtl] .mk{left:auto;right:calc(var(--m) * (100% - 30px) + 15px);margin-left:0;margin-right:-5px}
.chip{font:800 9.5px/1 var(--font);letter-spacing:.06em;padding:3px 7px;border-radius:7px;border:1px solid #2f6b4f;background:rgba(70,224,160,.12);color:var(--ok);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip.off{border-color:#8f2a38;background:rgba(255,84,104,.18);color:var(--bad)}
.btns{display:flex;gap:6px;align-items:stretch}
.b{flex:1;min-width:0;font:800 calc(11.5px*var(--fs))/1.1 var(--font);padding:0 4px;height:44px;border:1px solid #2a436b;border-radius:11px;background:linear-gradient(180deg,#1d3558,#13233d);cursor:pointer;box-shadow:0 2px 0 #08101c;transition:transform .1s var(--ease),background .2s,color .2s;overflow:hidden;text-overflow:ellipsis}
.b:active{transform:scale(.95)}.b.on{background:linear-gradient(180deg,#7be0ff,#2aa8e0);color:#04202f;border-color:#7be0ff}.b:disabled{opacity:.4}.b[hidden]{display:none}
.azw{position:relative;flex:1.8;min-width:0}
#az,#rst{position:relative;width:100%;height:44px;font:800 calc(14px*var(--fs))/1 var(--font);letter-spacing:.1em;color:#fff;border:1px solid #7d1022;border-radius:11px;background:linear-gradient(180deg,#ff6b7c,#c91f37);box-shadow:0 3px 0 #6a0d1c;overflow:hidden;cursor:pointer;transition:transform .1s}
#az:active{transform:translateY(2px);box-shadow:0 1px 0 #6a0d1c}
#az i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.45)}
#az span,#rst span{position:relative}
#rst{background:linear-gradient(180deg,#58e3a9,#1f9b68);border-color:#11663f;box-shadow:0 3px 0 #0b4a2d;color:#04140c}
#rst[hidden],#az[hidden]{display:none}
#rst:disabled{filter:grayscale(.8);opacity:.55}
#cover{position:absolute;inset:0;border-radius:11px;background:repeating-linear-gradient(45deg,#f2c200 0 9px,#1a1a1a 9px 18px);border:1px solid #000;display:flex;align-items:center;justify-content:center;transform-origin:50% 0;transition:transform .32s var(--ease),opacity .32s;cursor:pointer;z-index:2}
#cover span{background:#1a1a1a;color:#f2c200;font:800 10.5px/1 var(--font);letter-spacing:.08em;padding:5px 8px;border-radius:6px;white-space:nowrap}
#cover.open{transform:perspective(320px) rotateX(100deg);opacity:0;pointer-events:none}
#cover[hidden]{display:none}
#kbHint{display:none;color:var(--dim);font-size:11px;text-align:center;line-height:1.4}
/* katman ekranları */
#ov{position:absolute;inset:0;z-index:10;overflow-y:auto;overflow-x:hidden;background:radial-gradient(ellipse at 50% 0%,#14304f,#060b14 72%);overscroll-behavior:contain}
#ov[hidden]{display:none}
.scr{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 0 30px;max-width:520px;margin:0 auto}
#ov.in .scr{animation:sIn .38s var(--ease) both}#ov.back .scr{animation:sBack .38s var(--ease) both}#ov.up .scr{animation:sUp .42s var(--ease) both}
[dir=rtl] #ov.in .scr{animation-name:sBack}[dir=rtl] #ov.back .scr{animation-name:sIn}
@keyframes sIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}@keyframes sBack{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}@keyframes sUp{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
.stag>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.hero{width:100%;flex:none;position:relative;overflow:hidden}
.hero svg{display:block;width:100%;height:auto}
.hero h1{position:absolute;left:0;right:0;bottom:14px;margin:0;font-size:clamp(24px,8vw,34px);letter-spacing:.1em;text-align:center;background:linear-gradient(180deg,#fff,#8fd8ff 60%,#4aa6d8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,.85));animation:glowT 4s ease-in-out infinite}
@keyframes glowT{50%{filter:drop-shadow(0 0 14px rgba(95,211,255,.55)) drop-shadow(0 2px 8px rgba(0,0,0,.85))}}
.hero small{position:absolute;left:0;right:0;bottom:0;text-align:center;color:#9fb6d6;font-size:10.5px;letter-spacing:.18em}
.hero .lgbtn{position:absolute;top:10px;inset-inline-end:10px;font:700 12px/1 var(--font);padding:7px 10px;border-radius:10px;border:1px solid rgba(143,216,255,.4);background:rgba(6,14,26,.55);cursor:pointer;backdrop-filter:blur(4px)}
@keyframes steam{0%{transform:translateY(0) scale(.7);opacity:0}20%{opacity:.55}100%{transform:translateY(-50px) scale(1.6);opacity:0}}
.sm{animation:steam 5s linear infinite;transform-box:fill-box;transform-origin:center}.sm:nth-child(2){animation-delay:1.6s}.sm:nth-child(3){animation-delay:3.2s}
@keyframes pulse{50%{opacity:.5}}.glow{animation:pulse 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}.st1{animation:tw 3s ease-in-out infinite}.st2{animation:tw 4.3s ease-in-out infinite 1s}
@keyframes win{50%{opacity:.35}}.wn{animation:win 6s ease-in-out infinite}
.h3{margin:4px 0 0;font-size:12px;letter-spacing:.2em;color:#7e96b6;font-weight:800;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;padding:0 14px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 8px 11px;border:1px solid #2a436b;border-radius:16px;background:linear-gradient(180deg,#182b4c,#0f1c33);font:inherit;cursor:pointer;box-shadow:0 3px 0 #08101c;transition:transform .18s var(--ease),box-shadow .18s,border-color .2s;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(95,211,255,.18),transparent 60%);opacity:0;transition:opacity .25s}
.tile:hover{transform:translateY(-3px);border-color:#3d6aa1;box-shadow:0 8px 20px rgba(0,0,0,.4)}.tile:hover::before{opacity:1}
.tile:active{transform:translateY(1px) scale(.98)}
.tile svg{width:66px;height:56px;transition:transform .3s var(--ease)}.tile:hover svg{transform:scale(1.08)}
.tile b{font-size:16px}.tile span{font-size:calc(10.5px*var(--fs));color:var(--muted);line-height:1.25;min-height:26px;text-align:center}.tile .st{color:#ffd23f;font-size:11px;letter-spacing:2px;min-height:12px}
.cards{display:flex;flex-direction:column;gap:9px;width:100%;padding:0 14px}
.card{display:flex;align-items:center;gap:12px;text-align:start;padding:12px 13px;border:1px solid #2a436b;border-radius:15px;background:linear-gradient(180deg,#18294a,#0f1c33);font:inherit;cursor:pointer;box-shadow:0 3px 0 #08101c;transition:transform .16s var(--ease),border-color .2s,box-shadow .2s}
.card:hover{border-color:#3d6aa1;transform:translateY(-2px)}.card:active{transform:translateY(1px) scale(.99)}
.card .ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#0b1626;border:1px solid #2a436b}
.card .tx{flex:1;min-width:0}.card b{display:block;font-size:calc(15px*var(--fs))}.card span{display:block;font-size:calc(12px*var(--fs));color:var(--muted);line-height:1.35;margin-top:2px}
.card .st{flex:none;text-align:end;color:#ffd23f;font-size:13px;letter-spacing:2px;white-space:nowrap}.card .st small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:0;margin-top:2px}
.card.hard .ic{border-color:#8f2a38;background:#1a0c14}
.stats{width:100%;padding:0 14px;display:flex;flex-direction:column;gap:7px}
.stat{display:flex;align-items:center;gap:8px;font-size:calc(11px*var(--fs))}.stat em{font-style:normal;flex:0 0 112px;text-align:start;color:var(--muted)}
.stat i{flex:1;height:7px;border-radius:5px;background:#0a1220;position:relative;overflow:hidden}.stat i s{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:5px;width:0;transition:width 1s var(--ease) .25s}
.stat b{flex:0 0 100px;text-align:end;font-size:10px;letter-spacing:.04em}
.mini{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 14px}
.ghost{font:700 calc(13px*var(--fs))/1 var(--font);padding:11px 15px;border-radius:12px;border:1px solid #2b4a74;background:rgba(10,20,36,.72);cursor:pointer;transition:transform .12s var(--ease),border-color .2s,background .2s}
.ghost:hover{border-color:#3d6aa1;background:rgba(20,36,60,.85)}.ghost:active{transform:scale(.96)}.ghost.sel{border-color:var(--acc);color:var(--acc)}
.btn{font:800 calc(16px*var(--fs))/1 var(--font);padding:14px 28px;border:0;border-radius:14px;background:linear-gradient(180deg,#7be0ff,#2aa8e0);color:#052033;box-shadow:0 4px 0 #14709b,0 10px 24px rgba(42,168,224,.25);cursor:pointer;min-width:210px;transition:transform .12s var(--ease),box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #14709b}
.btn.go{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{50%{box-shadow:0 4px 0 #14709b,0 0 30px rgba(95,211,255,.55)}}
.pad{padding:0 18px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;text-align:center}
.scr h2{margin:0;font-size:calc(23px*var(--fs))}
.scr p{margin:0;max-width:360px;color:var(--muted);font-size:calc(13.5px*var(--fs));line-height:1.5}
.scr ul{margin:0;padding-inline-start:18px;text-align:start;max-width:380px;color:#a8bcd6;font-size:calc(13px*var(--fs));line-height:1.5}
.scr li+li{margin-top:4px}
.top{width:100%;display:flex;align-items:center;gap:8px;padding:14px 14px 0}
.top h2{flex:1;text-align:center}
.iconb{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid #2b4a74;background:rgba(10,20,36,.7);font:700 18px/1 var(--font);cursor:pointer;transition:transform .12s}
.iconb:active{transform:scale(.92)}
small.d{display:block;color:#6a82a3;font-size:11px;max-width:340px;line-height:1.45;text-align:center;padding:0 16px}
/* brifing */
.brief{width:calc(100% - 28px);max-width:440px;background:linear-gradient(180deg,#152843,#0e1b30);border:1px solid #2a436b;border-radius:18px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.brief h4{margin:0 0 4px;font-size:11px;letter-spacing:.18em;color:#7e96b6}
.brief .obj{font-size:calc(15px*var(--fs));line-height:1.45;color:#fff;font-weight:700}
.brief .tip{display:flex;gap:10px;align-items:flex-start;font-size:calc(13px*var(--fs));line-height:1.45;color:#b7c9e2}
.brief .tip i{flex:none;font-style:normal;width:22px;height:22px;border-radius:7px;background:#0b1626;border:1px solid #2a436b;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--acc)}
.chk{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer;background:none;border:0;padding:4px 0}
/* ayarlar */
.sets{width:100%;max-width:470px;display:flex;flex-direction:column;gap:12px;padding:0 14px;text-align:start}
.sec{background:linear-gradient(180deg,#14253f,#0d1a2e);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sec h3{margin:0;display:flex;align-items:center;gap:10px;padding:12px 14px 6px;font-size:11.5px;letter-spacing:.18em;color:#8fb3da;font-weight:800}
.sec h3 i{font-style:normal;font-size:16px;letter-spacing:0}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid rgba(34,57,92,.6);min-height:52px}
.sec h3+.sr{border-top:0}
.sr .lb{flex:1;min-width:0}.sr .lb b{display:block;font-size:calc(13.5px*var(--fs));font-weight:700}.sr .lb small{display:block;color:var(--dim);font-size:calc(11.5px*var(--fs));margin-top:2px;line-height:1.35}
.sr input[type=range]{width:140px}
.sw{flex:none;position:relative;width:48px;height:28px;border-radius:15px;border:1px solid #2b4a74;background:#0b1626;cursor:pointer;transition:background .25s,border-color .25s;padding:0}
.sw i{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#7d93b2;transition:inset-inline-start .25s var(--ease),background .25s,transform .25s;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.sw[aria-checked=true]{background:#1d6f53;border-color:#46e0a0}.sw[aria-checked=true] i{inset-inline-start:23px;background:#e9fff5}
.sw:active i{transform:scale(.9)}
.seg{flex:none;display:flex;background:#0b1626;border:1px solid #2b4a74;border-radius:11px;padding:3px;gap:3px}
.seg button{font:700 calc(12px*var(--fs))/1 var(--font);padding:8px 10px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.seg button[aria-checked=true]{background:linear-gradient(180deg,#2c5a8c,#1d3d63);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.seg.wrap{flex-wrap:wrap;justify-content:flex-end}
.langrow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;text-align:start;cursor:pointer}
.langrow b{font-size:15px}.langrow span{color:var(--muted);font-size:12px}.langrow em{margin-inline-start:auto;font-style:normal;color:var(--acc);font-size:18px}
.srch{width:calc(100% - 28px);max-width:440px;display:flex;align-items:center;gap:8px;background:#0b1626;border:1px solid #2b4a74;border-radius:13px;padding:0 12px}
.srch input{flex:1;min-width:0;height:44px;background:transparent;border:0;color:var(--ink);font:600 15px/1 var(--font);outline:none}
.llist{width:calc(100% - 28px);max-width:440px;display:flex;flex-direction:column;gap:6px}

<script>
(() => {
'use strict';

/* Basitleştirilmiş, EĞİTİM amaçlı reaktör modelleri (RBMK, PWR, BWR, CANDU). Sayılar kamuya açık kaynaklardan hafızayla alınmış yaklaşık değerlerdir;
   mühendislik hesabı için KULLANILMAZ. Ortak yapı: nokta kinetik (tek gecikmiş grup), Xe-135/I-135 zinciri, buhar boşluğu ve Doppler geri beslemesi,
   çubuk hızı/ORM, türe özgü: RBMK pozitif boşluk + pozitif scram + sıkışma; PWR borik asit + moderatör sıcaklığı; BWR debiyle güç; CANDU hızlı kapatma + güçlü ksenon. */
const M = (() => {
  const Z = 300, gI = 0.061, gX = 0.003, lI = 0.1055, lX = 0.0758, lamD = 0.08;
  const XeqF = (n, kb) => (gI + gX) * n / (lX + kb * n);

best":"Best {0}","pick_s":"CHOOSE A SCENARIO","br_obj":"OBJECTIVE","br_stars":"STARS","br_tips":"TIPS","br_ctl":"CONTROLS","br_starsT":"★ 40% · ★★ 65% · ★★★ 85% of the shift on target. Any trip caps the result at ★★.","br_ctl_gen":"Top slider: AUTO power setpoint. Middle: rods (manual mode). Bottom: main coolant pumps.","br_ctl_pwr":"Top slider: grid load. Middle: rods (AUTO holds Tavg). Bottom: boron concentration.","br_ctl_bwr":"Top slider: AUTO power setpoint. Middle: control blades. Bottom: recirculation flow (AUTO drives it).","br_prot":"Protection: {0}. Change it with the button at the top or in Settings.","br_skip":"Don't show this briefing again","start":"START SHIFT","br_rbmk1":"Rods are slow (0.4 m/s). Start moving them before the demand changes.","br_rbmk2":"Here steam adds power. Never let the period get short; AUTO keeps it around 40 s.","br_rbmk3":"Keep ORM above 15. Xenon after a power drop will tempt you to pull rods.","br_pwr1":"AUTO keeps the average coolant temperature (Tavg) on program. Watch the Tavg readout.","br_pwr2":"Hotter water lowers power, so the plant follows the load by itself.","br_pwr3":"Xenon is slow: correct it with boron (fewer ppm add reactivity).","br_bwr1":"Flow sets power: more recirculation flow sweeps out steam and raises power.","br_bwr2":"AUTO moves the pumps, not the rods. The rods set the base power level.","br_bwr3":"Flow alone covers roughly 55-100% power. Below that, insert the blades yourself.","br_candu1":"Very little spare reactivity: keep the adjusters near their normal position.","br_candu2":"Shutdown is very fast (1 s), but a long stop at low power ends in xenon poison-out.","br_candu3":"If you trip, reset and restart quickly before xenon wins.","br_test1":"Power is low and xenon is high. A regulator fault will hit at 60 s; rods are locked until 100 s.","br_test2":"The interlock stops withdrawal at ORM 15. Bypassing it repeats the 1986 mistake.","br_test3":"Refusing the test, or waiting for xenon to decay, is a valid choice.","paused":"Paused","restart":"Restart","sec_sound":"SOUND","sec_play":"GAMEPLAY","sec_view":"DISPLAY","sec_data":"DATA","o_sound":"Sound effects","o_vol":"Volume","o_amb":"Reactor hum","o_ambD":"Ambient sound that follows the power level","o_hap":"Vibration","o_hapD":"On trips and alarms","o_prot":"Protection system","o_slow":"Slow motion","o_slowD":"Time slows down during power spikes","o_hints":"Briefings and tips","o_hintsD":"Show a briefing before each scenario","o_units":"Power units","o_text":"Text size","t_norm":"Normal","t_big":"Large","o_motion":"Animations","m_auto":"System","m_red":"Reduced","m_full":"Full","o_flash":"Screen flashes","o_flashD":"Red flashes on trips and alarms","o_reset":"Reset progress","o_resetD":"Deletes stars, best scores and hidden briefings","o_resetQ":"Delete all progress?","o_resetDone":"Progress deleted.","o_ver":"Version {0}","search":"Search languages","lang_note":"Help cards also show the English technical term.","g_prot":"Protection system","g_protT":"Three stages: WARNING (lamp and beep when the period gets short), STEPBACK (rods are driven in automatically) and TRIP (all rods in). Assist mode warns and steps back, and trips only in extreme danger. After a trip, press RESET once the rods are fully in.","g_period":"Reactor period","g_periodT":"The time it takes power to grow about 2.7 times. 60 s is gentle, under 10 s is fast, under 3 s is dangerous. A short period is the first sign of trouble.","g_rbmk":"RBMK: positive void","g_rbmkT":"Graphite slows the neutrons and the cooling water mostly absorbs them. When the water boils, fewer neutrons are absorbed and power rises, which makes more steam. Rods are slow and their graphite tips briefly add reactivity on a scram.","kb_title":"Keyboard","kb_pow":"Power setpoint or rods","kb_flow":"Flow or boron","kb_big":"Hold for bigger steps","kb_trip":"Hold to trip (AZ-5 / SCRAM)","kb_reset":"Reset after a trip","kb_pause":"Pause","kb_speed":"Simulation speed","kb_view":"Core or plant view","gotit":"Got it","m_bwr_min":"AUTO is at minimum flow: insert the control blades to go lower.","m_bwr_max":"AUTO is at maximum flow: withdraw the control blades for more power.","pause":"Pause","upg":"UPGRADES","upg_sub":"Real plant modifications. Earn credits by completing shifts.","upg_test":"The 1986 test always runs the original design: upgrades are off.","upg_on":"Upgrades active: {0}/3","upg_new":"Upgrade installed!","cr":"Credits","inst":"INSTALLED","installing":"Installing…","need":"{0} more","fx_scram":"Full scram time","fx_ps":"Positive scram","fx_void":"Void coefficient","fx_bor":"Boron rate","fx_rod":"Rod speed","fx_worth":"Total rod worth","fx_flowr":"Flow range","fx_min":"Minimum reserve","fx_auto":"AUTO min. period","u_rbmk_fastaz":"Fast scram (AZ-5)","u_rbmk_fastaz_d":"Post-1986 change: the rods fully insert in about 12 s instead of 18 s.","u_rbmk_rods":"Redesigned rods","u_rbmk_rods_d":"Longer graphite displacers and absorbers: the positive scram effect almost disappears.","u_rbmk_absorb":"Extra absorbers + 2.4% fuel","u_rbmk_absorb_d":"About 80 fixed absorbers and richer fuel halve the positive void coefficient.","u_pwr_boron":"Fast boration","u_pwr_boron_d":"Bigger charging pumps and boric acid tanks change boron about twice as fast.","u_pwr_rodctl":"Digital rod control","u_pwr_rodctl_d":"Faster drive mechanisms and a smarter regulator follow the load more tightly.","u_pwr_grey":"Grey control rods","u_pwr_grey_d":"Load-follow rods (like the French \"mode G\") add rod worth, so you rely less on boron.","u_bwr_recirc":"Variable-speed recirc pumps","u_bwr_recirc_d":"Frequency converters widen the flow-control range down to about 45% power.","u_bwr_fmcrd":"Fine-motion rod drives","u_bwr_fmcrd_d":"Electric drives (as in the ABWR) move the blades faster and more smoothly.","u_bwr_icf":"Increased core flow","u_bwr_icf_d":"A licensed extra flow margin lets AUTO reach higher power with the pumps alone.","u_candu_boost":"Booster rods","u_candu_boost_d":"Enriched rods that add reactivity to override xenon after a power drop.","u_candu_fastadj":"Faster adjuster drives","u_candu_fastadj_d":"The adjuster rods move faster, so corrections take effect sooner.","u_candu_lzc":"Liquid zone controllers","u_candu_lzc_d":"Light-water compartments give fast, fine control: AUTO can raise power faster.","quick":"PLAY","k_title":"Reactor Buddy","k_goal":"Light up the city! Give it just as much power as it needs, and keep Buddy cool.","k_level":"Level {0}","k_tip1":"Slide the lever: right for more power, left for less!","k_ev_night":"Night time! Everyone is asleep. Less power!","k_ev_evening":"Evening! Everyone turns on the lights!","k_ev_factory":"A toy factory opened! More power!","k_ev_match":"Big match on TV! Everyone is watching!","k_ev_rain":"Rainy day! Heaters need some power.","k_ev_morning":"Good morning! The city wakes up.","k_too_hot":"I'm too hot! Tap the water!","k_low":"The houses are dark! More power!","k_good":"Yay! The city is happy!","k_faint":"Oops! I fainted… cooling down.","k_back":"I'm back! Let's go!","k_win":"Great job!","k_lose":"Try again!","k_next":"Next","k_shop":"Hats","k_expert":"Expert simulator","k_wear":"Wear","k_wearing":"Wearing","h_party":"Party hat","h_cap":"Cap","h_glasses":"Cool glasses","h_chef":"Chef hat","h_crown":"Crown","h_wizard":"Wizard hat"},"tr":{"title":"REAKTÖR LAB","sub":"NÜKLEER REAKTÖR SİMÜLATÖRÜ","edu":"Basitleştirilmiş fizikli eğitim simülatörü. Mühendislik için kullanılamaz. Gerçek kişiler gösterilmez.","read":"Kamuya açık analizlere dayanır (ör. IAEA INSAG-7). Sayılar basitleştirilmiş yaklaşıklardır.","pick":"REAKTÖR SEÇ","back":"Geri","how":"NASIL ÇALIŞIR","set":"AYARLAR","again":"Tekrar","menu":"Menü","resume":"Devam","close":"Kapat","rn_rbmk":"Grafit · hafif su","rn_pwr":"Basınçlı su · bor","rn_bwr":"Kaynar su · debi kontrolü","rn_candu":"Ağır su · doğal uranyum","rd_rbmk":"Grafit yavaşlatıcılı kanal reaktörü. Buhar DAHA ÇOK güç üretir (pozitif boşluk katsayısı). Yavaş çubuklar ve pozitif scram etkisi. Evcilleştirmesi en zoru.","rd_pwr":"En yaygın tasarım. Su ısındıkça güç düşer, kendini dengeler. Borik asit yavaş değişimleri kontrol eder. Çubuklar saniyeler içinde düşer.","rd_bwr":"Su çekirdekte kaynar. Daha çok buhar daha az güç demek, bu yüzden gücü DEBİ belirler: pompayı hızlandır, güç artsın.","rd_candu":"Ağır su ve doğal uranyum. Çok hızlı kapatma sistemleri, küçük pozitif boşluk etkisi ve güç uzun süre düşük kalırsa güçlü ksenon \"zehirlenme kilidi\".","st_void":"Boşluk katsayısı","st_trip":"Kapatma hızı","st_stab":"Kendini dengeleme","st_diff":"Zorluk","v_pos":"POZİTİF","v_neg":"NEGATİF","v_small":"KÜÇÜK +","v_none":"SIFIRA YAKIN","sp_slow":"YAVAŞ · 18 sn","sp_fast":"HIZLI · 2 sn","sp_vfast":"ÇOK HIZLI · 1 sn","sp_med":"ORTA · 3 sn","stb_low":"DÜŞÜK","stb_hi":"YÜKSEK","stb_mid":"ORTA","d_hard":"ZOR","d_med":"ORTA","d_easy":"KOLAY","d_free":"SERBEST","s_train":"Eğitim","s_traind":"Talep eğrisini takip et. Bu reaktörün nasıl tepki verdiğini öğren.","s_move":"Güç Manevrası","s_moved":"Gücü düşür, sonra geri getir. Ksenon sana karşı.","s_test":"Test","s_testd":"1986 tarzı gece vardiyası: ksenon çukuru, patron baskısı, tek karar.","s_sand":"Serbest mod","s_sandd":"Tam güç, senaryo yok. Serbestçe dene.","c_rods_rbmk":"ÇUBUK GRUBU","c_rods_pwr":"KONTROL ÇUBUKLARI","c_rods_bwr":"KONTROL BIÇAKLARI","c_rods_candu":"AYAR ÇUBUKLARI","c_set":"OTOMATİK HEDEF (MW)","c_flow":"ANA POMPALAR","c_flow_bwr":"RESİRKÜLASYON DEBİSİ","c_boron":"BOR (ppm)","c_load":"ŞEBEKE YÜKÜ (%)","auto":"OTOMATİK","man":"MANUEL","test":"TESTİ BAŞLAT","conf":"ONAY?","trip_rbmk":"AZ-5","trip_o":"SCRAM","mw":"MW","hdr1":"REAKTÖR ÇEKİRDEĞİ","hdr2":"GÜÇ","hdr3":"GÜÇ GRAFİĞİ (log MW)","hdr4":"KSENON-135","hdr5":"ÇUBUK / DEBİ","hdr6":"UYARI PANELİ","hdr7":"KONTROL ODASI","orm_rbmk":"ORM","orm_o":"ÇUBUK REZERVİ","rho":"REAKTİVİTE","per":"Periyot","void":"Buhar boşluğu","fl":"Debi","rd":"Çubuk","tavg":"Tavg","bor":"Bor","xeT":"KSENON ZEHİRLENMESİ","xeRods":"≈ {0} çubuk reaktivite yiyor","xeUp":"artıyor","xeDn":"azalıyor","xeFl":"sabit","xeNorm":"normal","xeHigh":"YÜKSEK","xePit":"KSENON ÇUKURU","aM1":"REZERV \u003c {0}","aM2":"REZERV \u003c {0}!","aLow":"DÜŞÜK GÜÇ","aPer":"KISA PERİYOT","aTrip":"KAPATMA AKTİF","aJam":"ÇUBUK SIKIŞTI","aTest":"TEST SÜRÜYOR","aByp":"DEVRE DIŞI","aTavg":"TAVG DIŞI","aXe":"KSENON YÜKSEK","goal_train":"Hedef: talep eğrisini ±%5 içinde takip et.","goal_move":"Hedef: ksenonu yönet ve talebi takip et.","goal_test":"Hedef: vardiyayı güvenle bitir. Kural: ORM ≥ 15.","goal_sand":"Serbest mod: hedef yok.","goal_pwr":"Hedef: Tavg'yi programın ±2,5 K içinde tut.","done":"Vardiya bitti","destroyed":"Reaktör tahrip oldu","safe":"Güvenli kapatma","explain":"Ne oldu","m_t1":"Talebi takip et. Çubuklar yavaş, önceden planla.","m_t2":"Talep değişti! Takip et.","m_mv":"Yük düşüşü: gücü indir, sonra geri çık. Ksenona dikkat.","m_hold":"Serbest oyun. Her şey açık.","m_a0":"Vardiya amiri: yaklaşık 700 MW'ta kal. Koşma testi planlandı.","m_a1":"Regülatör hatası: güç hızla düşüyor!","m_a2":"Amir: gücü 200 MW'a çıkar ve testi HEMEN yap. Gerekirse kilidi devre dışı bırak.","m_a2b":"Kilit: ORM 15'te çubuk çekme engellendi. Ksenonun azalması zaman alır (×4 dene).","m_a3":"Koşma başladı: pompalar yavaşlıyor.","m_a4":"Test bitti. Planlı kapatma için reaktörü durdur.","m_m1":"Rezerv uyarı seviyesinin altında.","m_m2":"Rezerv minimumun altında: kapatma şart.","m_jam":"Güç sıçraması: kanallar deforme oldu, çubuklar sıkıştı!","m_lock":"KİLİT: çubuklar daha fazla çekilemez.","m_exc":"GÜÇ SIÇRAMASI! Ağır çekim açıldı. Reaktörü DURDUR!","m_tp":"OTOMATİK KAPATMA: kısa periyot","m_th":"OTOMATİK KAPATMA: yüksek güç","m_tf":"OTOMATİK KAPATMA: düşük soğutucu debisi","m_poison":"Ksenon zehirlenmesi: güç tutulamıyor. Yeniden başlatma ~40 saat engelli.","why1":"Pozitif buhar boşluğu katsayısı: güç artar → buhar artar → reaktivite artar.","why2":"Pozitif scram etkisi: grafit uçlar, düşük ORM'li çekirdeğe girerken önce reaktiviteyi ARTIRIR.","why3":"Ksenon çubukları dışarı çektirdi: ORM {0}'e düştü.","why4":"Çubuklar ~18 sn'de iner ve kanallar deforme olunca sıkıştı.","why6":"Kilit ve koruma devre dışı bırakıldı.","why7":"Kitap gibi sonuç: ksenonun çözülmesini bekledin ve testi ORM ≥ 15 ile bitirdin.","why8":"Ksenon, çubukların telafi edebileceğinden hızlı birikti.","g_orm":"ORM / çubuk rezervi","g_ormT":"Eşdeğer kaç kontrol çubuğunun içeride olduğu = kapatma güvenliği. RBMK kuralı: ≥ 26 tut, mutlak alt sınır 15. Diğer tasarımlar çubuk giriş limiti kullanır.","g_xe":"Ksenon","g_xeT":"Ksenon-135, iyottan oluşan bir nötron zehiridir. Güç düşünce birikir, saatler sonra tepe yapar. Burada zaman ×300 sıkıştırıldı. Gücü tutmak için başka yerden reaktivite eksiltmelisin (çubuk çek ya da bor seyrelt).","g_void":"Buhar boşlukları","g_voidT":"Kaynayan su buhar kabarcığı yapar. RBMK'da daha çok buhar DAHA ÇOK güç demek (tehlikeli geri besleme). BWR'da DAHA AZ güç, bu yüzden debi gücü belirler.","g_rod":"Çubuklar ve kapatma","g_rodT":"Kontrol çubukları nötron emer. RBMK çubukları 0,4 m/sn gider, tam iniş ~18 sn; grafit uçları kısa süre reaktiviteyi ARTIRIR (pozitif scram etkisi). Diğer reaktörlerde çubuklar 1-3 sn'de düşer.","g_rho":"Reaktivite $","g_rhoT":"0 $ = sabit güç. +1 $ = ani kritik: güç bir iki saniyede patlar. 0'ın altı = güç düşer.","g_pwr":"PWR: bor","g_pwrT":"Borik asit nötron emer. Seyreltince yavaşça reaktivite artar (ksenona karşı). Sıcak soğutucu gücü kendiliğinden düşürür, santral şebeke yükünü izler.","g_bwr":"BWR: debi = güç","g_bwrT":"Daha çok resirkülasyon debisi buharı çekirdekten süpürür ve gücü artırır. Az debi düşürür. Çubuklar taban seviyeyi belirler.","g_candu":"CANDU: zehirlenme kilidi","g_canduT":"Doğal uranyumun fazla reaktivitesi azdır. Güç birkaç saat düşük kalırsa ksenon ayarlayıcıların yenebileceğinden fazla birikir ve reaktör ~40 saat kilitlenir.","st_lang":"DİL","u_mw":"MW","u_pct":"anma gücü %","yes":"Evet","no":"Hayır","st_about":"HAKKINDA","doc_title":"Reactor Lab · Nükleer Reaktör Simülatörü","slow":"AĞIR ÇEKİM","tgt":"Hedef","hdr_plant":"SANTRAL","pl_core":"Kalp","pl_turb":"Türbin","pl_gen":"Jeneratör","pl_cond":"Kondenser","pl_pump":"Pompa","pl_sg":"Buhar üret.","pl_press":"Basınçlandırıcı","pl_drum":"Buhar tamburu","pl_cal":"Kalandriya","pl_sep":"Ayırıcı","pl_fw":"Besi suyu","pl_grid":"Şebeke","pl_steam":"Buhar","pl_water":"Su","tip_core":"Reaktör kalbinin üstten görünüşü. Yakıt, güç arttıkça daha parlak yanar. Koyu daireler kontrol çubuklarıdır: dolu kısım her birinin ne kadar içeride olduğunu gösterir. Tüm santrali görmek için ⇄ simgesine dokun.","tip_core_rbmk":"RBMK: grafit blok içinde yaklaşık 1.700 yakıt kanalı. Kanallardaki su nötron yutar; su kaynayıp buhara dönünce güç ARTAR. Kabarcıklar kanallardaki buharı gösterir.","tip_core_pwr":"PWR: yakıt demetleri 155 bar basınç altında, su hiç kaynamaz. Mavi renk, nötron yutan çözünmüş boru gösterir.","tip_core_bwr":"BWR: su kalbin içinde kaynar. Yakıt demetleri arasındaki haç biçimli bıçaklar kontrol çubuklarıdır. Daha çok buhar, daha AZ güç demektir.","tip_core_candu":"CANDU: ağır su tankı (kalandriya) içinde yatay basınç tüpleri. Dikey ayar çubukları reaktiviteyi ince ayarlar.","tip_plant":"Santralin tamamı: kalpteki ısı buhar üretir, buhar türbini döndürür, kondenser buharı yeniden suya çevirir ve pompalar geri gönderir. Akış hızı ve renkler simülasyona göre değişir.","tip_power":"Kalbin ısıl gücü. Göstergeler çubuk rezervini ve reaktiviteyi gösterir. Altlarında: reaktör periyodu ve bu tasarımın ana geri beslemesi.","tip_margin":"Çubuk rezervi: kalpte kaç çubuk eşdeğeri yutucu olduğu. Güvenli kapatma payındır. Sarı: uyarı düzeyinin altında. Kırmızı: asgarinin altında, kapatman gerekir.","tip_margin_rbmk":"ORM (işletme reaktivite payı): kalpteki eşdeğer çubuk sayısı. 1986 kuralları en az 15 istiyordu; kaza gecesi yaklaşık 8'di. Düşük ORM, AZ-5 kapatmasının ilk anda reaktivite EKLEMESİNE de yol açar.","tip_rho":"Dolar ($) cinsinden reaktivite. 0 $'da güç sabittir. Artıdaysa güç yükselir; 1 $'a yaklaştıkça daha hızlı. 1 $'da reaktör anlık kritiktir ve güç bir saniye içinde kontrolden çıkar.","tip_trend":"Son dakikalardaki güç, logaritmik ölçekte (her çizgi ×10). Kesikli çizgi talep ya da ayar değeridir. Kırmızı işaretler kapatmalardır.","tip_xe":"Ksenon-135 nötron yutar. Güç DÜŞTÜKTEN sonra (bozunan iyottan) birikir ve saatler sonra zirve yapar; yüksek güçte yanıp tükenir. %100, tam güçteki düzeydir. Zaman ×300 hızlandırılmıştır.","tip_rods":"Sol çubuk: çubukların içeri girme miktarı (oklar hareketi gösterir). Sağ çubuk: soğutucu debisi, PWR'de bor derişimi.","tip_lamps":"Alarm paneli. Sarı: uyarı. Turuncu: geri çekme (koruma çubukları içeri sürüyor). Kırmızı: kapatma, çubuk rezervi asgarinin altında ya da koruma devre dışı. Yanıp sönüyorsa hemen müdahale et.","aStep":"GERİ ÇEKME","aFlowLo":"DÜŞÜK DEBİ","aVoid":"YÜKSEK BOŞLUK","auto_off":"OTOMATİK kapalı","lim_on":"ÇUBUK LİMİTİ","lim_off":"LİMİT YOK","prot_full_s":"KORUMA","prot_assist_s":"YARDIMCI","prot_off_s":"KORUMA YOK","prot_full":"Tam","prot_assist":"Yardımcı","prot_off":"Kapalı","prot_full_d":"Gerçek santraldeki gibi: uyarılar, otomatik geri çekme ve otomatik kapatma.","prot_assist_d":"Uyarılar ve otomatik geri çekme. Yalnızca aşırı tehlikede kapatır. Önerilen.","prot_off_d":"Otomatik müdahale yok, yalnızca alarmlar. Her şey sana kalmış.","reset_trip":"SIFIRLA","kb_hint":"Tuşlar: ↑↓ güç · ←→ debi · M otomatik · X basılı tut: kapat · R yeniden başlat · Boşluk duraklat · H yardım","m_limon":"Çubuk limiti AÇIK: son çubuklar kalpte kalır.","m_limoff":"Çubuk limiti KAPALI: son çubukları çekmeni artık hiçbir şey engellemiyor!","m_prot_full":"Koruma TAM: geri çekme ve otomatik kapatma devrede.","m_prot_assist":"Koruma YARDIMCI: uyarı ve geri çekme; kapatma yalnızca aşırı tehlikede.","m_prot_off":"Koruma KAPALI. Artık tek başınasın.","m_trip_man":"Elle kapatma: tüm çubuklar içeri giriyor.","m_turb":"Türbin reaktörle birlikte devreden çıktı: yük 0'a indi.","m_candu_hint":"Çabuk yeniden ATİK Tavg'ı tutar). Alt: bor derişimi.","br_ctl_bwr":"Üst kaydırıcı: OTOMATİK güç ayarı. Orta: kontrol bıçakları. Alt: devridaim debisi (OTOMATİK onu sürer).","br_prot":"Koruma: {0}. Üstteki düğmeden ya da Ayarlar'dan değiştirebilirsin.","br_skip":"Bu brifingi bir daha gösterme","start":"VARDİYAYI BAŞLAT","br_rbmk1":"Çubuklar yavaş (0,4 m/sn). Talep değişmeden önce hareket ettirmeye başla.","br_rbmk2":"Burada buhar gücü artırır. Periyodun kısalmasına asla izin verme; OTOMATİK onu 40 sn civarında tutar.","br_rbmk3":"ORM'yi 15'in üstünde tut. Güç düşüşünden sonraki ksenon seni çubuk çekmeye zorlayacak.","br_pwr1":"OTOMATİK, ortalama soğutucu sıcaklığını (Tavg) programda tutar. Tavg göstergesini izle.","br_pwr2":"Isınan su gücü düşürür, bu yüzden santral yükü kendiliğinden izler.","br_pwr3":"Ksenon yavaştır: onu borla düzelt (daha az ppm reaktivite ekler).","br_bwr1":"Gücü debi belirler: daha çok devridaim debisi buharı süpürür ve gücü artırır.","br_bwr2":"OTOMATİK çubukları değil pompaları sürer. Çubuklar temel güç düzeyini belirler.","br_bwr3":"Debi tek başına gücün yaklaşık %55-100 aralığını karşılar. Daha aşağısı için bıçakları kendin içeri sür.","br_candu1":"Yedek reaktivite çok az: ayar çubuklarını normal konumlarına yakın tut.","br_candu2":"Kapatma çok hızlıdır (1 sn), ama düşük güçte uzun bir duruş ksenon zehirlenmesiyle biter.","br_candu3":"Kapatırsan, ksenon kazanmadan hızla sıfırla ve yeniden başlat.","br_test1":"Güç düşük, ksenon yüksek. 60. saniyede regülatör arızası olacak; çubuklar 100. saniyeye kadar kilitli.","br_test2":"Kilit, ORM 15'te çubuk çekmeyi durdurur. Kilidi devre dışı bırakmak 1986 hatasını tekrarlamaktır.","br_test3":"Testi reddetmek ya da ksenonun azalmasını beklemek geçerli bir seçimdir.","paused":"Duraklatıldı","restart":"Baştan başla","sec_sound":"SES","sec_play":"OYNANIŞ","sec_view":"GÖRÜNÜM","sec_data":"VERİ","o_sound":"Ses efektleri","o_vol":"Ses düzeyi","o_amb":"Reaktör uğultusu","o_ambD":"Güç düzeyine göre değişen ortam sesi","o_ha
