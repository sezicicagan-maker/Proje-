ktor. Dampf erzeugt MEHR Leistung (positiver Dampfblasenkoeffizient). Langsame Stäbe und ein positiver Scram-Effekt. Am schwersten zu bändigen.","rd_pwr":"Die häufigste Bauart. Heißeres Wasser bedeutet weniger Leistung, so stabilisiert sich der Reaktor selbst. Borsäure regelt langsame Änderungen. Die Stäbe fallen in Sekunden ein.","rd_bwr":"Das Wasser siedet im Kern. Mehr Dampf bedeutet weniger Leistung, daher bestimmt der DURCHSATZ die Leistung: schneller pumpen, mehr Leistung.","rd_candu":"Schwerwasser und Natururan. Sehr schnelle Abschaltsysteme, ein kleiner positiver Dampfblaseneffekt und eine starke Xenonvergiftung, wenn die Leistung zu lange niedrig bleibt.","st_void":"Dampfblasenkoeffizient","st_trip":"Abschalttempo","st_stab":"Eigenstabilität","st_diff":"Schwierigkeit","v_pos":"POSITIV","v_neg":"NEGATIV","v_small":"KLEIN +","v_none":"ETWA NULL","sp_slow":"LANGSAM · 18 s","sp_fast":"SCHNELL · 2 s","sp_vfast":"SEHR SCHNELL · 1 s","sp_med":"MITTEL · 3 s","stb_low":"NIEDRIG","stb_hi":"HOCH","stb_mid":"MITTEL","d_hard":"SCHWER","d_med":"MITTEL","d_easy":"LEICHT","d_free":"FREI","s_train":"Übung","s_traind":"Folge der Lastkurve. Lerne, wie dieser Reaktor reagiert.","s_move":"Lastwechsel","s_moved":"Senke die Leistung und fahr sie wieder hoch. Das Xenon arbeitet gegen dich.","s_test":"Der Test","s_testd":"Nachtschicht wie 1986: Xenongrube, Druck vom Chef, eine Entscheidung.","s_sand":"Sandkasten","s_sandd":"Volle Leistung, kein Drehbuch. Experimentiere nach Belieben.","c_rods_rbmk":"STABGRUPPE","c_rods_pwr":"STEUERSTÄBE","c_rods_bwr":"STEUERKREUZE","c_rods_candu":"TRIMMSTÄBE","c_set":"AUTO-SOLLWERT (MW)","c_flow":"HAUPTPUMPEN","c_flow_bwr":"UMWÄLZDURCHSATZ","c_boron":"BOR (ppm)","c_load":"NETZLAST (%)","auto":"AUTO","man":"HAND","test":"TEST STARTEN","conf":"SICHER?","trip_rbmk":"AZ-5","trip_o":"RESA","mw":"MW","hdr1":"REAKTORKERN","hdr2":"LEISTUNG","hdr3":"LEISTUNGSVERLAUF (log MW)","hdr4":"XENON-135","hdr5":"STAB / DURCHSATZ","hdr6":"MELDETABLEAU","hdr7":"WARTE","orm_rbmk":"ORM","orm_o":"STABRESERVE","rho":"REAKTIVITÄT","per":"Periode","void":"Dampfanteil","fl":"Durchsatz","rd":"Stäbe","tavg":"Tavg","bor":"Bor","xeT":"XENONVERGIFTUNG","xeRods":"frisst ≈ {0} Stäbe an Reaktivität","xeUp":"steigt","xeDn":"fällt","xeFl":"konstant","xeNorm":"normal","xeHigh":"HOCH","xePit":"XENONGRUBE","aM1":"RESERVE \u003c {0}","aM2":"RESERVE \u003c {0}!","aLow":"LEISTUNG NIEDRIG","aPer":"KURZE PERIODE","aTrip":"RESA AKTIV","aJam":"STÄBE KLEMMEN","aTest":"TEST LÄUFT","aByp":"ÜBERBRÜCKT","aTavg":"TAVG-ABWEICHUNG","aXe":"XENON HOCH","goal_train":"Ziel: Folge der Lastkurve auf ±5 % genau.","goal_move":"Ziel: Beherrsche das Xenon und folge der Last.","goal_test":"Ziel: Beende die Schicht sicher. Regel: ORM ≥ 15.","goal_sand":"Sandkasten: kein Ziel.","goal_pwr":"Ziel: Halte Tavg innerhalb von ±2,5 K um den Sollwert.","done":"Schicht beendet","destroyed":"Reaktor zerstört","safe":"Sicher abgeschaltet","explain":"Was geschah","m_t1":"Folge der Last. Die Stäbe sind langsam, plane voraus.","m_t2":"Die Last ändert sich! Folge ihr.","m_mv":"Lastabsenkung: Fahr die Leistung herunter und dann wieder hoch. Achte auf das Xenon.","m_hold":"Freies Spiel. Alles ist aktiv.","m_a0":"Schichtleiter: Etwa 700 MW halten. Der Auslaufversuch ist angesetzt.","m_a1":"Reglerfehler: Die Leistung fällt schnell!","m_a2":"Schichtleiter: Leistung auf 200 MW erhöhen und den Test SOFORT fahren. Verriegelung notfalls überbrücken.","m_a2b":"Verriegelung: Stabziehen bei ORM 15 blockiert. Das Xenon braucht Zeit zum Zerfallen (versuch es mit ×4).","m_a3":"Auslauf gestartet: Die Pumpen werden langsamer.","m_a4":"Test beendet. Schalte den Reaktor jetzt planmäßig ab.","m_m1":"Reserve unter dem Warnwert.","m_m2":"Reserve unter dem Minimum: Abschaltung erforderlich.","m_jam":"Leistungsstoß: Kanäle verformt, Stäbe klemmen!","m_lock":"VERRIEGELUNG: Die Stäbe lassen sich nicht weiter ziehen.","m_exc":"LEISTUNGSEXKURSION! Zeitlupe aktiv. Reaktor ABSCHALTEN!","m_tp":"AUTOMATISCHE ABSCHALTUNG: kurze Periode","m_th":"AUTOMATISCHE ABSCHALTUNG: hohe Leistung","m_tf":"AUTOMATISCHE ABSCHALTUNG: zu wenig Kühlmitteldurchsatz","m_poison":"Xenonvergiftung: Die Leistung ist nicht zu halten. Wiederanfahren für ~40 Stunden gesperrt.","why1":"Positiver Dampfblasenkoeffizient: mehr Leistung → mehr Dampf → mehr Reaktivität.","why2":"Positiver Scram-Effekt: Beim Einfahren in einen Kern mit niedriger ORM ERHÖHEN die Graphitverdränger zuerst die Reaktivität.","why3":"Die Xenonvergiftung erzwang das Ziehen der Stäbe: Die ORM fiel auf {0}.","why4":"Die Stäbe brauchen ~18 s zum Einfahren und klemmten, als sich die Kanäle verformten.","why6":"Verriegelung und Schutzsystem wurden überbrückt.","why7":"Wie aus dem Lehrbuch: Du hast das Xenon abklingen lassen und den Test mit ORM ≥ 15 beendet.","why8":"Das Xenon baute sich schneller auf, als die Stäbe es ausgleichen konnten.","g_orm":"ORM / Stabreserve","g_ormT":"Wie viele Steuerstäbe (umgerechnet) eingefahren sind = deine Abschaltsicherheit. RBMK-Vorschrift: mindestens 26 halten, absolutes Minimum 15. Andere Bauarten nutzen Einfahrgrenzen für die Stäbe.","g_xe":"Xenon-135","g_xeT":"Xenon-135 ist ein Neutronengift, das aus Iod entsteht. Es sammelt sich nach einer Leistungsabsenkung an und erreicht Stunden später sein Maximum. Hier läuft die Zeit ×300 schneller. Um die Leistung zu halten, musst du anderswo Absorber entfernen (Stäbe ziehen oder Bor verdünnen).","g_void":"Dampfblasen","g_voidT":"Siedendes Wasser bildet Dampfblasen. Beim RBMK bedeutet mehr Dampf MEHR Leistung (gefährliche Rückkopplung). Beim BWR bedeutet er WENIGER Leistung, deshalb regelt der Durchsatz die Leistung.","g_rod":"Stäbe & Abschaltung","g_rodT":"Steuerstäbe absorbieren Neutronen. RBMK-Stäbe fahren mit 0,4 m/s und brauchen ~18 s, bis sie ganz drin sind; ihre Graphitverdränger ERHÖHEN kurz die Reaktivität (positiver Scram-Effekt). Bei anderen Reaktoren fallen die Stäbe in 1–3 s ein.","g_rho":"Reaktivität $","g_rhoT":"0 $ = konstante Leistung. +1 $ = prompt kritisch: Die Leistung explodiert innerhalb von ein, zwei Sekunden. Unter 0 sinkt die Leistung.","g_pwr":"PWR: Bor","g_pwrT":"Borsäure absorbiert Neutronen. Verdünnst du sie, steigt die Reaktivität langsam (das wirkt gegen Xenon). Heißeres Kühlmittel senkt die Leistung von selbst, daher folgt die Anlage der Netzlast.","g_bwr":"BWR: Durchsatz = Leistung","g_bwrT":"Mehr Umwälzdurchsatz spült Dampf aus dem Kern und erhöht so die Leistung. Weniger Durchsatz senkt sie. Die Stäbe bestimmen das Grundniveau.","g_candu":"CANDU: Xenonvergiftung","g_canduT":"Natururan bietet wenig Überschussreaktivität. Bleibt die Leistung einige Stunden niedrig, baut sich mehr Xenon auf, als die Trimmstäbe ausgleichen können, und der Reaktor ist für ~40 Stunden gesperrt (Xenon-Totzeit).","st_lang":"SPRACHE","u_mw":"MW","u_pct":"% Nennleistung","yes":"Ja","no":"Nein","st_about":"INFO","doc_title":"Reactor Lab · Kernreaktor-Simulator","slow":"ZEITLUPE","tgt":"Soll","hdr_plant":"ANLAGE","pl_core":"Kern","pl_turb":"Turbine","pl_gen":"Generator","pl_cond":"Kondensator","pl_pump":"Pumpe","pl_sg":"Dampferz.","pl_press":"Druckhalter","pl_drum":"Dampftrommel","pl_cal":"Calandria","pl_sep":"Abscheider","pl_fw":"Speisewasser","pl_grid":"Netz","pl_steam":"Dampf","pl_water":"Wasser","tip_core":"Draufsicht auf den Kern. Der Brennstoff leuchtet umso heller, je höher die Leistung ist. Dunkle Kreise sind Steuerstäbe: Der gefüllte Teil zeigt, wie weit jeder eingefahren ist. Tippe auf ⇄, um die ganze Anlage zu sehen.","tip_core_rbmk":"RBMK: rund 1.700 Brennstoffkanäle in einem Graphitstapel. Das Wasser in den Kanälen absorbiert Neutronen; verdampft es, STEIGT deshalb die Leistung. Bläschen zeigen den Dampf in den Kanälen.","tip_core_pwr":"PWR: Brennelemente unter 155 bar, daher siedet das Wasser nie. Die Blaufärbung zeigt gelöstes Bor, das Neutronen absorbiert.","tip_core_bwr":"BWR: Das Wasser siedet im Kern. Die kreuzförmigen Elemente zwischen den Brennelementen sind die Steuerstäbe. Mehr Dampf bedeutet WENIGER Leistung.","tip_core_candu":"CANDU: waagerechte Druckrohre in einem Tank mit Schwerwasser (der Calandria). Senkrechte Trimmstäbe regeln die Reaktivität fein.","tip_plant":"Die ganze Anlage: Die Wärme aus dem Kern erzeugt Dampf, der Dampf treibt die Turbine an, der Kondensator macht ihn wieder zu Wasser und die Pumpen fördern es zurück. Strömungstempo und Farben folgen der Simulation.","tip_power":"Thermische Leistung des Kerns. Die Zeigerinstrumente zeigen die Stabreserve und die Reaktivität. Darunter: die Reaktorperiode und die wichtigste Rückkopplung dieser Bauart.","tip_margin":"Stabreserve: wie viele Stäbe an Absorber im Kern stecken. Das ist deine Abschaltreserve. Gelb: unter dem Warnwert. Rot: unter dem Minimum, du musst abschalten.","tip_margin_rbmk":"ORM (operative Reaktivitätsreserve): die äquivalente Anzahl von Stäben im Kern. Die Vorschriften von 1986 verlangten mindestens 15; in der Unglücksnacht waren es etwa 8. Eine niedrige ORM sorgt außerdem dafür, dass AZ-5 die Reaktivität zuerst ERHÖHT.","tip_rho":"Reaktivität in Dollar ($). Bei 0 $ ist die Leistung konstant. Positiv: Die Leistung steigt, umso schneller, je näher die Reaktivität an 1 $ liegt. Bei 1 $ ist der Reaktor prompt kritisch und die Leistung gerät binnen einer Sekunde außer Kontrolle.","tip_trend":"Leistung der letzten Minuten auf logarithmischer Skala (jede Linie ist ×10). Die gestrichelte Linie ist die Lastvorgabe oder der Sollwert. Rote Markierungen sind Abschaltungen.","tip_xe":"Xenon-135 absorbiert Neutronen. Es baut sich auf, nachdem die Leistung GESENKT wurde (aus zerfallendem Iod), und erreicht Stunden später sein Maximum; bei hoher Leistung brennt es weg. 100 % entspricht dem Volllastwert. Die Zeit läuft ×300 schneller.","tip_rods":"Linker Balken: Stabstellung (Pfeile zeigen die Bewegung). Rechter Balken: Kühlmitteldurchsatz, beim PWR die Borkonzentration.","tip_lamps":"Meldetableau. Gelb: Warnung. Orange: Leistungsabsenkung (der Schutz fährt Stäbe ein). Rot: Abschaltung, Stabreserve unter dem Minimum oder Schutz überbrückt. Blinken heißt: sofort handeln.","aStep":"ABSENKUNG","aFlowLo":"DURCHSATZ MIN","aVoid":"DAMPF HOCH","auto_off":"AUTO aus","lim_on":"STABGRENZE","lim_off":"GRENZE AUS","prot_full_s":"SCHUTZ","prot_assist_s":"ASSISTENZ","prot_off_s":"SCHUTZ AUS","prot_full":"Voll","prot_assist":"Assistenz","prot_off":"Aus","prot_full_d":"Wie in einem echten Kraftwerk: Warnungen, automatische Leistungsabsenkung und automatische Schnellabschaltung.","prot_assist_d":"Warnungen und automatische Leistungsabsenkung. Abschaltung nur bei extremer Gefahr. Empfohlen.","prot_off_d":"Keine automatischen Eingriffe, nur Alarme. Alles liegt bei dir.","reset_trip":"RÜCKSETZEN","kb_hint":"Tasten: ↑↓ Leistung · ←→ Durchsatz · M Auto · X halten zum Abschalten · R Rücksetzen · Leertaste Pause · H Hilfe","m_limon":"Stabgrenze EIN: Die letzten Stäbe bleiben im Kern.","m_limoff":"Stabgrenze AUS: Nichts hindert dich daran, die letzten Stäbe zu ziehen!","m_prot_full":"Schutz VOLL: Leistungsabsenkung und automatische Abschaltung sind scharf.","m_prot_assist":"Schutz ASSISTENZ: Warnungen und Leistungsabsenkung; Abschaltung nur bei extremer Gefahr.","m_prot_off":"Schutz AUS. Du bist auf dich allein gestellt.","m_trip_man":"Manuelle Abschaltung: Alle Stäbe fahren ein.","m_turb":"Turbinenschnellschluss mit dem Reaktor: Last auf 0 abgesenkt.","m_candu_hint":"Fahr bald wieder an, sonst vergiftet das Xenon den Kern.","m_reset_wait":"Rücksetzen geht erst, wenn alle Stäbe ganz eingefahren sind.","m_reset":"Abschaltung zurückgesetzt. Zieh Stäbe oder schalte AUTO ein, um wieder anzufahren.","m_alert":"Kurze Periode: Die Leistung steigt schnell.","m_step_p":"ABSENKUNG: Leistung steigt zu schnell, Stäbe fahren ein.","m_step_n":"ABSENKUNG: Leistung über dem Grenzwert, Stäbe fahren ein.","m_step_f":"ABSENKUNG: Kühlmitteldurchsatz zu gering für diese Leistung.","m_step_end":"Leistungsabsenkung beendet.","m_tiphint":"Hinweis: Tippe in jedem Feld auf ⓘ, um eine Erklärung zu sehen.","why_trips":{"one":"Der Reaktor wurde einmal abgeschaltet. Eine Abschaltung begrenzt das Ergebnis auf ★★.","other":"Der Reaktor wurde {0}-mal abgeschaltet. Eine Abschaltung begrenzt das Ergebnis auf ★★."},"why_steps":{"one":"Der Schutz hat die Leistung einmal abgesenkt.","other":"Der Schutz hat die Leistung {0}-mal abgesenkt."},"why_pwr":"PWR-Tipp: AUTO hält Tavg mit den Stäben am Sollwert; nutze Bor für langsame Änderungen wie Xenon.","why_bwr":"BWR-Tipp: Die Leistung folgt dem Umwälzdurchsatz. Mit AUTO folgen die Pumpen dem Sollwert.","why_xe":"Das Xenon erreichte nach der Leistungsabsenkung sein Maximum. Zieh die Stäbe früh, wenn die Last zurückkommt.","why_great":"Hervorragende Schicht: ruhig und im Ziel.","why_orm":"Stabreserve beim Abschalten: {0}.","why10":"Du hast den Test unter unsicheren Bedingungen verweigert. Das war die richtige Entscheidung.","poisoned":"Xenonvergiftung","k_pct":"Zeit im Ziel","k_trips":"RESA","k_orm":"Niedrigste Stabreserve","k_peak":"Spitzenleistung","k_xe":"Xenon-Maximum","k_time":"Schichtdauer","lg_p":"Leistung","lg_d":"Last","lg_trip":"RESA","log":"EREIGNISPROTOKOLL","new_rec":"NEUER REKORD","best":"Rekord {0}","pick_s":"SZENARIO WÄHLEN","br_obj":"ZIEL","br_stars":"STERNE","br_tips":"TIPPS","br_ctl":"STEUERUNG","br_starsT":"★ 40 % · ★★ 65 % · ★★★ 85 % der Schicht im Ziel. Jede Abschaltung begrenzt das Ergebnis auf ★★.","br_ctl_gen":"Oberer Regler: AUTO-Leistungssollwert. Mitte: Stäbe (Handbetrieb). Unten: Hauptkühlmittelpumpen.","br_ctl_pwr":"Oberer Regler: Netzlast. Mitte: Stäbe (AUTO hält Tavg). Unten: Borkonzentration.","br_ctl_bwr":"Oberer Regler: AUTO-Leistungssollwert. Mitte: Steuerkreuze. Unten: Umwälzdurchsatz (von AUTO geregelt).","br_prot":"Schutz: {0}. Ändern kannst du das mit dem Knopf oben oder in den Einstellungen.","br_skip":"Dieses Briefing nicht mehr anzeigen","start":"SCHICHT BEGINNEN","br_rbmk1":"Die Stäbe sind langsam (0,4 m/s). Bewege sie, bevor sich die Last ändert.","br_rbmk2":"Hier erhöht Dampf die Leistung. Lass die Periode nie kurz werden; AUTO hält sie bei etwa 40 s.","br_rbmk3":"Halte die ORM über 15. Das Xenon nach einer Leistungsabsenkung verleitet dich, Stäbe zu ziehen.","br_pwr1":"AUTO hält die mittlere Kühlmitteltemperatur (Tavg) am Sollwert. Behalte die Tavg-Anzeige im Blick.","br_pwr2":"Heißeres Wasser senkt die Leistung, deshalb folgt die Anlage der Last von selbst.","br_pwr3":"Xenon ist träge: Gleiche es mit Bor aus (weniger ppm = mehr Reaktivität).","br_bwr1":"Der Durchsatz bestimmt die Leistung: Mehr Umwälzdurchsatz spült Dampf heraus und erhöht die Leistung.","br_bwr2":"AUTO bewegt die Pumpen, nicht die Stäbe. Die Stäbe bestimmen das Grundniveau der Leistung.","br_bwr3":"Allein über den Durchsatz erreichst du etwa 55–100 % Leistung. Darunter musst du die Steuerkreuze selbst einfahren.","br_candu1":"Sehr wenig Überschussreaktivität: Halte die Trimmstäbe nahe ihrer Normalstellung.","br_candu2":"Die Abschaltung ist sehr schnell (1 s), aber ein langer Stillstand bei niedriger Leistung endet in der Xenonvergiftung.","br_candu3":"Nach einer Abschaltung: schnell rücksetzen und wieder anfahren, bevor das Xenon gewinnt.","br_test1":"Die Leistung ist niedrig und das Xenon hoch. Bei 60 s kommt ein Reglerfehler; bis 100 s sind die Stäbe gesperrt.","br_test2":"Die Verriegelung stoppt das Ziehen bei ORM 15. Überbrückst du sie, wiederholst du den Fehler von 1986.","br_test3":"Den Test zu verweigern oder den Xenonzerfall abzuwarten, ist eine gültige Entscheidung.","paused":"Pausiert","restart":"Neustart","sec_sound":"TON","sec_play":"SPIEL","sec_view":"ANZEIGE","sec_data":"DATEN","o_sound":"Soundeffekte","o_vol":"Lautstärke","o_amb":"Reaktorbrummen","o_ambD":"Hintergrundklang, der sich nach der Leistung richtet","o_hap":"Vibration","o_hapD":"Bei Abschaltungen und Alarmen","o_prot":"Schutzsystem","o_slow":"Zeitlupe","o_slowD":"Die Zeit verlangsamt sich bei Leistungsspitzen","o_hints":"Briefings und Tipps","o_hintsD":"Vor jedem Szenario ein Briefing anzeigen","o_units":"Leistungseinheit","o_text":"Schriftgröße","t_norm":"Normal","t_big":"Groß","o_motion":"Animationen","m_auto":"System","m_red":"Reduziert","m_full":"Voll","o_flash":"Bildschirmblitze","o_flashD":"Rote Blitze bei Abschaltungen und Alarmen","o_reset":"Fortschritt zurücksetzen","o_resetD":"Löscht Sterne, Bestwerte und ausgeblendete Briefings","o_resetQ":"Gesamten Fortschritt löschen?","o_resetDone":"Fortschritt gelöscht.","o_ver":"Version {0}","search":"Sprachen durchsuchen","lang_note":"Hilfekarten zeigen auch den englischen Fachbegriff.","g_prot":"Schutzsystem","g_protT":"Drei Stufen: WARNUNG (Lampe und Piepton, wenn die Periode kurz wird), LEISTUNGSABSENKUNG (Stäbe fahren automatisch ein) und SCHNELLABSCHALTUNG (RESA: alle Stäbe fahren ein). Der Assistenzmodus warnt und senkt ab, schaltet aber nur bei extremer Gefahr ab. Drücke nach einer Abschaltung RÜCKSETZEN, sobald alle Stäbe ganz eingefahren sind.","g_period":"Reaktorperiode","g_periodT":"Die Zeit, in der die Leistung auf etwa das 2,7-Fache wächst. 60 s sind sanft, unter 10 s schnell, unter 3 s gefährlich. Eine kurze Periode ist das erste Anzeichen für Ärger.","g_rbmk":"RBMK: positiver Dampfblaseneffekt","g_rbmkT":"Graphit bremst die Neutronen ab, das Kühlwasser wirkt vor allem als Absorber. Siedet das Wasser, werden weniger Neutronen absorbiert und die Leistung steigt, was noch mehr Dampf erzeugt. Die Stäbe sind langsam, und ihre Graphitverdränger erhöhen bei einer Schnellabschaltung kurz die Reaktivität.","kb_title":"Tastatur","kb_pow":"Leistungssollwert oder Stäbe","kb_flow":"Durchsatz oder Bor","kb_big":"Halten für größere Schritte","kb_trip":"Halten zum Abschalten (AZ-5 / RESA)","kb_reset":"Nach einer Abschaltung rücksetzen","kb_pause":"Pausieren","kb_speed":"Simulationsgeschwindigkeit","kb_view":"Kern- oder Anlagenansicht","gotit":"Verstanden","m_bwr_min":"AUTO ist beim minimalen Durchsatz: Fahre die Steuerkreuze ein, um weiter abzusenken.","m_bwr_max":"AUTO ist beim maximalen Durchsatz: Ziehe die Steuerkreuze für mehr Leistung.","pause":"Pausieren","upg":"UPGRADES","upg_sub":"Echte Anlagenverbesserungen. Verdiene Credits mit abgeschlossenen Schichten.","upg_test":"Der Test von 1986 läuft immer mit dem Originaldesign: Upgrades sind aus.","upg_on":"Aktive Upgrades: {0}/3","upg_new":"Upgrade installiert!","cr":"Credits","inst":"INSTALLIERT","installing":"Wird installiert…","need":"{0} fehlen","fx_scram":"Volle Einfahrzeit","fx_ps":"Positiver Scram","fx_void":"Dampfblasenkoeffizient","fx_bor":"Borrate","fx_rod":"Stabgeschwindigkeit","fx_worth":"Gesamtstabwirksamkeit","fx_flowr":"Durchflussbereich","fx_min":"Mindestreserve","fx_auto":"AUTO min. Periode","u_rbmk_fastaz":"Schnellabschaltung (AZ-5)","u_rbmk_fastaz_d":"Änderung nach 1986: Die Stäbe fahren in etwa 12 s statt 18 s vollständig ein.","u_rbmk_rods":"Neu konstruierte Stäbe","u_rbmk_rods_d":"Längere Graphitverdränger und Absorber: Der positive Scram-Effekt verschwindet fast.","u_rbmk_absorb":"Zusatzabsorber + 2,4 % Brennstoff","u_rbmk_absorb_d":"Rund 80 feste Absorber und höher angereicherter Brennstoff halbieren den positiven Dampfblasenkoeffizienten.","u_pwr_boron":"Schnelle Borierung","u_pwr_boron_d":"Größere Ladepumpen und Borsäuretanks ändern die Borkonzentration etwa doppelt so schnell.","u_pwr_rodctl":"Digitale Stabsteuerung","u_pwr_rodctl_d":"Schnellere Antriebe und ein klügerer Regler folgen der Last enger.","u_pwr_grey":"Graue Steuerstäbe","u_pwr_grey_d":"Lastfolgestäbe (wie im französischen „Mode G“) erhöhen die Stabwirksamkeit, du brauchst weniger Bor.","u_bwr_recirc":"Drehzahlgeregelte Umwälzpumpen","u_bwr_recirc_d":"Frequenzumrichter erweitern den Regelbereich über den Durchfluss bis etwa 45 % Leistung.","u_bwr_fmcrd":"Feinbewegliche Stabantriebe","u_bwr_fmcrd_d":"Elektrische Antriebe (wie im ABWR) bewegen die Steuerelemente schneller und ruhiger.","u_bwr_icf":"Erhöhter Kerndurchsatz","u_bwr_icf_d":"Eine genehmigte Durchflussreserve lässt AUTO allein mit den Pumpen höhere Leistung erreichen.","u_candu_boost":"Booster-Stäbe","u_candu_boost_d":"Angereicherte Stäbe, die Reaktivität zufügen, um Xenon nach einer Leistungsabsenkung zu überwinden.","u_candu_fastadj":"Schnellere Justierstabantriebe","u_candu_fastadj_d":"Die Justierstäbe bewegen sich schneller, Korrekturen wirken früher.","u_candu_lzc":"Flüssigzonenregler","u_candu_lzc_d":"Leichtwasserkammern ermöglichen schnelle, feine Regelung: AUTO kann die Leistung schneller erhöhen.","quick":"SPIELEN","k_title":"Reaktor-Kumpel","k_goal":"Bring die Stadt zum Leuchten! Gib ihr genau so viel Strom, wie sie braucht, und halte den Kumpel kühl.","k_level":"Level {0}","k_tip1":"Schieb den Hebel: nach rechts mehr Strom, nach links weniger!","k_ev_night":"Nacht! Alle schlafen. Weniger Strom!","k_ev_evening":"Abend! Alle machen das Licht an!","k_ev_factory":"Eine Spielzeugfabrik hat geöffnet! Mehr Strom!","k_ev_match":"Großes Spiel im Fernsehen! Alle schauen zu!","k_ev_rain":"Regentag! Die Heizungen brauchen Strom.","k_ev_morning":"Guten Morgen! Die Stadt wacht auf.","k_too_hot":"Mir ist zu heiß! Drück aufs Wasser!","k_low":"Die Häuser sind dunkel! Mehr Strom!","k_good":"Juhu! Die Stadt ist glücklich!","k_faint":"Hoppla! Ich bin umgekippt… kühle ab.","k_back":"Ich bin zurück! Los!","k_win":"Super gemacht!","k_lose":"Versuch es nochmal!","k_next":"Weiter","k_shop":"Hüte","k_expert":"Experten-Simulator","k_wear":"Aufsetzen","k_wearing":"Auf","h_party":"Partyhut","h_cap":"Kappe","h_glasses":"Coole Brille","h_chef":"Kochmütze","h_crown":"Krone","h_wizard":"Zauberhut"},"es":{"title":"REACTOR LAB","sub":"SIMULADOR DE REACTORES NUCLEARES","edu":"Simulador educativo con física simplificada. No apto para uso en ingeniería. No se representa a personas reales.","read":"Basado en análisis públicos (p. ej., OIEA INSAG-7). Las cifras son aproximaciones simplificadas.","pick":"ELIGE UN REACTOR","back":"Atrás","how":"CÓMO FUNCIONA","set":"AJUSTES","again":"Reintentar","menu":"Menú","resume":"Continuar","close":"Cerrar","rn_rbmk":"Grafito · agua ligera","rn_pwr":"Agua a presión · boro","rn_bwr":"Agua en ebullición · caudal","rn_candu":"Agua pesada · uranio natural","rd_rbmk":"Reactor de canales moderado por grafito. El vapor genera MÁS potencia (coeficiente de huecos positivo). Barras lentas y efecto de scram positivo. El más difícil de domar.","rd_pwr":"El diseño más extendido. El agua más caliente reduce la potencia, así que se estabiliza solo. El ácido bórico controla los cambios lentos. Las barras caen en segundos.","rd_bwr":"El agua hierve dentro del núcleo. Más vapor significa menos potencia, así que el CAUDAL fija la potencia: cuanto más bombeas, más potencia.","rd_candu":"Agua pesada y uranio natural. Sistemas de parada muy rápidos, un pequeño efecto de huecos positivo y un fuerte «envenenamiento por xenón» si la potencia se queda baja demasiado tiempo.","st_void":"Coeficiente de huecos","st_trip":"Velocidad de parada","st_stab":"Autoestabilidad","st_diff":"Dificultad","v_pos":"POSITIVO","v_neg":"NEGATIVO","v_small":"PEQUEÑO +","v_none":"CASI CERO","sp_slow":"LENTA · 18 s","sp_fast":"RÁPIDA · 2 s","sp_vfast":"MUY RÁPIDA · 1 s","sp_med":"MEDIA · 3 s","stb_low":"BAJA","stb_hi":"ALTA","stb_mid":"MEDIA","d_hard":"DIFÍCIL","d_med":"MEDIA","d_easy":"FÁCIL","d_free":"LIBRE","s_train":"Entrenamiento","s_traind":"Sigue la curva de demanda. Aprende cómo responde este reactor.","s_move":"Maniobra de potencia","s_moved":"Baja la potencia y luego recupérala. El xenón te lo pondrá difícil.","s_test":"La prueba","s_testd":"Turno de noche al estilo de 1986: pozo de xenón, presión del jefe y una sola decisión.","s_sand":"Modo libre","s_sandd":"A plena potencia y sin guion. Experimenta libremente.","c_rods_rbmk":"GRUPO DE BARRAS","c_rods_pwr":"BARRAS DE CONTROL","c_rods_bwr":"BARRAS CRUCIFORMES","c_rods_candu":"BARRAS DE AJUSTE","c_set":"CONSIGNA AUTO (MW)","c_flow":"BOMBAS PRINCIPALES","c_flow_bwr":"CAUDAL DE RECIRCULACIÓN","c_boron":"BORO (ppm)","c_load":"CARGA DE RED (%)","auto":"AUTO","man":"MANUAL","test":"INICIAR PRUEBA","conf":"¿SEGURO?","trip_rbmk":"AZ-5","trip_o":"DISPARO","mw":"MW","hdr1":"NÚCLEO DEL REACTOR","hdr2":"POTENCIA","hdr3":"TENDENCIA DE POTENCIA (log MW)","hdr4":"XENÓN-135","hdr5":"BARRAS / CAUDAL","hdr6":"ALARMAS","hdr7":"SALA DE CONTROL","orm_rbmk":"ORM","orm_o":"RESERVA","rho":"REACTIVIDAD","per":"Periodo","void":"Huecos de vapor","fl":"Caudal","rd":"Barras","tavg":"Tavg","bor":"Boro","xeT":"ENVENENAMIENTO POR XENÓN","xeRods":"consume ≈ {0} barras de reactividad","xeUp":"sube","xeDn":"baja","xeFl":"estable","xeNorm":"normal","xeHigh":"ALTO","xePit":"POZO DE XENÓN","aM1":"RESERVA \u003c {0}","aM2":"¡RESERVA \u003c {0}!","aLow":"POTENCIA BAJA","aPer":"PERIODO CORTO","aTrip":"DISPARO ACTIVO","aJam":"BARRAS ATASCADAS","aTest":"PRUEBA EN CURSO","aByp":"PUENTEADO","aTavg":"TAVG FUERA","aXe":"XENÓN ALTO","goal_train":"Objetivo: seguir la curva de demanda con un margen de ±5 %.","goal_move":"Objetivo: controlar el xenón y seguir la demanda.","goal_test":"Objetivo: terminar el turno con seguridad. Norma: ORM ≥ 15.","goal_sand":"Modo libre: sin objetivo.","goal_pwr":"Objetivo: mantener Tavg a ±2,5 K del programa.","done":"Turno completado","destroyed":"Reactor destruido","safe":"Parada segura","explain":"Qué ha pasado","m_t1":"Sigue la demanda. Las barras son lentas: anticípate.","m_t2":"¡La demanda cambia! Síguela.","m_mv":"Bajada de carga: reduce la potencia y luego recupérala. Vigila el xenón.","m_hold":"Juego libre. Todo está activo.","m_a0":"Jefe de turno: mantén unos 700 MW. La prueba de inercia está programada.","m_a1":"Fallo del regulador: ¡la potencia cae rápidamente!","m_a2":"Jefe de turno: sube a 200 MW y haz la prueba YA. Puentea el enclavamiento si hace falta.","m_a2b":"Enclavamiento: extracción de barras bloqueada en ORM 15. El xenón necesita tiempo para desintegrarse (acelera a ×4).","m_a3":"Prueba de inercia en marcha: las bombas se frenan.","m_a4":"Prueba terminada. Dispara el reactor para una parada programada.","m_m1":"Reserva por debajo del nivel de aviso.","m_m2":"Reserva por debajo del mínimo: hay que parar el reactor.","m_jam":"¡Pico de potencia: canales deformados, barras atascadas!","m_lock":"ENCLAVAMIENTO: no se pueden sacar más las barras.","m_exc":"¡EXCURSIÓN DE POTENCIA! Cámara lenta activada. ¡DISPARA el reactor!","m_tp":"DISPARO AUTOMÁTICO: periodo corto","m_th":"DISPARO AUTOMÁTICO: potencia alta","m_tf":"DISPARO AUTOMÁTICO: caudal de refrigerante bajo","m_poison":"Envenenamiento por xenón: no se puede mantener la potencia. El arranque queda bloqueado ~40 horas.","why1":"Coeficiente de huecos positivo: más potencia → más vapor → más reactividad.","why2":"Efecto de scram positivo: al entrar en un núcleo con ORM bajo, las puntas de grafito primero AÑADEN reactividad.","why3":"El envenenamiento por xenón obligó a sacar barras: el ORM bajó a {0}.","why4":"Las barras tardan ~18 s en insertarse y se atascaron al deformarse los canales.","why6":"Se puentearon el enclavamiento y la protección.","why7":"Resultado de manual: esperaste a que bajara el xenón y terminaste la prueba con ORM ≥ 15.","why8":"El xenón se acumuló más rápido de lo que las barras podían compensar.","g_orm":"ORM / reserva de barras","g_ormT":"Cuántas barras de control (equivalentes) hay insertadas = margen de seguridad para la parada. Normas del RBMK: mantener ≥ 26, mínimo absoluto 15. Otros diseños usan límites de inserción de barras.","g_xe":"Xenón","g_xeT":"El xenón-135 es un veneno neutrónico que procede del yodo. Se acumula tras una bajada de potencia y alcanza su máximo horas después. Aquí el tiempo está comprimido ×300. Para mantener la potencia tienes que compensarlo en otro sitio (sacando barras o diluyendo boro).","g_void":"Huecos de vapor","g_voidT":"Al hervir, el agua forma burbujas de vapor. En el RBMK, más vapor significa MÁS potencia (realimentación peligrosa). En el BWR significa MENOS potencia, por eso el caudal controla la potencia.","g_rod":"Barras y disparo","g_rodT":"Las barras de control absorben neutrones. Las del RBMK se mueven a 0,4 m/s y tardan ~18 s en entrar del todo; sus puntas de grafito AÑADEN reactividad durante un instante (efecto de scram positivo). Otros reactores las dejan caer en 1-3 s.","g_rho":"Reactividad $","g_rhoT":"0 $ = potencia estable. +1 $ = crítico inmediato: la potencia se desboca en uno o dos segundos. Por debajo de 0, la potencia baja.","g_pwr":"PWR: boro","g_pwrT":"El ácido bórico absorbe neutrones. Diluirlo añade reactividad poco a poco (sirve para combatir el xenón). El refrigerante más caliente reduce la potencia por sí solo, así que la central sigue la carga de la red.","g_bwr":"BWR: caudal = potencia","g_bwrT":"Más caudal de recirculación arrastra el vapor fuera del núcleo, lo que sube la potencia. Menos caudal la baja. Las barras fijan el nivel base.","g_candu":"CANDU: envenenamiento","g_canduT":"El uranio natural tiene poca reactividad de reserva. Si la potencia se queda baja unas horas, el xenón se acumula por encima de lo que pueden compensar las barras de ajuste y el reactor queda bloqueado ~40 horas.","st_lang":"IDIOMA","u_mw":"MW","u_pct":"% nominal","yes":"Sí","no":"No","st_about":"ACERCA DE","doc_title":"Reactor Lab · Simulador de reactores nucleares","slow":"CÁMARA LENTA","tgt":"Objetivo","hdr_plant":"CENTRAL","pl_core":"Núcleo","pl_turb":"Turbina","pl_gen":"Generador","pl_cond":"Condensador","pl_pump":"Bomba","pl_sg":"Gen. vapor","pl_press":"Presionador","pl_drum":"Calderín","pl_cal":"Calandria","pl_sep":"Separador","pl_fw":"Agua alim.","pl_grid":"Red","pl_steam":"Vapor","pl_water":"Agua","tip_core":"Vista superior del núcleo. El combustible brilla más cuanto mayor es la potencia. Los círculos oscuros son barras de control: la parte rellena indica cuánto está insertada cada una. Toca ⇄ para ver toda la central.","tip_core_rbmk":"RBMK: unos 1700 canales de combustible en un bloque de grafito. El agua de los canales absorbe neutrones, así que cuando hierve y se convierte en vapor, la potencia SUBE. Las burbujas indican vapor en los canales.","tip_core_pwr":"PWR: elementos combustibles a 155 bar, así que el agua nunca hierve. El tono azul indica boro disuelto, que absorbe neutrones.","tip_core_bwr":"BWR: el agua hierve dentro del núcleo. Las piezas en cruz entre los haces de combustible son las barras de control. Más vapor significa MENOS potencia.","tip_core_candu":"CANDU: tubos de presión horizontales dentro de un tanque de agua pesada (la calandria). Las barras de ajuste verticales afinan la reactividad.","tip_plant":"Toda la central: el calor del núcleo produce vapor, el vapor hace girar la turbina, el condensador lo vuelve a convertir en agua y las bombas la devuelven. La velocidad del flujo y los colores siguen la simulación.","tip_power":"Potencia térmica del núcleo. Los indicadores muestran la reserva de barras y la reactividad. Debajo: el periodo del reactor y la realimentación principal de este diseño.","tip_margin":"Reserva de barras: cuánto absorbente hay en el núcleo, medido en barras. Es tu margen de seguridad para la parada. Amarillo: por debajo del nivel de aviso. Rojo: por debajo del mínimo, debes parar el reactor.","tip_margin_rbmk":"ORM (margen de reactividad operativo): el número equivalente de barras en el núcleo. Las normas de 1986 exigían al menos 15; la noche del accidente era de unas 8. Un ORM bajo también hace que el scram AZ-5 AÑADA reactividad al principio.","tip_rho":"Reactividad en dólares ($). A 0 $ la potencia es estable. Positiva: la potencia sube, y más rápido cuanto más se acerca a 1 $. A 1 $ el reactor es crítico inmediato y la potencia se desboca en un segundo.","tip_trend":"Potencia de los últimos minutos en escala logarítmica (cada línea es ×10). La línea discontinua es la demanda o la consigna. Las marcas rojas son disparos.","tip_xe":"El xenón-135 absorbe neutrones. Se acumula cuando la potencia BAJA (por la desintegración del yodo) y alcanza su máximo horas después; a potencia alta se quema. 100 % es el nivel a plena potencia. El tiempo está comprimido ×300.","tip_rods":"Indicador izquierdo: inserción de las barras (las flechas muestran el movimiento). Indicador derecho: caudal de refrigerante, o concentración de boro en un PWR.","tip_lamps":"Panel de alarmas. Amarillo: aviso. Naranja: reducción automática (la protección está insertando barras). Rojo: disparo, reserva de barras por debajo del mínimo o protección puenteada. Si parpadea, actúa ya.","aStep":"REDUCCIÓN","aFlowLo":"CAUDAL BAJO","aVoid":"HUECOS ALTOS","auto_off":"Sin AUTO","lim_on":"CON LÍMITE","lim_off":"SIN LÍMITE","prot_full_s":"PROT.","prot_assist_s":"ASIST.","prot_off_s":"SIN PROT.","prot_full":"Completa","prot_assist":"Asistida","prot_off":"Apagada","prot_full_d":"Como en una central real: avisos, reducción automática de potencia y disparo automático.","prot_assist_d":"Avisos y reducción automática. Disparo solo en peligro extremo. Recomendado.","prot_off_d":"Sin acciones automáticas, solo alarmas. Todo depende de ti.","reset_trip":"REARMAR","kb_hint":"Teclas: ↑↓ potencia · ←→ caudal · M auto · mantén X para disparar · R rearmar · Espacio pausa · H ayuda","m_limon":"Límite de barras ACTIVADO: las últimas barras se quedan en el núcleo.","m_limoff":"Límite de barras DESACTIVADO: ¡nada te impide sacar las últimas barras!","m_prot_full":"Protección COMPLETA: reducción y disparo automáticos armados.","m_prot_assist":"Protección ASISTIDA: avisos y reducción automática; disparo solo en peligro extremo.","m_prot_off":"Protección APAGADA. Estás por tu cuenta.","m_trip_man":"Disparo manual: todas las barras entrando.","m_turb":"Disparo de turbina junto con el reactor: carga reducida a 0.","m_candu_hint":"Vuelve a arrancar pronto o el xenón envenenará el núcleo.","m_reset_wait":"Podrás rearmar cuando las barras estén totalmente dentro.","m_reset":"Disparo rearmado. Saca barras o activa AUTO para volver a arrancar.","m_alert":"Periodo corto: la potencia sube deprisa.","m_step_p":"REDUCCIÓN: la potencia sube demasiado rápido, barras entrando.","m_step_n":"REDUCCIÓN: potencia por encima del límite, barras entrando.","m_step_f":"REDUCCIÓN: caudal de refrigerante demasiado bajo para esta potencia.","m_step_end":"Reducción finalizada.","m_tiphint":"Consejo: toca ⓘ en cualquier panel para ver una explicación.","why_trips":{"one":"Hubo un disparo del reactor. Un disparo limita el resultado a ★★.","many":"Hubo {0} disparos del reactor. Un disparo limita el resultado a ★★.","other":"Hubo {0} disparos del reactor. Un disparo limita el resultado a ★★."},"why_steps":{"one":"La protección redujo la potencia una vez.","many":"La protección redujo la potencia {0} veces.","other":"La protección redujo la potencia {0} veces."},"why_pwr":"Consejo PWR: AUTO mantiene Tavg en el programa con las barras; usa el boro para los cambios lentos, como el xenón.","why_bwr":"Consejo BWR: la potencia sigue al caudal de recirculación. Con AUTO activado, las bombas siguen la consigna.","why_xe":"El xenón alcanzó su máximo tras la bajada de potencia. Saca barras con antelación cuando vuelva la carga.","why_great":"Turno excelente: estable y en el objetivo.","why_orm":"Reserva de barras en la parada: {0}.","why10":"Te negaste a hacer la prueba en condiciones inseguras. Es la decisión correcta.","poisoned":"Envenenamiento por xenón","k_pct":"Tiempo en objetivo","k_trips":"Disparos","k_orm":"Reserva mínima","k_peak":"Pico de potencia","k_xe":"Pico de xenón","k_time":"Duración del turno","lg_p":"Potencia","lg_d":"Demanda","lg_trip":"Disparo","log":"REGISTRO DE EVENTOS","new_rec":"NUEVO RÉCORD","best":"Mejor: {0}","pick_s":"ELIGE UN ESCENARIO","br_obj":"OBJETIVO","br_stars":"ESTRELLAS","br_tips":"CONSEJOS","br_ctl":"CONTROLES","br_starsT":"★ 40 % · ★★ 65 % · ★★★ 85 % del turno en el objetivo. Cualquier disparo limita el resultado a ★★.","br_ctl_gen":"Control superior: consigna de potencia AUTO. Central: barras (modo manual). Inferior: bombas principales de refrigerante.","br_ctl_pwr":"Control superior: carga de la red. Central: barras (AUTO mantiene Tavg). Inferior: concentración de boro.","br_ctl_bwr":"Control superior: consigna de potencia AUTO. Central: barras cruciformes. Inferior: caudal de recirculación (lo mueve AUTO).","br_prot":"Protección: {0}. Cámbiala con el botón de arriba o en Ajustes.","br_skip":"No volver a mostrar estas instrucciones","start":"EMPEZAR TURNO","br_rbmk1":"Las barras son lentas (0,4 m/s). Empieza a moverlas antes de que cambie la demanda.","br_rbmk2":"Aquí el vapor añade potencia. No dejes que el periodo se acorte; AUTO lo mantiene en torno a 40 s.","br_rbmk3":"Mantén el ORM por encima de 15. El xenón tras una bajada de potencia te tentará a sacar barras.","br_pwr1":"AUTO mantiene la temperatura media del refrigerante (Tavg) en el programa. Vigila la lectura de Tavg.","br_pwr2":"El agua más caliente reduce la potencia, así que la central sigue la carga por sí sola.","br_pwr3":"El xenón es lento: corrígelo con boro (menos ppm añaden reactividad).","br_bwr1":"El caudal fija la potencia: más caudal de recirculación arrastra el vapor y sube la potencia.","br_bwr2":"AUTO mueve las bombas, no las barras. Las barras fijan el nivel base de potencia.","br_bwr3":"El caudal por sí solo cubre aproximadamente el 55-100 % de la potencia. Por debajo, inserta tú las barras.","br_candu1":"Hay muy poca reactividad de reserva: mantén las barras de ajuste cerca de su posición normal.","br_candu2":"La parada es muy rápida (1 s), pero pasar mucho tiempo a baja potencia acaba en envenenamiento por xenón.","br_candu3":"Tras un disparo, rearma y vuelve a arrancar enseguida, antes de que gane el xenón.","br_test1":"La potencia es baja y el xenón, alto. A los 60 s fallará un regulador; las barras están bloqueadas hasta los 100 s.","br_test2":"El enclavamiento detiene la extracción en ORM 15. Puentearlo repite el error de 1986.","br_test3":"Negarte a hacer la prueba, o esperar a que el xenón se desintegre, es una opción válida.","paused":"En pausa","restart":"Reiniciar","sec_sound":"SONIDO","sec_play":"JUEGO","sec_view":"PANTALLA","sec_data":"DATOS","o_sound":"Efectos de sonido","o_vol":"Volumen","o_amb":"Zumbido del reactor","o_ambD":"Sonido ambiente que sigue el nivel de potencia","o_hap":"Vibración","o_hapD":"En disparos y alarmas","o_prot":"Sistema de protección","o_slow":"Cámara lenta","o_slowD":"El tiempo se ralentiza en los picos de potencia","o_hints":"Instrucciones y consejos","o_hintsD":"Mostrar instrucciones antes de cada escenario","o_units":"Unidades de potencia","o_text":"Tamaño del texto","t_norm":"Normal","t_big":"Grande","o_motion":"Animaciones","m_auto":"Sistema","m_red":"Reducidas","m_full":"Completas","o_flash":"Destellos en pantalla","o_flashD":"Destellos rojos en disparos y alarmas","o_reset":"Borrar progreso","o_resetD":"Borra estrellas, récords e instrucciones ocultas","o_resetQ":"¿Borrar todo el progreso?","o_resetDone":"Progreso borrado.","o_ver":"Versión {0}","search":"Buscar idioma","lang_note":"Las fichas de ayuda también muestran el término técnico en inglés.","g_prot":"Sistema de protección","g_protT":"Tres etapas: AVISO (luz y pitido cuando el periodo se acorta), REDUCCIÓN (stepback: las barras entran automáticamente) y DISPARO (todas las barras dentro). La protección asistida avisa y reduce la potencia, y solo dispara en peligro extremo. Tras un disparo, pulsa REARMAR cuando las barras estén totalmente dentro.","g_period":"Periodo del reactor","g_periodT":"El tiempo que tarda la potencia en multiplicarse por unos 2,7. Un periodo de 60 s es suave; por debajo de 10 s, rápido; por debajo de 3 s, peligroso. Un periodo corto es la primera señal de problemas.","g_rbmk":"RBMK: huecos positivos","g_rbmkT":"El grafito frena los neutrones y el agua de refrigeración absorbe buena parte de ellos. Cuando el agua hierve, se absorben menos neutrones y la potencia sube, lo que genera más vapor. Las barras son lentas y sus puntas de grafito añaden reactividad brevemente durante un disparo.","kb_title":"Teclado","kb_pow":"Consigna de potencia o barras","kb_flow":"Caudal o boro","kb_big":"Mantén para pasos más grandes","kb_trip":"Mantén para disparar (AZ-5 / DISPARO)","kb_reset":"Rearmar tras un disparo","kb_pause":"Pausa","kb_speed":"Velocidad de simulación","kb_view":"Vista de núcleo o de central","gotit":"Entendido","m_bwr_min":"AUTO está en el caudal mínimo: inserta las barras cruciformes para bajar más.","m_bwr_max":"AUTO está en el caudal máximo: saca las barras cruciformes para tener más potencia.","pause":"Pausa","upg":"MEJORAS","upg_sub":"Modificaciones reales de la central. Gana créditos completando turnos.","upg_test":"La prueba de 1986 siempre usa el diseño original: las mejoras están desactivadas.","upg_on":"Mejoras activas: {0}/3","upg_new":"¡Mejora instalada!","cr":"Créditos","inst":"INSTALADA","installing":"Instalando…","need":"Faltan {0}","fx_scram":"Tiempo de SCRAM","fx_ps":"SCRAM positivo","fx_void":"Coeficiente de vacío","fx_bor":"Velocidad del boro","fx_rod":"Velocidad de barras","fx_worth":"Valor total de barras","fx_flowr":"Rango de caudal","fx_min":"Reserva mínima","fx_auto":"Periodo mín. AUTO","u_rbmk_fastaz":"SCRAM rápido (AZ-5)","u_rbmk_fastaz_d":"Cambio posterior a 1986: las barras entran del todo en unos 12 s en lugar de 18 s.","u_rbmk_rods":"Barras rediseñadas","u_rbmk_rods_d":"Desplazadores de grafito y absorbentes más largos: el efecto de SCRAM positivo casi desaparece.","u_rbmk_absorb":"Absorbentes extra + combustible al 2,4 %","u_rbmk_absorb_d":"Unos 80 absorbentes fijos y combustible más enriquecido reducen a la mitad el coeficiente de vacío positivo.","u_pwr_boron":"Boración rápida","u_pwr_boron_d":"Bombas de carga y tanques de ácido bórico más grandes cambian el boro unas dos veces más rápido.","u_pwr_rodctl":"Control digital de barras","u_pwr_rodctl_d":"Mecanismos más rápidos y un regulador más inteligente siguen la carga con más precisión.","u_pwr_grey":"Barras grises","u_pwr_grey_d":"Barras de seguimiento de carga (como el «modo G» francés) añaden valor de barras: dependes menos ,"m_a0":"Supervisor: mantenha cerca de 700 MW. O teste de inércia está programado.","m_a1":"Falha do regulador: a potência está caindo rápido!","m_a2":"Supervisor: suba a potência para 200 MW e faça o teste AGORA. Iniba o intertravamento se precisar.","m_a2b":"Intertravamento: retirada de barras bloqueada em ORM 15. O xenônio precisa de tempo para decair (tente ×4).","m_a3":"Teste de inércia iniciado: as bombas estão desacelerando.","m_a4":"Teste concluído. Desarme o reator para um desligamento planejado.","m_m1":"Reserva abaixo do nível de alerta.","m_m2":"Reserva abaixo do mínimo: desligamento obrigatório.","m_jam":"Pico de potência: canais deformados, barras presas!","m_lock":"INTERTRAVAMENTO: as barras não podem ser mais retiradas.","m_exc":"EXCURSÃO! Câmera lenta ativada. DESARME o reator!","m_tp":"DESARME AUTOMÁTICO: período curto","m_th":"DESARME AUTOMÁTICO: potência alta","m_tf":"DESARME AUTOMÁTICO: vazão de refrigerante baixa","m_poison":"Envenenamento por xenônio: não dá para manter a potência. Religamento bloqueado por ~40 horas.","why1":"Coeficiente de vazio positivo: mais potência → mais vapor → mais reatividade.","why2":"Efeito de scram positivo: as pontas de grafite primeiro ADICIONAM reatividade ao entrar em um núcleo com ORM baixo.","why3":"O xenônio forçou a retirada das barras: o ORM caiu para {0}.","why4":"As barras levam ~18 s para entrar e travaram quando os canais se deformaram.","why6":"O intertravamento e a proteção foram inibidos.","why7":"Resultado de manual: você esperou o xenônio decair e terminou o teste com ORM ≥ 15.","why8":"O xenônio se acumulou mais rápido do que as barras conseguiam compensar.","g_orm":"ORM / reserva de barras","g_ormT":"Quantas barras de controle (equivalentes) estão inseridas = margem de segurança para o desligamento. Regras do RBMK: manter ≥ 26, mínimo absoluto 15. Outros projetos usam limites de inserção de barras.","g_xe":"Xenônio","g_xeT":"O xenônio-135 é um veneno de nêutrons formado a partir do iodo. Ele se acumula após uma redução de potência e atinge o pico horas depois. Aqui o tempo é comprimido ×300. Para manter a potência, é preciso compensar em outro lugar (retirar barras ou diluir o boro).","g_void":"Vazios de vapor","g_voidT":"A água fervendo forma bolhas de vapor. No RBMK, mais vapor significa MAIS potência (realimentação perigosa). No BWR, significa MENOS potência, por isso a vazão controla a potência.","g_rod":"Barras e desarme","g_rodT":"As barras de controle absorvem nêutrons. As do RBMK se movem a 0,4 m/s e levam ~18 s para entrar totalmente; suas pontas de grafite ADICIONAM reatividade por um instante (efeito de scram positivo). Outros reatores soltam as barras em 1-3 s.","g_rho":"Reatividade $","g_rhoT":"0 $ = potência estável. +1 $ = pronto-crítico: a potência dispara em um ou dois segundos. Abaixo de 0, a potência cai.","g_pwr":"PWR: boro","g_pwrT":"O ácido bórico absorve nêutrons. Diluí-lo adiciona reatividade devagar (combate o xenônio). Refrigerante mais quente reduz a potência sozinho, então a usina acompanha a carga da rede.","g_bwr":"BWR: vazão = potência","g_bwrT":"Mais vazão de recirculação varre o vapor para fora do núcleo, o que aumenta a potência. Menos vazão a reduz. As barras definem o nível básico.","g_candu":"CANDU: envenenamento","g_canduT":"O urânio natural tem pouca reatividade sobrando. Se a potência ficar baixa por algumas horas, o xenônio se acumula além do que os ajustadores conseguem compensar e o reator fica bloqueado por ~40 horas.","st_lang":"IDIOMA","u_mw":"MW","u_pct":"% da nominal","yes":"Sim","no":"Não","st_about":"SOBRE","doc_title":"Reactor Lab · Simulador de Reatores Nucleares","slow":"CÂMERA LENTA","tgt":"Alvo","hdr_plant":"USINA","pl_core":"Núcleo","pl_turb":"Turbina","pl_gen":"Gerador","pl_cond":"Condensador","pl_pump":"Bomba","pl_sg":"Ger. vapor","pl_press":"Pressurizador","pl_drum":"Tambor de vapor","pl_cal":"Calândria","pl_sep":"Separador","pl_fw":"Água alim.","pl_grid":"Rede","pl_steam":"Vapor","pl_water":"Água","tip_core":"Vista de cima do núcleo. O combustível brilha mais quanto maior a potência. Os círculos escuros são as barras de controle: a parte preenchida mostra quanto cada uma está inserida. Toque em ⇄ para ver a usina inteira.","tip_core_rbmk":"RBMK: cerca de 1.700 canais de combustível em uma pilha de grafite. A água nos canais absorve nêutrons, então, quando ela ferve e vira vapor, a potência SOBE. As bolhas mostram o vapor nos canais.","tip_core_pwr":"PWR: elementos combustíveis sob 155 bar, então a água nunca ferve. O tom azul mostra o boro dissolvido, que absorve nêutrons.","tip_core_bwr":"BWR: a água ferve dentro do núcleo. As lâminas em cruz entre os feixes de combustível são as barras de controle. Mais vapor significa MENOS potência.","tip_core_candu":"CANDU: tubos de pressão horizontais em um tanque de água pesada (a calândria). Barras de ajuste verticais fazem o ajuste fino da reatividade.","tip_plant":"A usina inteira: o calor do núcleo gera vapor, o vapor gira a turbina, o condensador o transforma de volta em água e as bombas o devolvem. A velocidade do fluxo e as cores seguem a simulação.","tip_power":"Potência térmica do núcleo. Os mostradores indicam a reserva de barras e a reatividade. Abaixo deles: o período do reator e a principal realimentação deste projeto.","tip_margin":"Reserva de barras: quantas barras equivalentes de absorvedor há no núcleo. É a sua margem de segurança para o desligamento. Amarelo: abaixo do nível de alerta. Vermelho: abaixo do mínimo, você precisa desligar.","tip_margin_rbmk":"ORM (margem de reatividade operacional): o número equivalente de barras no núcleo. As regras de 1986 exigiam no mínimo 15; na noite do acidente, era cerca de 8. Um ORM baixo também faz o scram AZ-5 ADICIONAR reatividade no início.","tip_rho":"Reatividade em dólares ($). Em 0 $, a potência é estável. Positiva: a potência sobe, e mais rápido quanto mais perto de 1 $. Em 1 $, o reator fica pronto-crítico e a potência dispara em um segundo.","tip_trend":"Potência nos últimos minutos em escala logarítmica (cada linha é ×10). A linha tracejada é a demanda ou o alvo. As marcas vermelhas são desarmes.","tip_xe":"O xenônio-135 absorve nêutrons. Ele se acumula depois que a potência CAI (pelo decaimento do iodo) e atinge o pico horas depois; em alta potência, ele é queimado. 100% é o nível de potência total. O tempo é comprimido ×300.","tip_rods":"Indicador da esquerda: inserção das barras (as setas mostram o movimento). Indicador da direita: vazão de refrigerante, ou concentração de boro no PWR.","tip_lamps":"Painel de alarmes. Amarelo: alerta. Laranja: recuo (a proteção está inserindo as barras). Vermelho: desarme, reserva de barras abaixo do mínimo ou proteção inibida. Piscando: aja agora.","aStep":"RECUO","aFlowLo":"VAZÃO BAIXA","aVoid":"VAZIO ALTO","auto_off":"Sem AUTO","lim_on":"COM LIMITE","lim_off":"SEM LIMITE","prot_full_s":"PROT.","prot_assist_s":"ASSIST.","prot_off_s":"SEM PROT.","prot_full":"Total","prot_assist":"Assistida","prot_off":"Nenhuma","prot_full_d":"Como numa usina real: alertas, recuo automático e desarme automático.","prot_assist_d":"Alertas e recuo automático. Desarma só em perigo extremo. Recomendada.","prot_off_d":"Nenhuma ação automática, só alarmes. Tudo depende de você.","reset_trip":"REARMAR","kb_hint":"Teclas: ↑↓ potência · ←→ vazão · M auto · segure X para desarmar · R rearmar · Espaço pausa · H ajuda","m_limon":"Limite de barras LIGADO: as últimas barras ficam no núcleo.","m_limoff":"Limite de barras DESLIGADO: nada impede você de retirar as últimas barras!","m_prot_full":"Proteção TOTAL: recuo e desarme automático armados.","m_prot_assist":"Proteção ASSISTIDA: alertas e recuo; desarme só em perigo extremo.","m_prot_off":"Proteção DESLIGADA. Agora é com você.","m_trip_man":"Desarme manual: todas as barras entrando.","m_turb":"A turbina desarmou junto com o reator: carga cortada para 0.","m_candu_hint":"Religue logo, ou o xenônio vai envenenar o núcleo.","m_reset_wait":"Só é possível rearmar quando as barras estiverem totalmente inseridas.","m_reset":"Proteção rearmada. Retire as barras ou ligue o AUTO para religar.","m_alert":"Período curto: a potência está subindo rápido.","m_step_p":"RECUO: potência subindo rápido demais, barras entrando.","m_step_n":"RECUO: potência acima do limite, barras entrando.","m_step_f":"RECUO: vazão de refrigerante baixa demais para esta potência.","m_step_end":"Recuo encerrado.","m_tiphint":"Dica: toque em ⓘ em qualquer painel para ver uma explicação.","why_trips":{"one":"O reator foi desarmado uma vez. Um desarme limita o resultado a ★★.","many":"O reator foi desarmado {0} vezes. Um desarme limita o resultado a ★★.","other":"O reator foi desarmado {0} vezes. Um desarme limita o resultado a ★★."},"why_steps":{"one":"A proteção acionou o recuo de potência uma vez.","many":"A proteção acionou o recuo de potência {0} vezes.","other":"A proteção acionou o recuo de potência {0} vezes."},"why_pwr":"Dica de PWR: o AUTO mantém a Tavg no programa com as barras; use o boro para mudanças lentas, como o xenônio.","why_bwr":"Dica de BWR: a potência segue a vazão de recirculação. Com o AUTO ligado, as bombas acompanham o alvo.","why_xe":"O xenônio atingiu o pico após a queda de potência. Retire barras cedo quando a carga voltar.","why_great":"Turno excelente: estável e no alvo.","why_orm":"Reserva de barras no desligamento: {0}.","why10":"Você se recusou a fazer o teste em condições inseguras. Essa é a decisão certa.","poisoned":"Envenenamento por xenônio","k_pct":"Tempo no alvo","k_trips":"Desarmes","k_orm":"Menor reserva de barras","k_peak":"Pico de potência","k_xe":"Pico de xenônio","k_time":"Duração do turno","lg_p":"Potência","lg_d":"Demanda","lg_trip":"Desarme","log":"REGISTRO DE EVENTOS","new_rec":"NOVO RECORDE","best":"Melhor {0}","pick_s":"ESCOLHA UM CENÁRIO","br_obj":"OBJETIVO","br_stars":"ESTRELAS","br_tips":"DICAS","br_ctl":"CONTROLES","br_starsT":"★ 40% · ★★ 65% · ★★★ 85% do turno no alvo. Qualquer desarme limita o resultado a ★★.","br_ctl_gen":"Controle de cima: alvo de potência do AUTO. Meio: barras (modo manual). Embaixo: bombas principais de refrigeração.","br_ctl_pwr":"Controle de cima: carga da rede. Meio: barras (o AUTO mantém a Tavg). Embaixo: concentração de boro.","br_ctl_bwr":"Controle de cima: alvo de potência do AUTO. Meio: lâminas de controle. Embaixo: vazão de recirculação (o AUTO a ajusta).","br_prot":"Proteção: {0}. Altere pelo botão lá em cima ou nas Configurações.","br_skip":"Não mostrar este briefing de novo","start":"INICIAR TURNO","br_rbmk1":"As barras são lentas (0,4 m/s). Comece a movê-las antes de a demanda mudar.","br_rbmk2":"Aqui o vapor aumenta a potência. Nunca deixe o período ficar curto; o AUTO o mantém em torno de 40 s.","br_rbmk3":"Mantenha o ORM acima de 15. Depois de uma queda de potência, o xenônio vai tentar você a retirar barras.","br_pwr1":"O AUTO mantém a temperatura média do refrigerante (Tavg) no programa. Observe o indicador de Tavg.","br_pwr2":"Água mais quente reduz a potência, então a usina acompanha a carga sozinha.","br_pwr3":"O xenônio é lento: corrija-o com o boro (menos ppm adicionam reatividade).","br_bwr1":"A vazão define a potência: mais vazão de recirculação varre o vapor e aumenta a potência.","br_bwr2":"O AUTO move as bombas, não as barras. As barras definem o nível básico de potência.","br_bwr3":"Só a vazão cobre cerca de 55-100% da potência. Abaixo disso, insira as lâminas você mesmo.","br_candu1":"Pouquíssima reatividade sobrando: mantenha os ajustadores perto da posição normal.","br_candu2":"O desligamento é muito rápido (1 s), mas uma parada longa em baixa potência termina em envenenamento por xenônio.","br_candu3":"Se houver desarme, rearme e religue rápido, antes que o xenônio vença.","br_test1":"A potência está baixa e o xenônio, alto. Uma falha do regulador vai ocorrer aos 60 s; as barras ficam travadas até os 100 s.","br_test2":"O intertravamento impede a retirada em ORM 15. Inibi-lo é repetir o erro de 1986.","br_test3":"Recusar o teste, ou esperar o xenônio decair, é uma escolha válida.","paused":"Pausado","restart":"Reiniciar","sec_sound":"SOM","sec_play":"JOGABILIDADE","sec_view":"TELA","sec_data":"DADOS","o_sound":"Efeitos sonoros","o_vol":"Volume","o_amb":"Zumbido do reator","o_ambD":"Som ambiente que acompanha o nível de potência","o_hap":"Vibração","o_hapD":"Em desarmes e alarmes","o_prot":"Sistema de proteção","o_slow":"Câmera lenta","o_slowD":"O tempo desacelera durante picos de potência","o_hints":"Briefings e dicas","o_hintsD":"Mostrar um briefing antes de cada cenário","o_units":"Unidade de potência","o_text":"Tamanho do texto","t_norm":"Normal","t_big":"Grande","o_motion":"Animações","m_auto":"Sistema","m_red":"Reduzidas","m_full":"Completas","o_flash":"Flashes na tela","o_flashD":"Flashes vermelhos em desarmes e alarmes","o_reset":"Apagar progresso","o_resetD":"Apaga estrelas, recordes e briefings ocultos","o_resetQ":"Apagar todo o progresso?","o_resetDone":"Progresso apagado.","o_ver":"Versão {0}","search":"Buscar idiomas","lang_note":"Os cartões de ajuda também mostram o termo técnico em inglês.","g_prot":"Sistema de proteção","g_protT":"Três estágios: ALERTA (lâmpada e bipe quando o período fica curto), RECUO (as barras são inseridas automaticamente) e DESARME (todas as barras entram). A proteção Assistida alerta e recua, e só desarma em perigo extremo. Depois de um desarme, pressione REARMAR quando as barras estiverem totalmente inseridas.","g_period":"Período do reator","g_periodT":"O tempo que a potência leva para crescer cerca de 2,7 vezes. 60 s é suave, abaixo de 10 s é rápido, abaixo de 3 s é perigoso. Um período curto é o primeiro sinal de problema.","g_rbmk":"RBMK: vazio positivo","g_rbmkT":"O grafite desacelera os nêutrons, e a água de refrigeração absorve boa parte deles. Quando a água ferve, menos nêutrons são absorvidos e a potência sobe, o que gera mais vapor. As barras são lentas e suas pontas de grafite adicionam reatividade por um instante num scram.","kb_title":"Teclado","kb_pow":"Alvo de potência ou barras","kb_flow":"Vazão ou boro","kb_big":"Segure para passos maiores","kb_trip":"Segure para desarmar (AZ-5 / SCRAM)","kb_reset":"Rearmar após um desarme","kb_pause":"Pausar","kb_speed":"Velocidade da simulação","kb_view":"Vista do núcleo ou da usina","gotit":"Entendi","m_bwr_min":"O AUTO está na vazão mínima: insira as lâminas de controle para baixar mais.","m_bwr_max":"O AUTO está na vazão máxima: retire as lâminas de controle para ter mais potência.","pause":"Pausar","upg":"MELHORIAS","upg_sub":"Modificações reais de usinas. Ganhe créditos concluindo turnos.","upg_test":"O teste de 1986 sempre usa o projeto original: as melhorias ficam desligadas.","upg_on":"Melhorias ativas: {0}/3","upg_new":"Melhoria instalada!","cr":"Créditos","inst":"INSTALADA","installing":"Instalando…","need":"Faltam {0}","fx_scram":"Tempo de SCRAM","fx_ps":"SCRAM positivo","fx_void":"Coeficiente de vazio","fx_bor":"Taxa de boro","fx_rod":"Velocidade das barras","fx_worth":"Valor total das barras","fx_flowr":"Faixa de vazão","fx_min":"Reserva mínima","fx_auto":"Período mín. do AUTO","u_rbmk_fastaz":"SCRAM rápido (AZ-5)","u_rbmk_fastaz_d":"Mudança pós-1986: as barras entram totalmente em cerca de 12 s em vez de 18 s.","u_rbmk_rods":"Barras redesenhadas","u_rbmk_rods_d":"Deslocadores de grafite e absorvedores mais longos: o efeito de SCRAM positivo quase desaparece.","u_rbmk_absorb":"Absorvedores extras + combustível 2,4%","u_rbmk_absorb_d":"Cerca de 80 absorvedores fixos e combustível mais enriquecido reduzem pela metade o coeficiente de vazio positivo.","u_pwr_boron":"Boração rápida","u_pwr_boron_d":"Bombas de carga e tanques de ácido bórico maiores mudam o boro cerca de duas vezes mais rápido.","u_pwr_rodctl":"Controle digital de barras","u_pwr_rodctl_d":"Mecanismos mais rápidos e um regulador mais esperto acompanham a carga com mais precisão.","u_pwr_grey":"Barras cinzas","u_pwr_grey_d":"Barras de seguimento de carga (como o  puissance","s_moved":"Baissez la puissance, puis remontez-la. Le xénon vous résiste.","s_test":"L'essai","s_testd":"Équipe de nuit façon 1986 : puits de xénon, pression du chef, une décision.","s_sand":"Mode libre","s_sandd":"Pleine puissance, sans scénario. Expérimentez librement.","c_rods_rbmk":"GRAPPE DE BARRES","c_rods_pwr":"BARRES DE CONTRÔLE","c_rods_bwr":"LAMES DE CONTRÔLE","c_rods_candu":"BARRES DE RÉGLAGE","c_set":"CONSIGNE AUTO (MW)","c_flow":"POMPES PRINCIPALES","c_flow_bwr":"DÉBIT DE RECIRCULATION","c_boron":"BORE (ppm)","c_load":"CHARGE RÉSEAU (%)","auto":"AUTO","man":"MANUEL","test":"LANCER L'ESSAI","conf":"CONFIRMER ?","trip_rbmk":"AZ-5","trip_o":"SCRAM","mw":"MW","hdr1":"CŒUR","hdr2":"PUISSANCE","hdr3":"TENDANCE (log MW)","hdr4":"XÉNON-135","hdr5":"BARRE / DÉBIT","hdr6":"ALARMES","hdr7":"SALLE DE COMMANDE","orm_rbmk":"ORM","orm_o":"RÉSERVE","rho":"RÉACTIVITÉ","per":"Période","void":"Vide de vapeur","fl":"Débit","rd":"Barres","tavg":"Tavg","bor":"Bore","xeT":"EMPOISONNEMENT AU XÉNON","xeRods":"mange ≈ {0} barres de réactivité","xeUp":"monte","xeDn":"baisse","xeFl":"stable","xeNorm":"normal","xeHigh":"ÉLEVÉ","xePit":"PUITS DE XÉNON","aM1":"RÉSERVE \u003c {0}","aM2":"RÉSERVE \u003c {0} !","aLow":"PUISSANCE BASSE","aPer":"PÉRIODE COURTE","aTrip":"ARRÊT ACTIF","aJam":"BARRES COINCÉES","aTest":"ESSAI EN COURS","aByp":"CONTOURNÉ","aTavg":"TAVG HORS PLAGE","aXe":"XÉNON ÉLEVÉ","goal_train":"Objectif : suivre la courbe de demande à ±5 %.","goal_move":"Objectif : gérer le xénon et suivre la demande.","goal_test":"Objectif : finir l'équipe en sécurité. Règle : ORM ≥ 15.","goal_sand":"Mode libre : pas d'objectif.","goal_pwr":"Objectif : garder Tavg à ±2,5 K du programme.","done":"Équipe terminée","destroyed":"Réacteur détruit","safe":"Arrêt sûr","explain":"Ce qui s'est passé","m_t1":"Suivez la demande. Les barres sont lentes, anticipez.","m_t2":"La demande change ! Suivez-la.","m_mv":"Baisse de charge : réduisez la puissance puis remontez. Surveillez le xénon.","m_hold":"Jeu libre. Tout est actif.","m_a0":"Chef d'équipe : tenez environ 700 MW. L'essai de ralentissement est prévu.","m_a1":"Erreur du régulateur : la puissance chute vite !","m_a2":"Chef : montez à 200 MW et lancez l'essai MAINTENANT. Contournez le verrou s'il le faut.","m_a2b":"Verrou : retrait des barres bloqué à ORM 15. Le xénon met du temps à décroître (essayez ×4).","m_a3":"Essai lancé : les pompes ralentissent.","m_a4":"Essai terminé. Déclenchez l'arrêt programmé du réacteur.","m_m1":"Réserve sous le seuil d'alerte.","m_m2":"Réserve sous le minimum : arrêt obligatoire.","m_jam":"Pic de puissance : canaux déformés, barres coincées !","m_lock":"VERROU : les barres ne peuvent plus être retirées.","m_exc":"EXCURSION ! Ralenti activé. ARRÊTEZ le réacteur !","m_tp":"ARRÊT AUTOMATIQUE : période courte","m_th":"ARRÊT AUTOMATIQUE : puissance élevée","m_tf":"ARRÊT AUTOMATIQUE : faible débit de réfrigérant","m_poison":"Empoisonnement au xénon : la puissance ne peut être tenue. Redémarrage bloqué ~40 heures.","why1":"Coefficient de vide positif : plus de puissance → plus de vapeur → plus de réactivité.","why2":"Effet scram positif : les pointes de graphite AJOUTENT d'abord de la réactivité dans un cœur à ORM faible.","why3":"Le xénon a forcé à retirer les barres : l'ORM est tombé à {0}.","why4":"Les barres mettent ~18 s à descendre et se sont coincées quand les canaux se sont déformés.","why6":"Le verrou et la protection ont été contournés.","why7":"Résultat d'école : vous avez attendu le xénon et fini l'essai avec ORM ≥ 15.","why8":"Le xénon s'est accumulé plus vite que les barres ne pouvaient compenser.","g_orm":"ORM / réserve de barres","g_ormT":"Combien de barres de contrôle (équivalentes) sont insérées = sécurité d'arrêt. Règle RBMK : garder ≥ 26, minimum absolu 15. Les autres conceptions utilisent des limites d'insertion.","g_xe":"Xénon","g_xeT":"Le xénon-135 est un poison neutronique issu de l'iode. Il s'accumule après une baisse de puissance et culmine des heures plus tard. Ici le temps est comprimé ×300. Pour tenir la puissance, retirez de la réactivité ailleurs (barres sorties ou bore dilué).","g_void":"Vides de vapeur","g_voidT":"L'eau qui bout forme des bulles de vapeur. Dans le RBMK plus de vapeur donne PLUS de puissance (rétroaction dangereuse). Dans le BWR, MOINS, donc le débit règle la puissance.","g_rod":"Barres et arrêt","g_rodT":"Les barres de contrôle absorbent les neutrons. Celles du RBMK avancent à 0,4 m/s et mettent ~18 s ; leurs pointes de graphite AJOUTENT brièvement de la réactivité (effet scram positif). Les autres réacteurs lâchent les barres en 1-3 s.","g_rho":"Réactivité $","g_rhoT":"0 $ = puissance stable. +1 $ = critique prompt : la puissance explose en une ou deux secondes. Sous 0 la puissance baisse.","g_pwr":"REP : bore","g_pwrT":"L'acide borique absorbe les neutrons. Le diluer ajoute lentement de la réactivité (contre le xénon). Un réfrigérant plus chaud baisse seul la puissance, la centrale suit la charge du réseau.","g_bwr":"REB : débit = puissance","g_bwrT":"Plus de recirculation chasse la vapeur du cœur et augmente la puissance. Moins la réduit. Les barres fixent le niveau de base.","g_candu":"CANDU : empoisonnement","g_canduT":"L'uranium naturel a peu de réactivité en réserve. Si la puissance reste basse quelques heures, le xénon dépasse ce que les ajusteurs peuvent compenser et le réacteur est bloqué ~40 heures.","st_lang":"LANGUE","u_mw":"MW","u_pct":"% du nominal","yes":"Oui","no":"Non","st_about":"À PROPOS","doc_title":"Reactor Lab · Simulateur de réacteur nucléaire","slow":"RALENTI","tgt":"Cible","hdr_plant":"CENTRALE","pl_core":"Cœur","pl_turb":"Turbine","pl_gen":"Alternateur","pl_cond":"Condenseur","pl_pump":"Pompe","pl_sg":"Gén. vapeur","pl_press":"Pressuriseur","pl_drum":"Ballon séparateur","pl_cal":"Calandre","pl_sep":"Séparateur","pl_fw":"Eau alimentaire","pl_grid":"Réseau","pl_steam":"Vapeur","pl_water":"Eau","tip_core":"Vue de dessus du cœur. Le combustible brille d'autant plus que la puissance est élevée. Les cercles sombres sont les barres de contrôle : la partie pleine indique leur insertion. Touchez ⇄ pour voir toute la centrale.","tip_core_rbmk":"RBMK : environ 1 700 canaux de combustible dans un empilement de graphite. L'eau des canaux absorbe des neutrons : quand elle se vaporise, la puissance AUGMENTE. Les bulles montrent la vapeur dans les canaux.","tip_core_pwr":"REP : assemblages combustibles sous 155 bar, l'eau ne bout jamais. La teinte bleue montre le bore dissous, qui absorbe les neutrons.","tip_core_bwr":"REB : l'eau bout dans le cœur. Les lames cruciformes entre les assemblages sont les barres de contrôle. Plus de vapeur signifie MOINS de puissance.","tip_core_candu":"CANDU : tubes de force horizontaux dans une cuve d'eau lourde (la calandre). Des barres de réglage verticales ajustent finement la réactivité.","tip_plant":"Toute la centrale : la chaleur du cœur produit de la vapeur, la vapeur fait tourner la turbine, le condenseur la retransforme en eau et les pompes la renvoient. Vitesse des flux et couleurs suivent la simulation.","tip_power":"Puissance thermique du cœur. Les cadrans montrent la réserve de barres et la réactivité. En dessous : la période du réacteur et la principale contre-réaction de cette filière.","tip_margin":"Réserve de barres : combien de barres d'absorbant sont dans le cœur. C'est votre marge pour l'arrêt. Jaune : sous le seuil d'alerte. Rouge : sous le minimum, l'arrêt est obligatoire.","tip_margin_rbmk":"ORM (marge de réactivité opérationnelle) : nombre équivalent de barres dans le cœur. Les règles de 1986 exigeaient au moins 15 ; la nuit de l'accident, elle était d'environ 8. Une ORM faible fait aussi que l'AZ-5 AJOUTE d'abord de la réactivité.","tip_rho":"Réactivité en dollars ($). À 0 $, la puissance est stable. Positive, la puissance monte, d'autant plus vite qu'on approche de 1 $. À 1 $, le réacteur est critique prompt : la puissance s'emballe en moins d'une seconde.","tip_trend":"Puissance des dernières minutes en échelle logarithmique (chaque ligne = ×10). La ligne pointillée est la demande ou la consigne. Les repères rouges sont les arrêts.","tip_xe":"Le xénon 135 absorbe les neutrons. Il s'accumule après une BAISSE de puissance (par décroissance de l'iode) et culmine des heures plus tard ; à forte puissance il est brûlé. 100 % = niveau à pleine puissance. Le temps est accéléré ×300.","tip_rods":"Barre de gauche : insertion des barres (les flèches montrent le mouvement). Barre de droite : débit de refroidissement, ou concentration en bore pour un REP.","tip_lamps":"Panneau d'alarmes. Jaune : alerte. Orange : réduction automatique (la protection insère les barres). Rouge : arrêt, réserve sous le minimum ou protection contournée. Clignotant : agissez tout de suite.","aStep":"RÉDUCTION","aFlowLo":"DÉBIT BAS","aVoid":"VIDE ÉLEVÉ","auto_off":"AUTO coupé","lim_on":"LIMITE BARRES","lim_off":"SANS LIMITE","prot_full_s":"PROT","prot_assist_s":"ASSIST","prot_off_s":"SANS PROT","prot_full":"Totale","prot_assist":"Assistée","prot_off":"Coupée","prot_full_d":"Comme une vraie centrale : alarmes, réduction automatique et arrêt automatique.","prot_assist_d":"Alarmes et réduction automatique. Arrêt seulement en cas de danger extrême. Recommandé.","prot_off_d":"Aucune action automatique, seulement des alarmes. Tout dépend de vous.","reset_trip":"RÉARMER","kb_hint":"Touches : ↑↓ puissance · ←→ débit · M auto · X maintenu : arrêt · R réarmer · Espace pause · H aide","m_limon":"Limite des barres ACTIVE : les dernières barres restent dans le cœur.","m_limoff":"Limite des barres COUPÉE : plus rien ne vous empêche de retirer les dernières barres !","m_prot_full":"Protection TOTALE : réduction et arrêt automatiques armés.","m_prot_assist":"Protection ASSISTÉE : alarmes et réduction ; arrêt seulement en cas de danger extrême.","m_prot_off":"Protection COUPÉE. Vous êtes seul aux commandes.","m_trip_man":"Arrêt manuel : toutes les barres s'insèrent.","m_turb":"La turbine a déclenché avec le réacteur : charge ramenée à 0.","m_candu_hint":"Redémarrez vite, sinon le xénon empoisonnera le cœur.","m_reset_wait":"Le réarmement est possible une fois les barres entièrement insérées.","m_reset":"Arrêt réarmé. Retirez les barres ou activez AUTO pour redémarrer.","m_alert":"Période courte : la puissance monte vite.","m_step_p":"RÉDUCTION : la puissance monte trop vite, les barres s'insèrent.","m_step_n":"RÉDUCTION : puissance au-dessus de la limite, les barres s'insèrent.","m_step_f":"RÉDUCTION : débit de refroidissement trop faible pour cette puissance.","m_step_end":"Réduction terminée.","m_tiphint":"Astuce : touchez ⓘ sur un panneau pour une explication.","why_trips":{"one":"Le réacteur s'est arrêté une fois. Un arrêt limite le résultat à ★★.","many":"Le réacteur s'est arrêté {0} fois. Un arrêt limite le résultat à ★★.","other":"Le réacteur s'est arrêté {0} fois. Un arrêt limite le résultat à ★★."},"why_steps":{"one":"La protection a réduit la puissance une fois.","many":"La protection a réduit la puissance {0} fois.","other":"La protection a réduit la puissance {0} fois."},"why_pwr":"Conseil REP : AUTO maintient Tmoy sur le programme avec les barres ; utilisez le bore pour les variations lentes comme le xénon.","why_bwr":"Conseil REB : la puissance suit le débit de recirculation. Avec AUTO, les pompes suivent la consigne.","why_xe":"Le xénon a culminé après la baisse de puissance. Retirez les barres tôt quand la charge revient.","why_great":"Excellent quart : stable et dans la cible.","why_orm":"Réserve de barres au moment de l'arrêt : {0}.","why10":"Vous avez refusé de faire l'essai dans des conditions dangereuses. C'est la bonne décision.","poisoned":"Empoisonnement xénon","k_pct":"Temps dans la cible","k_trips":"Arrêts","k_orm":"Réserve minimale","k_peak":"Puissance max.","k_xe":"Xénon max.","k_time":"Durée du quart","lg_p":"Puissance","lg_d":"Demande","lg_trip":"Arrêt","log":"JOURNAL","new_rec":"NOUVEAU RECORD","best":"Record {0}","pick_s":"CHOISIR UN SCÉNARIO","br_obj":"OBJECTIF","br_stars":"ÉTOILES","br_tips":"CONSEILS","br_ctl":"COMMANDES","br_starsT":"★ 40 % · ★★ 65 % · ★★★ 85 % du quart dans la cible. Tout arrêt limite le résultat à ★★.","br_ctl_gen":"Curseur du haut : consigne de puissance AUTO. Milieu : barres (mode manuel). Bas : pompes de refroidissement.","br_ctl_pwr":"Curseur du haut : charge du réseau. Milieu : barres (AUTO tient Tmoy). Bas : concentration en bore.","br_ctl_bwr":"Curseur du haut : consigne de puissance AUTO. Milieu : lames de contrôle. Bas : débit de recirculation (piloté par AUTO).","br_prot":"Protection : {0}. Modifiez-la avec le bouton en haut ou dans les Réglages.","br_skip":"Ne plus afficher ce briefing","start":"COMMENCER LE QUART","br_rbmk1":"Les barres sont lentes (0,4 m/s). Commencez à les déplacer avant que la demande change.","br_rbmk2":"Ici, la vapeur augmente la puissance. Ne laissez jamais la période raccourcir ; AUTO la garde vers 40 s.","br_rbmk3":"Gardez l'ORM au-dessus de 15. Après une baisse de puissance, le xénon vous poussera à retirer des barres.","br_pwr1":"AUTO maintient la température moyenne du caloporteur (Tmoy) sur le programme. Surveillez l'affichage Tmoy.","br_pwr2":"Une eau plus chaude réduit la puissance : la centrale suit la charge d'elle-même.","br_pwr3":"Le xénon est lent : corrigez-le avec le bore (moins de ppm ajoute de la réactivité).","br_bwr1":"Le débit fixe la puissance : plus de recirculation chasse la vapeur et augmente la puissance.","br_bwr2":"AUTO pilote les pompes, pas les barres. Les barres fixent le niveau de base.","br_bwr3":"Le débit seul couvre environ 55 à 100 % de la puissance. En dessous, insérez les lames vous-même.","br_candu1":"Très peu de réactivité en réserve : gardez les barres de réglage près de leur position normale.","br_candu2":"L'arrêt est très rapide (1 s), mais un long arrêt à faible puissance finit en empoisonnement xénon.","br_candu3":"En cas d'arrêt, réarmez et redémarrez vite avant que le xénon ne  d'un problème.","g_rbmk":"RBMK : vide positif","g_rbmkT":"Le graphite ralentit les neutrons et l'eau de refroidissement en absorbe une partie. Quand l'eau bout, moins de neutrons sont absorbés et la puissance monte, ce qui produit encore plus de vapeur. Les barres sont lentes et leurs embouts en graphite ajoutent brièvement de la réactivité lors d'un arrêt.","kb_title":"Clavier","kb_pow":"Consigne de puissance ou barres","kb_flow":"Débit ou bore","kb_big":"Maintenir pour des pas plus grands","kb_trip":"Maintenir pour arrêter (AZ-5 / SCRAM)","kb_reset":"Réarmer après un arrêt","kb_pause":"Pause","kb_speed":"Vitesse de simulation","kb_view":"Vue cœur ou centrale","gotit":"Compris","m_bwr_min":"AUTO est au débit minimum : insérez les lames de contrôle pour descendre plus bas.","m_bwr_max":"AUTO est au débit maximum : retirez les lames de contrôle pour plus de puissance.","pause":"Pause","upg":"AMÉLIORATIONS","upg_sub":"De vraies modifications de centrales. Gagnez des crédits en terminant des quarts.","upg_test":"L'essai de 1986 utilise toujours la conception d'origine : améliorations désactivées.","upg_on":"Améliorations actives : {0}/3","upg_new":"Amélioration installée !","cr":"Crédits","inst":"INSTALLÉE","installing":"Installation…","need":"Encore {0}","fx_scram":"Temps d'insertion","fx_ps":"Scram positif","fx_void":"Coefficient de vide","fx_bor":"Vitesse du bore","fx_rod":"Vitesse des barres","fx_worth":"Efficacité totale des barres","fx_flowr":"Plage de débit","fx_min":"Réserve minimale","fx_auto":"Période min. AUTO","u_rbmk_fastaz":"Arrêt rapide (AZ-5)","u_rbmk_fastaz_d":"Modification d'après 1986 : les barres s'insèrent entièrement en environ 12 s au lieu de 18 s.","u_rbmk_rods":"Barres repensées","u_rbmk_rods_d":"Prolongateurs en graphite et absorbants plus longs : l'effet de scram positif disparaît presque.","u_rbmk_absorb":"Absorbants ajoutés + combustible à 2,4 %","u_rbmk_absorb_d":"Environ 80 absorbants fixes et un combustible plus enrichi divisent par deu
