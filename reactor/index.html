"goal_move":"Цель: управлять ксеноном и следовать спросу.","goal_test":"Цель: безопасно завершить смену. Правило: ОЗР ≥ 15.","goal_sand":"Песочница: цели нет.","goal_pwr":"Цель: держать Tavg в пределах ±2,5 K от программы.","done":"Смена завершена","destroyed":"Реактор разрушен","safe":"Безопасный останов","explain":"Что произошло","m_t1":"Следуйте спросу. Стержни медленные, планируйте заранее.","m_t2":"Спрос изменился! Следуйте.","m_mv":"Сброс нагрузки: снизьте мощность и верните. Следите за ксеноном.","m_hold":"Свободная игра. Всё активно.","m_a0":"Начальник смены: держите около 700 МВт. Испытание на выбег запланировано.","m_a1":"Ошибка регулятора: мощность быстро падает!","m_a2":"Начальник смены: поднимите до 200 МВт и проводите испытание СЕЙЧАС. При необходимости отключите блокировку.","m_a2b":"Блокировка: извлечение стержней запрещено при ОЗР 15. Ксенону нужно время (попробуйте ×4).","m_a3":"Выбег начат: насосы замедляются.","m_a4":"Испытание окончено. Остановите реактор для планового останова.","m_m1":"Запас ниже уровня предупреждения.","m_m2":"Запас ниже минимума: останов обязателен.","m_jam":"Скачок мощности: каналы деформированы, стержни заклинило!","m_lock":"БЛОКИРОВКА: стержни нельзя извлекать дальше.","m_exc":"РАЗГОН! Замедленная съёмка. ОСТАНОВИТЕ реактор!","m_tp":"АВТОМАТИЧЕСКИЙ ОСТАНОВ: короткий период","m_th":"АВТОМАТИЧЕСКИЙ ОСТАНОВ: высокая мощность","m_tf":"АВТОМАТИЧЕСКИЙ ОСТАНОВ: малый расход теплоносителя","m_poison":"Ксеноновое отравление: мощность не удержать. Пуск заблокирован ~40 часов.","why1":"Положительный паровой коэффициент: больше мощности → больше пара → больше реактивности.","why2":"Положительный эффект АЗ: графитовые наконечники сначала ДОБАВЛЯЮТ реактивность в зоне с низким ОЗР.","why3":"Ксенон заставил извлечь стержни: ОЗР упал до {0}.","why4":"Стержням нужно ~18 с на ввод, и они заклинили после деформации каналов.","why6":"Блокировка и защита были отключены.","why7":"Образцовый результат: вы переждали ксенон и завершили испытание при ОЗР ≥ 15.","why8":"Ксенон накопился быстрее, чем стержни могли компенсировать.","g_orm":"ОЗР / запас стержней","g_ormT":"Сколько (эквивалентных) стержней управления введено = безопасность останова. Правило РБМК: держать ≥ 26, абсолютный минимум 15. Другие конструкции используют пределы ввода.","g_xe":"Ксенон","g_xeT":"Ксенон-135 — нейтронный яд, образующийся из йода. Накапливается после снижения мощности и достигает максимума через часы. Здесь время сжато ×300. Чтобы держать мощность, нужно убрать реактивность в другом месте (извлечь стержни или разбавить бор).","g_void":"Паровые пустоты","g_voidT":"Кипящая вода даёт пузырьки пара. В РБМК больше пара — БОЛЬШЕ мощности (опасная обратная связь). В BWR — МЕНЬШЕ, поэтому мощностью управляет расход.","g_rod":"Стержни и останов","g_rodT":"Стержни управления поглощают нейтроны. У РБМК они движутся 0,4 м/с и входят ~18 с; графитовые наконечники ненадолго ДОБАВЛЯЮТ реактивность (положительный эффект АЗ). В других реакторах стержни падают за 1-3 с.","g_rho":"Реактивность $","g_rhoT":"0 $ = мощность стабильна. +1 $ = мгновенная критичность: мощность взрывается за секунду-две. Ниже 0 мощность падает.","g_pwr":"PWR: бор","g_pwrT":"Борная кислота поглощает нейтроны. Разбавление медленно добавляет реактивность (против ксенона). Горячий теплоноситель сам снижает мощность, станция следует нагрузке сети.","g_bwr":"BWR: расход = мощность","g_bwrT":"Больший расход рециркуляции выметает пар из зоны и повышает мощность. Меньший — снижает. Стержни задают базовый уровень.","g_candu":"CANDU: отравление","g_canduT":"У природного урана мало запаса реактивности. Если мощность несколько часов низкая, ксенон превосходит возможности корректоров, и реактор блокируется на ~40 часов.","st_lang":"ЯЗЫК","u_mw":"МВт","u_pct":"% от номинала","yes":"Да","no":"Нет","st_about":"О ПРОГРАММЕ","doc_title":"Reactor Lab · Симулятор ядерного реактора","slow":"ЗАМЕДЛЕНИЕ","tgt":"Цель","hdr_plant":"ЭНЕРГОБЛОК","pl_core":"Реактор","pl_turb":"Турбина","pl_gen":"Генератор","pl_cond":"Конденсатор","pl_pump":"Насос","pl_sg":"Парогенер.","pl_press":"Компенсатор","pl_drum":"Барабан-сепаратор","pl_cal":"Каландр","pl_sep":"Сепаратор","pl_fw":"Пит. вода","pl_grid":"Сеть","pl_steam":"Пар","pl_water":"Вода","tip_core":"Вид активной зоны сверху. Чем выше мощность, тем ярче светится топливо. Тёмные кружки — стержни управления: заполненная часть показывает глубину погружения. Нажмите ⇄, чтобы увидеть весь энергоблок.","tip_core_rbmk":"РБМК: около 1700 топливных каналов в графитовой кладке. Вода в каналах поглощает нейтроны, поэтому при её закипании мощность РАСТЁТ. Пузырьки показывают пар в каналах.","tip_core_pwr":"ВВЭР/PWR: тепловыделяющие сборки под давлением 155 бар, вода не кипит. Синий оттенок показывает растворённый бор, поглощающий нейтроны.","tip_core_bwr":"Кипящий реактор (BWR): вода кипит прямо в активной зоне. Крестообразные пластины между сборками — стержни управления. Больше пара — МЕНЬШЕ мощность.","tip_core_candu":"CANDU: горизонтальные технологические каналы в баке с тяжёлой водой (каландре). Вертикальные регулирующие стержни точно подстраивают реактивность.","tip_plant":"Весь энергоблок: тепло активной зоны превращает воду в пар, пар вращает турбину, конденсатор снова превращает его в воду, а насосы возвращают её обратно. Скорость потоков и цвета следуют за моделью.","tip_power":"Тепловая мощность активной зоны. Шкалы показывают запас стержней и реактивность. Ниже — период реактора и главная обратная связь этой конструкции.","tip_margin":"Запас стержней: сколько стержней-эквивалентов поглотителя находится в зоне. Это ваш запас для надёжной остановки. Жёлтый — ниже уровня предупреждения. Красный — ниже минимума, реактор нужно заглушить.","tip_margin_rbmk":"ОЗР (оперативный запас реактивности): эквивалентное число стержней в зоне. Регламент 1986 года требовал не менее 15; в ночь аварии ОЗР был около 8. Малый ОЗР также приводит к тому, что АЗ-5 сначала ВНОСИТ положительную реактивность.","tip_rho":"Реактивность в долларах ($). При 0 $ мощность постоянна. При положительной мощность растёт, тем быстрее, чем ближе к 1 $. При 1 $ реактор становится критическим на мгновенных нейтронах: мощность уходит вразнос за доли секунды.","tip_trend":"Мощность за последние минуты в логарифмическом масштабе (каждая линия — ×10). Пунктир — спрос или уставка. Красные отметки — срабатывания защиты.","tip_xe":"Ксенон-135 поглощает нейтроны. Он накапливается после СНИЖЕНИЯ мощности (из распадающегося йода) и достигает максимума через несколько часов; на высокой мощности выгорает. 100 % — уровень при полной мощности. Время ускорено ×300.","tip_rods":"Левая шкала: погружение стержней (стрелки показывают движение). Правая шкала: расход теплоносителя или, для PWR, концентрация бора.","tip_lamps":"Панель сигнализации. Жёлтый — предупреждение. Оранжевый — ускоренная разгрузка (защита вводит стержни). Красный — срабатывание защиты, запас ниже минимума или защита отключена. Мигание — действуйте немедленно.","aStep":"РАЗГРУЗКА","aFlowLo":"МАЛЫЙ РАСХОД","aVoid":"МНОГО ПАРА","auto_off":"АВТО выкл.","lim_on":"ЛИМИТ СТЕРЖНЕЙ","lim_off":"БЕЗ ЛИМИТА","prot_full_s":"ЗАЩИТА","prot_assist_s":"ПОМОЩЬ","prot_off_s":"БЕЗ ЗАЩИТЫ","prot_full":"Полная","prot_assist":"Помощь","prot_off":"Выкл.","prot_full_d":"Как на настоящей станции: предупреждения, автоматическая разгрузка и аварийная защита.","prot_assist_d":"Предупреждения и автоматическая разгрузка. Аварийная остановка только при крайней опасности. Рекомендуется.","prot_off_d":"Никаких автоматических действий, только сигнализация. Всё зависит от вас.","reset_trip":"СБРОС","kb_hint":"Клавиши: ↑↓ мощность · ←→ расход · M авто · удерживать X: защита · R сброс · Пробел пауза · H помощь","m_limon":"Лимит стержней ВКЛЮЧЁН: последние стержни остаются в зоне.","m_limoff":"Лимит стержней ВЫКЛЮЧЕН: теперь ничто не мешает извлечь последние стержни!","m_prot_full":"Защита ПОЛНАЯ: автоматическая разгрузка и аварийная защита взведены.","m_prot_assist":"Защита в режиме ПОМОЩЬ: предупрежде /* ---------- Santral şeması: CANDU (basınçlı ağır su, yatay kanallar) ----------
   Birincil (ağır su): kalandriya içindeki yatay basınç tüpleri -> çıkış başlığı (sağ) -> sıcak bacak -> buhar üreteci (U tüpler)
   -> ısı taşıma pompası -> giriş başlığı (sol) -> kanallar. Moderatör: kalandriyadaki soğuk ağır su.
   Reaktivite güvertesi (üstte): ayar çubukları S.p / S.T.stroke kadar içeride; SDS1 kapatma çubukları açmada düşer;
   SDS2 sol üstteki tanktan sıvı zehir (gadolinyum nitrat) püskürtür. İkincil: buhar üreteci -> türbin -> kondenser -> besi pompası.
   Yalnız çizim: S değiştirilmez. */
PLANT.candu = (() => {
  const TAU = Math.PI * 2;
  const cl = (v, a, b) => (v < a ? a : v > b ? b : v);
  /* --- Geometri (158 x 146 kutu) --- */
  const CAL = { x0: 10, x1: 78, y0: 62, y1: 104 };                  // kalandriya gövdesi

/* ---------- Santral şeması: PWR (basınçlı su reaktörü, iki devre) ----------

/* ==== 04-plant-rbmk.js ==== */
/* ---------- Santral şeması: RBMK-1000 (grafit moderatörlü kanal tipi, tek devreli doğrudan çevrim) ----------
   Akış: ana sirkülasyon pompaları (MCP) -> basınç kolektörü -> alt su hatları -> kanallar (kor, yukarı) -> buhar-su
   hatları -> 2 ayırıcı tambur -> doymuş buhar -> türbin -> kondenser -> besleme suyu pompası -> tambur -> iniş boruları -> MCP.
   Kontrol çubukları üstten girer (ekleme S.p / S.T.stroke); RBMK'ya özgü grafit iticiler (displacer) soluk gri çizilir.
   Çizimler gruplanır (aynı renkteki borular/noktalar tek yol) ki kare başına çağrı sayısı düşük kalsın. */
PLANT.rbmk = (() => {
  const TAU = Math.PI * 2, HP = Math.PI / 2;

  const CO = { x: 20, y: 53, w: 56, h: 40 };          // grafit yığını (kor)

    fw: mk([[106.5, 124], [97, 124], [97, 27], [92.6, 27]]),

    cwIn: mk([[155.4, CD.y + 19], [148, CD.y + 19]]), cwOut: mk([[148, CD.y + 5], [155.4, CD.y + 5]]),

    [3.2, 'loop', [P.downL.pts, P.downR.pts, P.disL.pts, P.disR.pts]],

    [1.6, 'loop', STUBS.map(s => s.pts)],
    [2, 'loop', [P.eq.pts]],
    [4.2, 'rise', [P.riseL.pts, P.riseR.pts]],
    [2.6, 'fw', [P.fw.pts]],
    [2.4, 'cond', [P.cond.pts]],
    [2.6, 'cw', [P.cwIn.pts, P.cwOut.pts]],

  const LOOPDOTS = [P.downL, P.downR, P.disL, P.disR, P.hdrL, P.hdrR, ...STUBS], RISERS = [P.riseL, P.riseR];
  /* akış yönü okları (hareketsiz kipte de yön okunur): x, y, açı */
  const CHEV = [[12, 74, HP], [84, 74, HP], [48, 117.5, -HP], [31, 124, 0], [65, 124, Math.PI], [97, 64, -HP], [112, 94, HP], [90, 13, 0]];
  const NECK = [[130, TB.y + TB.h * (0.7 + 0.3 * 26 / 34)], [138, TB.y + TB.h], [141, CD.y], [126, CD.y]];
  /* sabit sözde rastgele (deterministik) */
  const hash = k => { const s = Math.sin(k * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  let G = null, Gc = null;
  function grads(c) {

    const lg = (x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); for (const [o, col] of stops) g.addColorStop(o, col); return g; };
    G.graph = lg(CO.x, 0, CO.x + CO.w, 0, [[0, '#1b222c'], [0.5, '#2b3440'], [1, '#1b222c']]);

    G.waterD = lg(0, DR[0].y + 3, 0, DR[0].y + DR[0].h, [[0, '#6a5050'], [1, '#3a2a2a']]);

  function smoke(c, x, y, now, amt, spread, k0) {

      c.fillStyle = `rgba(${118 + 30 * p | 0},${116 + 28 * p | 0},${120 + 26 * p | 0},${(0.5 * (1 - p) * amt).toFixed(3)})`; c.beginPath(); c.arc(xx, yy, 2.5 + p * 7, 0, TAU); c.fill();

    c.strokeStyle = 'rgba(127,166,211,.24)'; c.lineWidth = 0.7; c.beginPath();
    c.moveTo(133, 145.5); c.lineTo(139.5, 84); c.moveTo(153, 145.5); c.lineTo(146.5, 84);
    for (let i = 0; i < 6; i++) { const y0 = 145.5 - i * 10.3, y1 = y0 - 10.3, w0 = lerp(10, 3.5, i / 6), w1 = lerp(10, 3.5, (i + 1) / 6); c.moveTo(143 - w0, y0); c.lineTo(143 + w1, y1); c.moveTo(143 + w0, y0); c.lineTo(143 - w1, y1); }
