<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#060b14">
<title>Reactor Lab</title>
<style>
:root{color-scheme:dark;--bg:#060b14;--ink:#e6f0ff;--muted:#8199b8;--acc:#5fd3ff;--ok:#46e0a0;--warn:#ffc83d;--bad:#ff5468}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 0%,#12233b,#060b14 70%);color:var(--ink);font-family:'Trebuchet MS',system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column}
#cw{position:relative;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block}
#top{position:absolute;right:8px;top:6px;display:flex;gap:6px;z-index:2}
#top button{width:30px;height:26px;border-radius:8px;border:1px solid #2b4a74;background:rgba(10,20,36,.8);color:var(--ink);font:700 13px/1 inherit;cursor:pointer}
#ctl{flex:none;display:flex;flex-direction:column;gap:5px;padding:4px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(6,11,20,0),#0a1424 28%)}
.row{background:linear-gradient(180deg,#15263f,#0f1c31);border:1px solid #22395c;border-radius:12px;padding:3px 12px 4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.row[hidden]{display:none}
.row label{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);height:18px;gap:6px}
.row label b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{font:700 10px/1 inherit;padding:3px 7px;border-radius:7px;border:1px solid #2f6b4f;background:rgba(70,224,160,.12);color:var(--ok);cursor:pointer}
.chip.off{border-color:#8f2a38;background:rgba(255,84,104,.18);color:var(--bad)}
.chip.arm{animation:blink .5s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
input[type=range]{width:100%;height:24px;background:transparent;-webkit-appearance:none;appearance:none;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:9px;border-radius:6px;background:linear-gradient(180deg,#0a1220,#1b3050);box-shadow:inset 0 1px 3px #000a}
input[type=range]::-moz-range-track{height:9px;border-radius:6px;background:linear-gradient(180deg,#0a1220,#1b3050)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:24px;margin-top:-8px;border-radius:7px;background:linear-gradient(180deg,#d9e4f3,#8fa3bd 55%,#6b7f9a);border:1px solid #2a3a52;box-shadow:0 2px 6px #000a,inset 0 1px 0 #fff8}
input[type=range]::-moz-range-thumb{width:28px;height:22px;border-radius:7px;background:linear-gradient(180deg,#d9e4f3,#8fa3bd);border:1px solid #2a3a52}
input[type=range]:disabled{opacity:.4}
.btns{display:flex;gap:6px;align-items:stretch}
.b{flex:1;font:700 12px/1 inherit;padding:0 4px;height:42px;border:1px solid #2a436b;border-radius:11px;background:linear-gradient(180deg,#1d3558,#14243f);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 #08101c}
.b.on{background:linear-gradient(180deg,#7be0ff,#2aa8e0);color:#04202f;border-color:#7be0ff}.b:disabled{opacity:.4}.b[hidden]{display:none}
.azw{position:relative;flex:2}
#az{position:relative;width:100%;height:42px;font:800 15px/1 inherit;letter-spacing:.1em;color:#fff;border:1px solid #7d1022;border-radius:11px;background:linear-gradient(180deg,#ff6b7c,#c91f37);box-shadow:0 3px 0 #6a0d1c;overflow:hidden;cursor:pointer}
#az i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.4)}
#az span{position:relative}
#cover{position:absolute;inset:0;border-radius:11px;background:repeating-linear-gradient(45deg,#f2c200 0 9px,#1a1a1a 9px 18px);border:1px solid #000;display:flex;align-items:center;justify-content:center;transform-origin:50% 0;transition:transform .28s,opacity .28s;cursor:pointer;z-index:2}
#cover span{background:#1a1a1a;color:#f2c200;font:800 11px/1 inherit;letter-spacing:.1em;padding:5px 8px;border-radius:6px}
#cover.open{transform:perspective(300px) rotateX(95deg);opacity:0;pointer-events:none}
#ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:0 0 24px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#14304f,#060b14 75%);overflow-y:auto}
#ov[hidden]{display:none}
.hero{width:100%;flex:none;position:relative}
.hero svg{display:block;width:100%;height:auto}
.hero h1{position:absolute;left:0;right:0;bottom:12px;margin:0;font-size:29px;letter-spacing:.1em;background:linear-gradient(180deg,#fff,#8fd8ff 60%,#4aa6d8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,.8))}
.hero small{position:absolute;left:0;right:0;bottom:-2px;color:#9fb6d6;font-size:10.5px;letter-spacing:.16em}
@keyframes steam{0%{transform:translateY(0) scale(.7);opacity:0}20%{opacity:.5}100%{transform:translateY(-46px) scale(1.5);opacity:0}}
.sm{animation:steam 5s linear infinite}.sm:nth-child(2){animation-delay:1.6s}.sm:nth-child(3){animation-delay:3.2s}
@keyframes pulse{50%{opacity:.55}}.glow{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sm,.glow{animation:none}}
.h3{margin:0;font-size:12px;letter-spacing:.18em;color:#7e96b6;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;padding:0 14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px 10px;border:1px solid #2a436b;border-radius:15px;background:linear-gradient(180deg,#17294a,#0f1c33);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 3px 0 #08101c}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 #08101c}
.tile svg{width:64px;height:54px}.tile b{font-size:15px}.tile span{font-size:10.5px;color:var(--muted);line-height:1.25;min-height:26px}.tile .st{color:#ffd23f;font-size:11px;letter-spacing:2px;min-height:0}
.cards{display:flex;flex-direction:column;gap:9px;width:100%;padding:0 14px}
.card{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 13px;border:1px solid #2a436b;border-radius:14px;background:linear-gradient(180deg,#17294a,#0f1c33);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 3px 0 #08101c}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 #08101c}
.card .ic{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#0b1626;border:1px solid #2a436b}
.card b{display:block;font-size:15px}.card span{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
.card .st{margin-left:auto;color:#ffd23f;font-size:13px;letter-spacing:2px;white-space:nowrap}
.card.hard .ic{border-color:#8f2a38}
.stats{width:100%;padding:0 14px;display:flex;flex-direction:column;gap:6px}
.stat{display:flex;align-items:center;gap:8px;font-size:11px}.stat em{font-style:normal;flex:0 0 108px;text-align:left;color:var(--muted)}
.stat i{flex:1;height:7px;border-radius:5px;background:#0a1220;position:relative;overflow:hidden}.stat i s{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.stat b{flex:0 0 96px;text-align:right;font-size:10px;letter-spacing:.04em}
.mini{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ghost{font:600 13px/1 inherit;padding:11px 15px;border-radius:11px;border:1px solid #2b4a74;background:rgba(10,20,36,.7);color:var(--ink);cursor:pointer}
.ghost.sel{border-color:var(--acc);color:var(--acc)}
.btn{font:800 16px/1 inherit;padding:13px 26px;border:0;border-radius:13px;background:linear-gradient(180deg,#7be0ff,#2aa8e0);color:#052033;box-shadow:0 4px 0 #14709b;cursor:pointer;min-width:200px}
.pad{padding:0 18px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
#ov h2{margin:0;font-size:23px}
#ov p{margin:0;max-width:330px;color:var(--muted);font-size:13.5px;line-height:1.45}
#ov ul{margin:0;padding-left:18px;text-align:left;max-width:330px;color:#a8bcd6;font-size:13px;line-height:1.45}
#ov li+li{margin-top:4px}
.stars{font-size:32px;letter-spacing:6px;color:#ffd23f}.stars i{font-style:normal;opacity:.25}.stars i.on{opacity:1}
.help{width:100%;max-width:360px;display:flex;flex-direction:column;gap:9px;padding:0 14px;text-align:left}
.hc{background:linear-gradient(180deg,#14253f,#0e1b30);border:1px solid #22395c;border-radius:12px;padding:10px 12px}
.hc b{display:block;color:#fff;font-size:14px;margin-bottom:3px}.hc span{color:#a8bcd6;font-size:12.5px;line-height:1.4}
.sets{width:100%;max-width:360px;display:flex;flex-direction:column;gap:9px;padding:0 14px;text-align:left}
.sr{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,#14253f,#0e1b30);border:1px solid #22395c;border-radius:12px;padding:10px 12px;font-size:12px;letter-spacing:.06em;color:#9fb6d6}
.sr .v{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sr .v .ghost{padding:8px 10px;font-size:12px}
.sr input[type=range]{width:130px}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
small.d{color:#6a82a3;font-size:11px;max-width:320px;line-height:1.4}
</style>
</head>

 <div class="row"><label><span id="lr"></span><span><button class="chip" id="bypass"></button> <b id="vr"></b></span></label><input id="rods" type="range" min="0" max="700" value="350" aria-label="rods"></div>

 <div class="btns"><button class="b" id="auto"></button><button class="b" id="test"></button><button class="b" id="spd">×1</button><button class="b" id="pause">II</button><div class="azw"><button id="az"><i></i><span id="azt">AZ-5</span></button><div id="cover"><span id="cvt">AZ-5 ▲</span></div></div></div>
</div>
<div id="ov"></div>
</div>
<script>
(() => {
'use strict';

/* Basitleştirilmiş, EĞİTİM amaçlı reaktör modelleri (RBMK, PWR, BWR, CANDU). Sayılar kamuya açık kaynaklardan hafızayla alınmış yaklaşık değerlerdir;
   mühendislik hesabı için KULLANILMAZ. Ortak yapı: nokta kinetik (tek gecikmiş grup), Xe-135/I-135 zinciri, buhar boşluğu ve Doppler geri beslemesi,
   çubuk hızı/ORM, türe özgü: RBMK pozitif boşluk + pozitif scram + sıkışma; PWR borik asit + moderatör sıcaklığı; BWR debiyle güç; CANDU hızlı kapatma + güçlü ksenon. */
const M = (() => {
  const Z = 300, gI = 0.061, gX = 0.003, lI = 0.1055, lX = 0.0758, lamD = 0.08;
  const XeqF = (n, kb) => (gI + gX) * n / (lX + kb * n);
  const TYPES = {
    rbmk: { id: 'rbmk', Pn: 3200, beta: 0.0048, Lam: 1e-3, stroke: 7, vRod: 0.4, vAz: 0.4, N: 30, wRod: 0.45, warn: 26, minM: 15, aD: 1.4e-5, Tf: 550,
      vsign: 1, vmax: 0.25, x0: 0.3, U0: 0.12, av0: 5, cV: 2, ps0: 4.4, tauV: 1.5, kb: 0.38, xeW: 6.5, boron: false, mod: false, tripN: 1.2, tripPer: 10, tripFlow: 0.45, init: { n: 1, orm: 15, flow: 1 } },
    pwr: { id: 'pwr', Pn: 3000, beta: 0.0065, Lam: 2e-5, stroke: 3.66, vRod: 0.06, vAz: 1.5, N: 30, wRod: 0.4, warn: 20, minM: 10, aD: 2.5e-5, Tf: 450,
      vsign: 1, vmax: 0.02, x0: 0.5, U0: 1, av0: 0, cV: 0, ps0: 0, tauV: 1.5, kb: 0.45, xeW: 5.5, boron: true, bW: 8e-5, bRate: 4, bMax: 1500, mod: true, aM: 3e-4, kT: 12, tripN: 1.09, tripPer: 3, tripFlow: 0, init: { n: 1, orm: 22, flow: 1, boron: 900 } },
    bwr: { id: 'bwr', Pn: 3300, beta: 0.0055, Lam: 4e-5, stroke: 3.66, vRod: 0.05, vAz: 1.2, N: 30, wRod: 0.45, warn: 20, minM: 10, aD: 2e-5, Tf: 500,
      vsign: -1, vmax: 0.6, x0: 0.5, U0: 0.05, av0: 27, cV: 0, ps0: 0, tauV: 2.2, kb: 0.45, xeW: 5.5, boron: false, mod: false, tripN: 1.2, tripPer: 5, tripFlow: 0.4, init: { n: 1, orm: 20, flow: 0.9 } },
    candu: { id: 'candu', Pn: 2060, beta: 0.0049, Lam: 9e-4, stroke: 3, vRod: 0.1, vAz: 3, N: 14, wRod: 0.5, warn: 8, minM: 4, aD: 1.2e-5, Tf: 500,
      vsign: 1, vmax: 0.4, x0: 0.4, U0: 1.05, av0: 2.9, cV: 0, ps0: 0, tauV: 1.5, kb: 0.8, xeW: 4.5, boron: false, mod: false, tripN: 1.1, tripPer: 6, tripFlow: 0.6, init: { n: 1, orm: 8, flow: 1 } }
  };
  const S3 = x => x * x * (3 - 2 * x);
  const ORM = (s, p) => s.T.N * S3(Math.max(0, Math.min(1, p / s.T.stroke)));
  const pForOrm = (T, orm) => { let lo = 0, hi = 1; const f = x => T.N * S3(x); for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; f(m) < orm ? lo = m : hi = m; } return lo * T.stroke; };
  const voidTarget = (s, q, f, sub) => { const T = s.T, x = Math.max(0, q / Math.max(0.05, f) - T.U0 * (sub === undefined ? 1 : sub)); return T.vmax * x / (x + T.x0); };
  const alphaV = (s, orm) => s.T.vsign * s.T.av0 * (1 + s.T.cV * Math.max(0, 1 - orm / s.T.warn)) * s.T.beta;
  const tRef = D => 288 + 16 * D;
  function rho(s) {
    const T = s.T, orm = ORM(s, s.p);
    const ps = s.az && T.ps0 ? T.ps0 * T.beta * s.psF * (s.azT < 3.2 ? Math.sin(Math.PI * s.azT / 3.2) ** 2 : 0) : 0;
    let r = s.bias - T.wRod * T.beta * orm - s.kappa * s.X - T.aD * (s.Tf - 300) + alphaV(s, orm) * s.v + ps;
    if (T.boron) r -= T.bW * s.boron; if (T.mod) r -= T.aM * (s.Tm - 300);
    return r;
  }
  function create(type, o) {
    const T = typeof type === 'string' ? TYPES[type] : type; o = o || {}; const I = T.init;
    const n0 = o.n === undefined ? I.n : o.n, p0 = o.p === undefined ? pForOrm(T, o.orm === undefined ? I.orm : o.orm) : o.p, f0 = o.flow === undefined ? I.flow : o.flow;
    const s = { T, type: T.id, t: 0, n: n0, C: T.beta * n0 / (T.Lam * lamD), p: p0, pTarget: p0, flow: f0, flowTarget: f0, v: 0, Tf: 300, Tm: 300, X: 0, I: 0, bias: 0, kappa: T.xeW * T.beta / XeqF(1, T.kb), az: false, azT: 0, psF: 0, jammed: false, destroyed: false, destroyT: 0, auto: false, interlock: true, bypass: false, nSet: n0, D: n0, maxN: n0, test: false, testT: 0, rate: 0, nPrev: n0,
      boron: o.boron === undefined ? (I.boron || 0) : o.boron, boronTarget: o.boron === undefined ? (I.boron || 0) : o.boron, pLock: pForOrm(T, T.minM), sub: o.sub === undefined ? 1 : o.sub };
    const nh = o.nHist === undefined ? n0 : o.nHist; s.I = gI * nh / lI; s.X = XeqF(nh, T.kb);
    s.Tm = T.mod ? tRef(n0) : 300; s.Tf = T.mod ? s.Tm + T.Tf * n0 : 300 + T.Tf * n0; s.v = voidTarget(s, n0, f0, s.sub);
    s.bias = 0; s.bias = -rho(s); return s;
  }
  function stepRods(s, dt) {
    if (s.jammed) return; const T = s.T; let tgt = s.az ? T.stroke : s.pTarget, v = s.az ? T.vAz : T.vRod;
    if (!s.az && s.auto) {
      let d; const k = T.stroke / 7;
      if (T.mod) { const e = (tRef(s.D) - s.Tm) / 2; d = -Math.max(-1, Math.min(1, e)) * 0.5 * k; }
      else { const e = (s.nSet - s.n) / Math.max(0.03, s.nSet); d = -Math.max(-1, Math.min(1, 2.2 * e)) * 0.8 * k; if (d < 0 && s.rate > 1 / 30) d = 0; if (s.rate > 1 / 15) d = Math.max(d, 0.3 * k); }
      tgt = Math.max(0, Math.min(T.stroke, s.p + d)); s.pTarget = tgt;
    }
    if (s.interlock) tgt = Math.max(tgt, Math.min(s.p, s.pLock));
    const d2 = tgt - s.p, m = v * dt; s.p += Math.abs(d2) <= m ? d2 : Math.sign(d2) * m;
  }
  function step(s, dt) {
    if (s.destroyed) { s.destroyT += dt; return; }
    const T = s.T; s.t += dt; if (s.az) s.azT += dt;
    if (s.test) { s.testT += dt; s.flowTarget = s.flowBase * (0.55 + 0.45 * Math.exp(-s.testT / 25)); }
    stepRods(s, dt);
    const df = s.flowTarget - s.flow, mf = 0.012 * dt * (s.test ? 6 : 1) * (T.id === 'bwr' ? 3 : 1); s.flow += Math.abs(df) <= mf ? df : Math.sign(df) * mf;
    if (T.boron) { const db = s.boronTarget - s.boron, mb = T.bRate * dt; s.boron += Math.abs(db) <= mb ? db : Math.sign(db) * mb; }
    const nsub = Math.max(1, Math.ceil(dt / 0.002)), h = dt / nsub;
    for (let i = 0; i < nsub; i++) {
      const r = rho(s), a = (r - T.beta) / T.Lam;
      s.n = a < 0 ? (s.n + h * lamD * s.C) / (1 - h * a) : s.n * Math.exp(a * h) + h * lamD * s.C; s.n = Math.max(1e-7, Math.min(4e3, s.n));
      s.C = Math.max(0, s.C + (T.beta / T.Lam * s.n - lamD * s.C) * h);
    }
    { const r = (Math.log(s.n) - Math.log(s.nPrev || s.n)) / dt; s.rate = 0.9 * (s.rate || 0) + 0.1 * r; s.nPrev = s.n; }
    const q = s.n;
    if (T.mod) { s.Tm += T.kT * (q - s.D) * dt; s.Tm = Math.max(250, Math.min(360, s.Tm)); s.Tf += (s.Tm + T.Tf * q - s.Tf) * (1 - Math.exp(-dt / 8)); }
    else s.Tf += (300 + T.Tf * q - s.Tf) * (1 - Math.exp(-dt / 8));
    s.v += (voidTarget(s, q, s.flow, s.sub) - s.v) * (1 - Math.exp(-dt / T.tauV));
    const dh = dt * Z / 3600; s.I += (gI * q - lI * s.I) * dh; s.X = Math.max(0, s.X + (gX * q + lI * s.I - lX * s.X - T.kb * q * s.X) * dh);
    s.maxN = Math.max(s.maxN, s.n); if (s.az) s.maxAz = Math.max(s.maxAz || 0, s.n);
    if (!s.jammed && s.n > 8 && T.id === 'rbmk') { s.jammed = true; s.jamP = s.p; }
    if (s.n > 10) { s.over10 = (s.over10 || 0) + dt; if (s.over10 > 0.3) { s.destroyed = true; s.destroyT = 0; } }
  }
  function azStart(s) { if (s.az) return; s.az = true; s.azN = s.n; s.azT = 0; s.psF = Math.max(0, 1 - ORM(s, s.p) / s.T.warn); s.azORM = ORM(s, s.p); }
  const xenonPct = s => s.X / XeqF(1, s.T.kb) * 100, xenonRods = s => s.kappa * s.X / (s.T.wRod * s.T.beta);
  const info = s => ({ mw: s.n * s.T.Pn, orm: ORM(s, s.p), 'rho$': rho(s) / s.T.beta, 'xe$': -s.kappa * s.X / s.T.beta, void: s.v, flow: s.flow, p: s.p });
  return { TYPES, Z, create, step, azStart, ORM, rho, info, pForOrm, xenonPct, xenonRods, tRef, XeqF };
})();



const LANGS = { en: 'English', tr: 'Türkçe', de: 'Deutsch', es: 'Español', pt: 'Português', fr: 'Français', ru: 'Русский' };
const T = {

function afterSettings() { flags.resetQ = false; const f = flags.setFrom; if (f === 'pause' && S && !ended) pauseMenu(); else if (f === 'reactor') reactorMenu(typeId); else mainMenu(); }

function finish(kind) {

/* ---------- Simülasyon ---------- */
function tick() {

    if (scenT > sdef.end && !S.az) finish('done');

  flags.minORM = Math.min(flags.minORM === undefined ? 99 : flags.minORM, orm); if (S.test) flags.minORMtest = Math.min(flags.minORMtest === undefined ? 99 : flags.minORMtest, orm); flags.maxV = Math.max(flags.maxV || 0, S.v);
  if (S.jammed && !flags.jam) { flags.jam = 1; say('m_jam'); }
  histT += DT; if (histT >= 1) { histT = 0; hist.push(mw); histD.push(sdef.demand || scen === 'test' ? (scen === 'test' ? 0 : S.D * T0.Pn) : 0); xh.push(M.xenonPct(S)); if (hist.length > 700) { hist.shift(); histD.shift(); xh.shift(); } }
