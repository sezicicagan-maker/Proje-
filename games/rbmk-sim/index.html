<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#060b14">
<meta name="description" content="Reactor Lab: an educational nuclear reactor simulator (RBMK, PWR, BWR, CANDU).">
<title>Reactor Lab</title>
<style>
:root{color-scheme:dark;--bg:#060b14;--ink:#e6f0ff;--muted:#8199b8;--dim:#5d7698;--acc:#5fd3ff;--ok:#46e0a0;--warn:#ffc83d;--bad:#ff5468;--line:#22395c;--p1:#16283f;--p2:#0e1a2e;--font:'Trebuchet MS','Segoe UI',system-ui,sans-serif;--fs:1;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% -10%,#16304f,#060b14 65%);color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{position:relative;height:100dvh;margin:0 auto;max-width:480px}
#stage{height:100%;display:flex;flex-direction:column}
#cw{position:relative;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;touch-action:none}
#app.wide{max-width:1500px}
#app.wide #stage{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px;padding:12px}
#app.wide #ctl{justify-content:center;gap:12px;padding:16px;background:linear-gradient(180deg,#12223a,#0a1424);border:1px solid var(--line);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.35)}
#app.wide .row{padding:8px 14px 6px}
#app.wide .rh{font-size:calc(12.5px*var(--fs))}
#app.wide .b,#app.wide #az,#app.wide #rst{height:50px}
#app.wide #kbHint{display:block}
/* üst çubuk */
#top{position:absolute;inset-inline-end:6px;top:4px;display:flex;gap:5px;z-index:3;align-items:center}
#top button{height:24px;min-width:28px;padding:0 7px;border-radius:8px;border:1px solid #2b4a74;background:rgba(10,20,36,.85);font:700 13px/1 var(--font);cursor:pointer;transition:transform .12s var(--ease),border-color .2s,background .2s}
#top button:active{transform:scale(.92)}
#bProt{font-size:9.5px!important;letter-spacing:.07em;font-weight:800!important}
#bProt.full{color:var(--ok);border-color:#2f6b4f}#bProt.assist{color:var(--acc);border-color:#2b5f86}#bProt.off{color:var(--bad);border-color:#8f2a38;background:rgba(80,10,20,.85)}
#bProt.arm,.chip.arm{animation:blink .45s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
/* bildirim ve ipucu */
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(88%,420px)}
.tst{padding:10px 16px;border-radius:13px;font:800 calc(14px*var(--fs))/1.3 var(--font);text-align:center;background:rgba(8,14,26,.93);border:2px solid var(--warn);color:#fff;box-shadow:0 10px 32px rgba(0,0,0,.6);animation:tIn .38s cubic-bezier(.2,1.5,.4,1) both;max-width:100%}
.tst.bad{border-color:var(--bad);box-shadow:0 0 0 1px rgba(255,84,104,.3),0 10px 40px rgba(255,40,70,.35)}.tst.ok{border-color:var(--ok)}.tst.info{border-color:var(--acc)}
.tst.out{animation:tOut .4s var(--ease) both}
@keyframes tIn{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}@keyframes tOut{to{opacity:0;transform:translateY(-10px) scale(.96)}}
#tip{position:absolute;left:10px;right:10px;bottom:10px;z-index:6;max-width:420px;margin:0 auto;padding:14px 16px 12px;border-radius:16px;background:linear-gradient(180deg,#18304f,#0f1d33);border:1px solid #31557f;box-shadow:0 16px 40px rgba(0,0,0,.6);animation:tipIn .32s var(--ease) both}
#tip[hidden]{display:none}#tip b{display:block;font-size:calc(15px*var(--fs));margin-bottom:4px}#tip p{margin:0 0 10px;color:#b7c9e2;font-size:calc(13px*var(--fs));line-height:1.45}#tip small{display:block;color:var(--dim);font-size:11px;margin:-6px 0 8px}
#tip button{float:inline-end;font:700 13px/1 var(--font);padding:9px 14px;border-radius:10px;border:1px solid #2b4a74;background:#13243d;cursor:pointer}
@keyframes tipIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
/* kontroller */
#ctl{flex:none;display:flex;flex-direction:column;gap:5px;padding:4px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(6,11,20,0),#0a1424 30%)}
.row{position:relative;background:linear-gradient(180deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:4px 12px 2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:opacity .25s,border-color .25s,box-shadow .25s}
.row.dis{opacity:.5}.row.hot{border-color:var(--warn);box-shadow:0 0 0 1px rgba(255,200,61,.25),inset 0 1px 0 rgba(255,255,255,.05)}
.rh{display:flex;align-items:center;gap:6px;min-height:19px;font-size:calc(11px*var(--fs));color:var(--muted)}
.rl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em;font-weight:700}
.rv{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.rs{position:relative;height:26px;--m:0}
.rs input{position:absolute;inset:0;width:100%;height:26px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.rs input:disabled{cursor:default}
.rs input::-webkit-slider-runnable-track{height:9px;border-radius:6px;background:linear-gradient(180deg,#09111e,#1b3050);box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
.rs input::-moz-range-track{height:9px;border-radius:6px;background:linear-gradient(180deg,#09111e,#1b3050)}
.rs input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:22px;margin-top:-7px;border-radius:7px;background:linear-gradient(180deg,#e2ebf7,#93a7c1 55%,#6c809b);border:1px solid #2a3a52;box-shadow:0 2px 6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .12s}
.rs input:active::-webkit-slider-thumb{transform:scale(1.08)}
.rs input::-moz-range-thumb{width:28px;height:20px;border-radius:7px;background:linear-gradient(180deg,#e2ebf7,#93a7c1);border:1px solid #2a3a52}
.mk{position:absolute;top:0;left:calc(var(--m) * (100% - 30px) + 15px);width:0;height:0;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--warn);filter:drop-shadow(0 0 4px rgba(255,200,61,.8));transition:left .18s linear;pointer-events:none}
[dir=rtl] .mk{left:auto;right:calc(var(--m) * (100% - 30px) + 15px);margin-left:0;margin-right:-5px}
.chip{font:800 9.5px/1 var(--font);letter-spacing:.06em;padding:3px 7px;border-radius:7px;border:1px solid #2f6b4f;background:rgba(70,224,160,.12);color:var(--ok);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip.off{border-color:#8f2a38;background:rgba(255,84,104,.18);color:var(--bad)}
.btns{display:flex;gap:6px;align-items:stretch}
.b{flex:1;min-width:0;font:800 calc(11.5px*var(--fs))/1.1 var(--font);padding:0 4px;height:44px;border:1px solid #2a436b;border-radius:11px;background:linear-gradient(180deg,#1d3558,#13233d);cursor:pointer;box-shadow:0 2px 0 #08101c;transition:transform .1s var(--ease),background .2s,color .2s;overflow:hidden;text-overflow:ellipsis}
.b:active{transform:scale(.95)}.b.on{background:linear-gradient(180deg,#7be0ff,#2aa8e0);color:#04202f;border-color:#7be0ff}.b:disabled{opacity:.4}.b[hidden]{display:none}
.azw{position:relative;flex:1.8;min-width:0}
#az,#rst{position:relative;width:100%;height:44px;font:800 calc(14px*var(--fs))/1 var(--font);letter-spacing:.1em;color:#fff;border:1px solid #7d1022;border-radius:11px;background:linear-gradient(180deg,#ff6b7c,#c91f37);box-shadow:0 3px 0 #6a0d1c;overflow:hidden;cursor:pointer;transition:transform .1s}
#az:active{transform:translateY(2px);box-shadow:0 1px 0 #6a0d1c}
#az i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.45)}
#az span,#rst span{position:relative}
#rst{background:linear-gradient(180deg,#58e3a9,#1f9b68);border-color:#11663f;box-shadow:0 3px 0 #0b4a2d;color:#04140c}
#rst[hidden],#az[hidden]{display:none}
#rst:disabled{filter:grayscale(.8);opacity:.55}
#cover{position:absolute;inset:0;border-radius:11px;background:repeating-linear-gradient(45deg,#f2c200 0 9px,#1a1a1a 9px 18px);border:1px solid #000;display:flex;align-items:center;justify-content:center;transform-origin:50% 0;transition:transform .32s var(--ease),opacity .32s;cursor:pointer;z-index:2}
#cover span{background:#1a1a1a;color:#f2c200;font:800 10.5px/1 var(--font);letter-spacing:.08em;padding:5px 8px;border-radius:6px;white-space:nowrap}
#cover.open{transform:perspective(320px) rotateX(100deg);opacity:0;pointer-events:none}
#cover[hidden]{display:none}
#kbHint{display:none;color:var(--dim);font-size:11px;text-align:center;line-height:1.4}
/* katman ekranları */
#ov{position:absolute;inset:0;z-index:10;overflow-y:auto;overflow-x:hidden;background:radial-gradient(ellipse at 50% 0%,#14304f,#060b14 72%);overscroll-behavior:contain}
#ov[hidden]{display:none}
.scr{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 0 30px;max-width:520px;margin:0 auto}
#ov.in .scr{animation:sIn .38s var(--ease) both}#ov.back .scr{animation:sBack .38s var(--ease) both}#ov.up .scr{animation:sUp .42s var(--ease) both}
[dir=rtl] #ov.in .scr{animation-name:sBack}[dir=rtl] #ov.back .scr{animation-name:sIn}
@keyframes sIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}@keyframes sBack{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}@keyframes sUp{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
.stag>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.hero{width:100%;flex:none;position:relative;overflow:hidden}
.hero svg{display:block;width:100%;height:auto}
.hero h1{position:absolute;left:0;right:0;bottom:14px;margin:0;font-size:clamp(24px,8vw,34px);letter-spacing:.1em;text-align:center;background:linear-gradient(180deg,#fff,#8fd8ff 60%,#4aa6d8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,.85));animation:glowT 4s ease-in-out infinite}
@keyframes glowT{50%{filter:drop-shadow(0 0 14px rgba(95,211,255,.55)) drop-shadow(0 2px 8px rgba(0,0,0,.85))}}
.hero small{position:absolute;left:0;right:0;bottom:0;text-align:center;color:#9fb6d6;font-size:10.5px;letter-spacing:.18em}
.hero .lgbtn{position:absolute;top:10px;inset-inline-end:10px;font:700 12px/1 var(--font);padding:7px 10px;border-radius:10px;border:1px solid rgba(143,216,255,.4);background:rgba(6,14,26,.55);cursor:pointer;backdrop-filter:blur(4px)}
@keyframes steam{0%{transform:translateY(0) scale(.7);opacity:0}20%{opacity:.55}100%{transform:translateY(-50px) scale(1.6);opacity:0}}
.sm{animation:steam 5s linear infinite;transform-box:fill-box;transform-origin:center}.sm:nth-child(2){animation-delay:1.6s}.sm:nth-child(3){animation-delay:3.2s}
@keyframes pulse{50%{opacity:.5}}.glow{animation:pulse 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}.st1{animation:tw 3s ease-in-out infinite}.st2{animation:tw 4.3s ease-in-out infinite 1s}
@keyframes win{50%{opacity:.35}}.wn{animation:win 6s ease-in-out infinite}
.h3{margin:4px 0 0;font-size:12px;letter-spacing:.2em;color:#7e96b6;font-weight:800;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;padding:0 14px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 8px 11px;border:1px solid #2a436b;border-radius:16px;background:linear-gradient(180deg,#182b4c,#0f1c33);font:inherit;cursor:pointer;box-shadow:0 3px 0 #08101c;transition:transform .18s var(--ease),box-shadow .18s,border-color .2s;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(95,211,255,.18),transparent 60%);opacity:0;transition:opacity .25s}
.tile:hover{transform:translateY(-3px);border-color:#3d6aa1;box-shadow:0 8px 20px rgba(0,0,0,.4)}.tile:hover::before{opacity:1}
.tile:active{transform:translateY(1px) scale(.98)}
.tile svg{width:66px;height:56px;transition:transform .3s var(--ease)}.tile:hover svg{transform:scale(1.08)}
.tile b{font-size:16px}.tile span{font-size:calc(10.5px*var(--fs));color:var(--muted);line-height:1.25;min-height:26px;text-align:center}.tile .st{color:#ffd23f;font-size:11px;letter-spacing:2px;min-height:12px}
.cards{display:flex;flex-direction:column;gap:9px;width:100%;padding:0 14px}
.card{display:flex;align-items:center;gap:12px;text-align:start;padding:12px 13px;border:1px solid #2a436b;border-radius:15px;background:linear-gradient(180deg,#18294a,#0f1c33);font:inherit;cursor:pointer;box-shadow:0 3px 0 #08101c;transition:transform .16s var(--ease),border-color .2s,box-shadow .2s}
.card:hover{border-color:#3d6aa1;transform:translateY(-2px)}.card:active{transform:translateY(1px) scale(.99)}
.card .ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#0b1626;border:1px solid #2a436b}
.card .tx{flex:1;min-width:0}.card b{display:block;font-size:calc(15px*var(--fs))}.card span{display:block;font-size:calc(12px*var(--fs));color:var(--muted);line-height:1.35;margin-top:2px}
.card .st{flex:none;text-align:end;color:#ffd23f;font-size:13px;letter-spacing:2px;white-space:nowrap}.card .st small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:0;margin-top:2px}
.card.hard .ic{border-color:#8f2a38;background:#1a0c14}
.stats{width:100%;padding:0 14px;display:flex;flex-direction:column;gap:7px}
.stat{display:flex;align-items:center;gap:8px;font-size:calc(11px*var(--fs))}.stat em{font-style:normal;flex:0 0 112px;text-align:start;color:var(--muted)}
.stat i{flex:1;height:7px;border-radius:5px;background:#0a1220;position:relative;overflow:hidden}.stat i s{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:5px;width:0;transition:width 1s var(--ease) .25s}
.stat b{flex:0 0 100px;text-align:end;font-size:10px;letter-spacing:.04em}
.mini{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 14px}
.ghost{font:700 calc(13px*var(--fs))/1 var(--font);padding:11px 15px;border-radius:12px;border:1px solid #2b4a74;background:rgba(10,20,36,.72);cursor:pointer;transition:transform .12s var(--ease),border-color .2s,background .2s}
.ghost:hover{border-color:#3d6aa1;background:rgba(20,36,60,.85)}.ghost:active{transform:scale(.96)}.ghost.sel{border-color:var(--acc);color:var(--acc)}
.btn{font:800 calc(16px*var(--fs))/1 var(--font);padding:14px 28px;border:0;border-radius:14px;background:linear-gradient(180deg,#7be0ff,#2aa8e0);color:#052033;box-shadow:0 4px 0 #14709b,0 10px 24px rgba(42,168,224,.25);cursor:pointer;min-width:210px;transition:transform .12s var(--ease),box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #14709b}
.btn.go{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{50%{box-shadow:0 4px 0 #14709b,0 0 30px rgba(95,211,255,.55)}}
.pad{padding:0 18px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;text-align:center}
.scr h2{margin:0;font-size:calc(23px*var(--fs))}
.scr p{margin:0;max-width:360px;color:var(--muted);font-size:calc(13.5px*var(--fs));line-height:1.5}
.scr ul{margin:0;padding-inline-start:18px;text-align:start;max-width:380px;color:#a8bcd6;font-size:calc(13px*var(--fs));line-height:1.5}
.scr li+li{margin-top:4px}
.top{width:100%;display:flex;align-items:center;gap:8px;padding:14px 14px 0}
.top h2{flex:1;text-align:center}
.iconb{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid #2b4a74;background:rgba(10,20,36,.7);font:700 18px/1 var(--font);cursor:pointer;transition:transform .12s}
.iconb:active{transform:scale(.92)}
small.d{display:block;color:#6a82a3;font-size:11px;max-width:340px;line-height:1.45;text-align:center;padding:0 16px}
/* brifing */
.brief{width:calc(100% - 28px);max-width:440px;background:linear-gradient(180deg,#152843,#0e1b30);border:1px solid #2a436b;border-radius:18px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.brief h4{margin:0 0 4px;font-size:11px;letter-spacing:.18em;color:#7e96b6}
.brief .obj{font-size:calc(15px*var(--fs));line-height:1.45;color:#fff;font-weight:700}
.brief .tip{display:flex;gap:10px;align-items:flex-start;font-size:calc(13px*var(--fs));line-height:1.45;color:#b7c9e2}
.brief .tip i{flex:none;font-style:normal;width:22px;height:22px;border-radius:7px;background:#0b1626;border:1px solid #2a436b;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--acc)}
.chk{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer;background:none;border:0;padding:4px 0}
/* ayarlar */
.sets{width:100%;max-width:470px;display:flex;flex-direction:column;gap:12px;padding:0 14px;text-align:start}
.sec{background:linear-gradient(180deg,#14253f,#0d1a2e);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sec h3{margin:0;display:flex;align-items:center;gap:10px;padding:12px 14px 6px;font-size:11.5px;letter-spacing:.18em;color:#8fb3da;font-weight:800}
.sec h3 i{font-style:normal;font-size:16px;letter-spacing:0}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid rgba(34,57,92,.6);min-height:52px}
.sec h3+.sr{border-top:0}
.sr .lb{flex:1;min-width:0}.sr .lb b{display:block;font-size:calc(13.5px*var(--fs));font-weight:700}.sr .lb small{display:block;color:var(--dim);font-size:calc(11.5px*var(--fs));margin-top:2px;line-height:1.35}
.sr input[type=range]{width:140px}
.sw{flex:none;position:relative;width:48px;height:28px;border-radius:15px;border:1px solid #2b4a74;background:#0b1626;cursor:pointer;transition:background .25s,border-color .25s;padding:0}
.sw i{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#7d93b2;transition:inset-inline-start .25s var(--ease),background .25s,transform .25s;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.sw[aria-checked=true]{background:#1d6f53;border-color:#46e0a0}.sw[aria-checked=true] i{inset-inline-start:23px;background:#e9fff5}
.sw:active i{transform:scale(.9)}
.seg{flex:none;display:flex;background:#0b1626;border:1px solid #2b4a74;border-radius:11px;padding:3px;gap:3px}
.seg button{font:700 calc(12px*var(--fs))/1 var(--font);padding:8px 10px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.seg button[aria-checked=true]{background:linear-gradient(180deg,#2c5a8c,#1d3d63);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.seg.wrap{flex-wrap:wrap;justify-content:flex-end}
.langrow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;text-align:start;cursor:pointer}
.langrow b{font-size:15px}.langrow span{color:var(--muted);font-size:12px}.langrow em{margin-inline-start:auto;font-style:normal;color:var(--acc);font-size:18px}
.srch{width:calc(100% - 28px);max-width:440px;display:flex;align-items:center;gap:8px;background:#0b1626;border:1px solid #2b4a74;border-radius:13px;padding:0 12px}
.srch input{flex:1;min-width:0;height:44px;background:transparent;border:0;color:var(--ink);font:600 15px/1 var(--font);outline:none}
.llist{width:calc(100% - 28px);max-width:440px;display:flex;flex-direction:column;gap:6px}
.lang{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:13px;border:1px solid #22395c;background:linear-gradient(180deg,#15263f,#0f1c31);cursor:pointer;text-align:start;transition:border-color .2s,transform .12s}

.kpis{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

_a1":"Reglerfehler: Leistung fällt schnell!","m_a2":"Schichtleiter: Leistung auf 200 MW erhöhen und Test SOFORT durchführen. Sperre notfalls überbrücken.","m_a2b":"Sperre: Stabziehen bei ORM 15 blockiert. Xenon braucht Zeit zum Zerfall (versuche ×4).","m_a3":"Auslauf gestartet: Pumpen werden langsamer.","m_a4":"Test beendet. Reaktor für geplante Abschaltung auslösen.","m_m1":"Reserve unter dem Warnwert.","m_m2":"Reserve unter dem Minimum: Abschaltung nötig.","m_jam":"Leistungsstoß: Kanäle verformt, Stäbe klemmen!","m_lock":"SPERRE: Stäbe können nicht weiter gezogen werden.","m_byp":"Sperre und Schutz ÜBERBRÜCKT. Du bist auf dich gestellt.","m_exc":"LEISTUNGSEXKURSION! Zeitlupe aktiv. Reaktor ABSCHALTEN!","m_tp":"AUTOMATISCHE ABSCHALTUNG: kurze Periode","m_th":"AUTOMATISCHE ABSCHALTUNG: hohe Leistung","m_tf":"AUTOMATISCHE ABSCHALTUNG: geringer Kühlmitteldurchsatz","m_poison":"Xenonvergiftung: Leistung nicht haltbar. Wiederanfahren ~40 Stunden gesperrt.","why1":"Positiver Dampfblasenkoeffizient: mehr Leistung → mehr Dampf → mehr Reaktivität.","why2":"Positiver Scram-Effekt: Graphitspitzen ERHÖHEN zuerst die Reaktivität in einem Kern mit niedrigem ORM.","why3":"Xenonvergiftung zwang die Stäbe heraus: ORM fiel auf {0}.","why4":"Stäbe brauchen ~18 s zum Einfahren und klemmten nach der Kanalverformung.","why5":"die Regeln verlangten Abschaltung unter 15","why6":"Sperre und Schutz wurden überbrückt.","why7":"Musterlösung: Xenon abgewartet und Test mit ORM ≥ 15 beendet.","why8":"Xenon baute sich schneller auf, als die Stäbe ausgleichen konnten.","why9":"Das Schutzsystem hat den Reaktor abgeschaltet.","g_orm":"ORM / Stabreserve","g_ormT":"Wie viele Steuerstäbe (äquivalent) eingefahren sind = Abschaltsicherheit. RBMK-Regel: ≥ 26 halten, absolutes Minimum 15. Andere Bauarten nutzen Einfahrgrenzen.","g_xe":"Xenon","g_xeT":"Xenon-135 ist ein Neutronengift aus Jod. Es sammelt sich nach einem Leistungsabfall und erreicht Stunden später den Höchstwert. Hier ist die Zeit ×300 gerafft. Zum Halten der Leistung musst du anderswo Reaktivität entfernen (Stäbe raus oder Bor verdünnen).","g_void":"Dampfblasen","g_voidT":"Siedendes Wasser bildet Dampfblasen. Beim RBMK bedeutet mehr Dampf MEHR Leistung (gefährliche Rückkopplung). Beim BWR WENIGER, daher steuert der Durchsatz die Leistung.","g_rod":"Stäbe & Abschaltung","g_rodT":"Steuerstäbe absorbieren Neutronen. RBMK-Stäbe fahren 0,4 m/s und brauchen ~18 s; ihre Graphitspitzen ERHÖHEN kurz die Reaktivität (positiver Scram-Effekt). Andere Reaktoren lassen Stäbe in 1-3 s fallen.","g_rho":"Reaktivität $","g_rhoT":"0 $ = konstante Leistung. +1 $ = prompt kritisch: Leistung explodiert in ein bis zwei Sekunden. Unter 0 sinkt die Leistung.","g_pwr":"DWR: Bor","g_pwrT":"Borsäure absorbiert Neutronen. Verdünnen erhöht langsam die Reaktivität (gegen Xenon). Heißeres Kühlmittel senkt die Leistung von selbst, die Anlage folgt der Netzlast.","g_bwr":"SWR: Durchsatz = Leistung","g_bwrT":"Mehr Umwälzung spült Dampf aus dem Kern und erhöht die Leistung. Weniger senkt sie. Die Stäbe legen das Grundniveau fest.","g_candu":"CANDU: Xenonvergiftung","g_canduT":"Natururan hat wenig Reaktivitätsüberschuss. Bleibt die Leistung einige Stunden niedrig, wächst Xenon über die Kraft der Adjuster hinaus und der Reaktor ist ~40 Stunden gesperrt.","st_lang":"SPRACHE","st_sound":"TON","st_vol":"LAUTSTÄRKE","st_slow":"ZEITLUPE BEI EXKURSION","st_flash":"BILDSCHIRMBLITZE","st_units":"LEISTUNGSEINHEIT","u_mw":"MW","u_pct":"% der Nennleistung","st_reset":"FORTSCHRITT LÖSCHEN","st_resetq":"Alle Sterne löschen?","yes":"Ja","no":"Nein","on":"AN","off":"AUS","st_about":"INFO","ver":"Version"},"es":{"title":"LABORATORIO DE REACTORES","sub":"SIMULADOR DE REACTORES NUCLEARES","edu":"Simulador educativo con física simplificada. No apto para ingeniería. No aparecen personas reales.","read":"Basado en análisis públicos (p. ej., IAEA INSAG-7). Las cifras son aproximaciones simplificadas.","pick":"ELIGE UN REACTOR","back":"Atrás","how":"CÓMO FUNCION a é preciso tirar reatividade de outro lugar (retirar barras ou diluir boro).","g_void":"Vazios de vapor","g_voidT":"A água em ebulição forma bolhas de vapor. No RBMK mais vapor significa MAIS potência (realimentação perigosa). No BWR, MENOS, por isso a vazão controla a potência.","g_rod":"Barras e desarme","g_rodT":"As barras de controle absorvem nêutrons. As do RBMK andam a 0,4 m/s e levam ~18 s; as pontas de grafite ADICIONAM reatividade por instantes (efeito scram positivo). Outros reatores soltam as barras em 1-3 s.","g_rho":"Reatividade $","g_rhoT":"0 $ = potência estável. +1 $ = crítico imediato: a potência dispara em um ou dois segundos. Abaixo de 0 a potência cai.","g_pwr":"PWR: boro","g_pwrT":"O ácido bórico absorve nêutrons. Diluir adiciona reatividade devagar (contra o xenônio). Refrigerante mais quente reduz a potência sozinho, e a usina acompanha a carga da rede.","g_bwr":"BWR: vazão = potência","g_bwrT":"Mais vazão de recirculação varre o vapor do núcleo e aumenta a potência. Menos vazão reduz. As barras definem o nível base.","g_candu":"CANDU: envenenamento","g_canduT":"O urânio natural tem pouca reatividade sobrando. Se a potência ficar baixa por algumas horas, o xenônio supera o que os ajustadores conseguem compensar e o reator fica travado por ~40 horas.","st_lang":"IDIOMA","st_sound":"SOM","st_vol":"VOLUME","st_slow":"CÂMERA LENTA NA EXCURSÃO","st_flash":"CLARÕES NA TELA","st_units":"UNIDADE DE POTÊNCIA","u_mw":"MW","u_pct":"% da nominal","st_reset":"APAGAR PROGRESSO","st_resetq":"Apagar todas as estrelas?","yes":"Sim","no":"Não","on":"LIGADO","off":"DESLIGADO","st_about":"SOBRE","ver":"Versão"},"fr":{"title":"LABO RÉACTEURS","sub":"SIMULATEUR DE RÉACTEUR NUCLÉAIRE","edu":"Simulateur éducatif à la physique simplifiée. Inutilisable pour l'ingénierie. Aucune personne réelle n'est représentée.","read":"D'après des analyses publiques (p. ex. AIEA INSAG-7). Les chiffres sont des approximations simplifiées.","pick":"CHOISIR UN RÉACTEUR","back":"Retour"
