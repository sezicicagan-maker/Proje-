<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#060b14">
<title>RBMK Reactor Simulator</title>
<style>
:root{color-scheme:dark;--bg:#060b14;--ink:#e6f0ff;--muted:#8199b8;--acc:#5fd3ff;--ok:#46e0a0;--warn:#ffc83d;--bad:#ff5468;--panel:#122035}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 0%,#12233b,#060b14 70%);color:var(--ink);font-family:'Trebuchet MS',system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column}
#cw{position:relative;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block}
#top{position:absolute;right:8px;top:6px;display:flex;gap:6px;z-index:2}
#top button{width:30px;height:26px;border-radius:8px;border:1px solid #2b4a74;background:rgba(10,20,36,.8);color:var(--ink);font:700 13px/1 inherit;cursor:pointer}
#ctl{flex:none;display:flex;flex-direction:column;gap:5px;padding:4px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(6,11,20,0),#0a1424 28%)}
.row{background:linear-gradient(180deg,#15263f,#0f1c31);border:1px solid #22395c;border-radius:12px;padding:3px 12px 4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.row label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);height:18px}
.row label b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip{font:700 10px/1 inherit;padding:3px 7px;border-radius:7px;border:1px solid #2f6b4f;background:rgba(70,224,160,.12);color:var(--ok);cursor:pointer}
.chip.off{border-color:#8f2a38;background:rgba(255,84,104,.18);color:var(--bad)}
.chip.arm{animation:blink .5s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
input[type=range]{width:100%;height:24px;background:transparent;-webkit-appearance:none;appearance:none;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:9px;border-radius:6px;background:linear-gradient(180deg,#0a1220,#1b3050);box-shadow:inset 0 1px 3px #000a}
input[type=range]::-moz-range-track{height:9px;border-radius:6px;background:linear-gradient(180deg,#0a1220,#1b3050)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:24px;margin-top:-8px;border-radius:7px;background:linear-gradient(180deg,#d9e4f3,#8fa3bd 55%,#6b7f9a);border:1px solid #2a3a52;box-shadow:0 2px 6px #000a,inset 0 1px 0 #fff8}
input[type=range]::-moz-range-thumb{width:28px;height:22px;border-radius:7px;background:linear-gradient(180deg,#d9e4f3,#8fa3bd);border:1px solid #2a3a52}
input[type=range]:disabled{opacity:.4}
.btns{display:flex;gap:6px;align-items:stretch}
.b{flex:1;font:700 12px/1 inherit;padding:0 4px;height:42px;border:1px solid #2a436b;border-radius:11px;background:linear-gradient(180deg,#1d3558,#14243f);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 #08101c}
.b.on{background:linear-gradient(180deg,#7be0ff,#2aa8e0);color:#04202f;border-color:#7be0ff}.b:disabled{opacity:.4}.b[hidden]{display:none}
.azw{position:relative;flex:2}
#az{position:relative;width:100%;height:42px;font:800 16px/1 inherit;letter-spacing:.12em;color:#fff;border:1px solid #7d1022;border-radius:11px;background:linear-gradient(180deg,#ff6b7c,#c91f37);box-shadow:0 3px 0 #6a0d1c;overflow:hidden;cursor:pointer}
#az i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.4)}
#az span{position:relative}
#cover{position:absolute;inset:0;border-radius:11px;background:repeating-linear-gradient(45deg,#f2c200 0 9px,#1a1a1a 9px 18px);border:1px solid #000;display:flex;align-items:center;justify-content:center;transform-origin:50% 0;transition:transform .28s,opacity .28s;cursor:pointer;z-index:2}
#cover span{background:#1a1a1a;color:#f2c200;font:800 11px/1 inherit;letter-spacing:.1em;padding:5px 8px;border-radius:6px}
#cover.open{transform:perspective(300px) rotateX(95deg);opacity:0;pointer-events:none}
#ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:0 0 24px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#14304f,#060b14 75%);overflow-y:auto}
#ov[hidden]{display:none}
.hero{width:100%;flex:none;position:relative}
.hero svg{display:block;width:100%;height:auto}
.hero h1{position:absolute;left:0;right:0;bottom:6px;margin:0;font-size:31px;letter-spacing:.12em;background:linear-gradient(180deg,#fff,#8fd8ff 60%,#4aa6d8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,.8))}
.hero small{position:absolute;left:0;right:0;bottom:-2px;color:#9fb6d6;font-size:11px;letter-spacing:.2em}
@keyframes steam{0%{transform:translateY(0) scale(.7);opacity:.0}20%{opacity:.5}100%{transform:translateY(-46px) scale(1.5);opacity:0}}
.sm{animation:steam 5s linear infinite}.sm:nth-child(2){animation-delay:1.6s}.sm:nth-child(3){animation-delay:3.2s}
@keyframes pulse{50%{opacity:.55}}.glow{animation:pulse 2.4s ease-in-out infinite}
.cards{display:flex;flex-direction:column;gap:9px;width:100%;padding:0 14px}
.card{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 13px;border:1px solid #2a436b;border-radius:14px;background:linear-gradient(180deg,#17294a,#0f1c33);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 3px 0 #08101c}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 #08101c}
.card .ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;background:#0b1626;border:1px solid #2a436b}
.card b{display:block;font-size:15px}.card span{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
.card .st{margin-left:auto;color:#ffd23f;font-size:13px;letter-spacing:2px;white-space:nowrap}
.card.hard .ic{border-color:#8f2a38}.diff{font-size:10px!important;letter-spacing:.12em;color:#ffb36b!important}
.mini{display:flex;gap:8px;justify-content:center}
.ghost{font:600 13px/1 inherit;padding:11px 15px;border-radius:11px;border:1px solid #2b4a74;background:rgba(10,20,36,.7);color:var(--ink);cursor:pointer}
.btn{font:800 16px/1 inherit;padding:13px 26px;border:0;border-radius:13px;background:linear-gradient(180deg,#7be0ff,#2aa8e0);color:#052033;box-shadow:0 4px 0 #14709b;cursor:pointer;min-width:200px}
.pad{padding:0 18px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
#ov h2{margin:0;font-size:24px}
#ov p{margin:0;max-width:330px;color:var(--muted);font-size:13.5px;line-height:1.45}
#ov ul{margin:0;padding-left:18px;text-align:left;max-width:330px;color:#a8bcd6;font-size:13px;line-height:1.45}
#ov li+li{margin-top:4px}
.stars{font-size:32px;letter-spacing:6px;color:#ffd23f}.stars i{font-style:normal;opacity:.25}.stars i.on{opacity:1}
.help{width:100%;max-width:360px;display:flex;flex-direction:column;gap:9px;padding:0 14px;text-align:left}
.hc{background:linear-gradient(180deg,#14253f,#0e1b30);border:1px solid #22395c;border-radius:12px;padding:10px 12px}
.hc b{display:block;color:#fff;font-size:14px;margin-bottom:3px}.hc span{color:#a8bcd6;font-size:12.5px;line-height:1.4}
.hc em{font-style:normal;color:var(--acc)}.hc u{text-decoration:none;color:var(--warn)}
small.d{color:#6a82a3;font-size:11px;max-width:320px;line-height:1.4}
</style>
</head>
<body>
<div id="app">
<div id="cw"><canvas id="c"></canvas><div id="top"><button id="bhelp" aria-label="help">?</button><button id="bmenu" aria-label="menu">☰</button></div></div>
<div id="ctl">
 <div class="row"><label><span id="lr"></span><span><button class="chip" id="bypass"></button> <b id="vr"></b></span></label><input id="rods" type="range" min="0" max="700" value="350" aria-label="rods"></div>
 <div class="row"><label><span id="lf"></span><b id="vf"></b></label><input id="flow" type="range" min="30" max="110" value="100" aria-label="flow"></div>
 <div class="btns"><button class="b" id="auto"></button><button class="b" id="test"></button><button class="b" id="spd">×1</button><button class="b" id="pause">II</button><div class="azw"><button id="az"><i></i><span>AZ-5</span></button><div id="cover"><span>AZ-5 ▲</span></div></div></div>
</div>
<div id="ov"></div>
</div>
<script>
(() => {
'use strict';

/* Basitleştirilmiş, EĞİTİM amaçlı RBMK tipi reaktör modeli. Sayılar INSAG-7 düzeyindeki bilgilerden hafızayla alınmış yaklaşık değerlerdir;
   mühendislik hesabı için KULLANILMAZ. Yapı gerçek fiziği izler: nokta kinetik (tek gecikmiş grup), Xe-135/I-135 zinciri, buhar boşluğu geri beslemesi,
   Doppler, çubuk hızı 0,4 m/s, ORM ve grafit uçlu çubukların pozitif scram etkisi, güç sıçramasında kanal deformasyonu (çubuk sıkışması). */
const M = (() => {
  const Pn = 3200, beta = 0.0048, Lam = 1e-3, lamD = 0.08;
  const NMAX = 30, wRod = 0.45, STROKE = 7, ROD_V = 0.4, FLOW_V = 0.012, Z = 300, ORM_SAFE = 26, ORM_MIN = 15;
  const gI = 0.061, gX = 0.003, lI = 0.1055, lX = 0.0758, kb = 0.38;
  const aD = 1.4e-5, vmax = 0.25, x0 = 0.3, U0 = 0.12, av0 = 5.0, cV = 2.0, ps0 = 4.4;
  const Xeq = n => (gI + gX) * n / (lX + kb * n), kappa = 6.5 * beta / Xeq(1);
  const S3 = x => x * x * (3 - 2 * x), ORM = p => NMAX * S3(Math.max(0, Math.min(1, p / STROKE)));
  const voidTarget = (q, f, sub) => { const x = Math.max(0, q / Math.max(0.05, f) - U0 * (sub === undefined ? 1 : sub)); return vmax * x / (x + x0); };
  const alphaV = orm => av0 * (1 + cV * Math.max(0, 1 - orm / ORM_SAFE)) * beta;
  function rho(s) {
    const orm = ORM(s.p), ps = s.az ? ps0 * beta * s.psF * (s.azT < 3.2 ? Math.sin(Math.PI * s.azT / 3.2) ** 2 : 0) : 0;
    return s.bias - wRod * beta * orm - kappa * s.X - aD * (s.Tf - 300) + alphaV(orm) * s.v + ps;
  }
  function create(o) {
    const s = { t: 0, n: o.n, C: beta * o.n / (Lam * lamD), p: o.p, pTarget: o.p, flow: o.flow, flowTarget: o.flow, v: 0, Tf: 300, X: 0, I: 0, bias: 0, az: false, azT: 0, psF: 0, jammed: false, destroyed: false, destroyT: 0, auto: false, interlock: true, bypass: false, nSet: o.n, hist: [], maxN: o.n, test: false, testT: 0, flowBase: o.flow, peakORMlow: 99 };
    const nh = o.nHist === undefined ? o.n : o.nHist;
    s.I = gI * nh / lI; s.X = Xeq(nh);
    s.Tf = 300 + 550 * o.n; s.sub = o.sub === undefined ? 1 : o.sub; s.v = voidTarget(o.n, o.flow, s.sub);
    s.bias = 0; s.bias = -rho(s);
    return s;
  }
  function stepRods(s, dt, cmd) {
    if (s.jammed) return;
    let tgt = s.az ? STROKE : s.pTarget;
    if (!s.az && s.auto) {
      const e = (s.nSet - s.n) / Math.max(0.03, s.nSet); let d = -Math.max(-1, Math.min(1, 2.2 * e)) * 0.8;
      if (d < 0) { if (s.rate > 1 / 30) d = 0; }            // çekme: periyot 30 sn'nin altındaysa durdur (gerçek regülatörlerde periyot sınırı)
      if (s.rate > 1 / 15) d = Math.max(d, 0.3);             // çok kısa periyot: içeri sür
      tgt = Math.max(0, Math.min(STROKE, s.p + d)); s.pTarget = tgt;
    }
    if (s.interlock) tgt = Math.max(tgt, Math.min(s.p, 3.5));   // ORM 15'in altına çekmeyi engeller (p=3.5 m ↔ ORM 15)
    const d = tgt - s.p, m = ROD_V * dt; s.p += Math.abs(d) <= m ? d : Math.sign(d) * m;
  }
  function step(s, dt) {
    if (s.destroyed) { s.destroyT += dt; return; }
    s.t += dt;
    if (s.az) s.azT += dt;
    if (s.test) { s.testT += dt; s.flowTarget = s.flowBase * (0.55 + 0.45 * Math.exp(-s.testT / 25)); }
    stepRods(s, dt);
    const df = s.flowTarget - s.flow, mf = FLOW_V * dt * (s.test ? 6 : 1); s.flow += Math.abs(df) <= mf ? df : Math.sign(df) * mf;
    const nsub = Math.max(1, Math.ceil(dt / 0.002)), h = dt / nsub;
    for (let i = 0; i < nsub; i++) {
      const r = rho(s), a = (r - beta) / Lam;
      const dn = (a * s.n + lamD * s.C) * h, dC = (beta / Lam * s.n - lamD * s.C) * h;
      s.n = Math.max(1e-7, s.n + dn); s.C = Math.max(0, s.C + dC);
      if (s.n > 4e3) { s.n = 4e3; }
    }
    { const r = (Math.log(s.n) - Math.log(s.nPrev || s.n)) / dt; s.rate = 0.9 * (s.rate || 0) + 0.1 * r; s.nPrev = s.n; }
    const q = s.n;
    s.Tf += (300 + 550 * q - s.Tf) * (1 - Math.exp(-dt / 8));
    s.v += (voidTarget(q, s.flow, s.sub) - s.v) * (1 - Math.exp(-dt / 1.5));
    const dh = dt * Z / 3600;
    s.I += (gI * q - lI * s.I) * dh; s.X = Math.max(0, s.X + (gX * q + lI * s.I - lX * s.X - kb * q * s.X) * dh);
    s.maxN = Math.max(s.maxN, s.n);
    if (s.az) s.maxAz = Math.max(s.maxAz || 0, s.n);
    if (!s.jammed && s.n > 8) { s.jammed = true; s.jamP = s.p; }
    if (s.n > 10) { s.over10 = (s.over10 || 0) + dt; if (s.over10 > 0.3) { s.destroyed = true; s.destroyT = 0; } }
  }
  function azStart(s) { if (s.az) return; s.az = true; s.azN = s.n; s.azT = 0; s.psF = Math.max(0, 1 - ORM(s.p) / ORM_SAFE); s.azORM = ORM(s.p); }
  const xenonPct = s => s.X / Xeq(1) * 100, xenonRods = s => kappa * s.X / (wRod * beta);
  const info = s => ({ mw: s.n * Pn, orm: ORM(s.p), rho$: rho(s) / beta, xe$: -kappa * s.X / beta, void: s.v, flow: s.flow, p: s.p, period: 0 });
  return { xenonPct, xenonRods, ps0, Pn, beta, ORM_SAFE, ORM_MIN, STROKE, ROD_V, Z, create, step, azStart, ORM, rho, info, Xeq, kappa, voidTarget, alphaV };
})();

function wrap(s, x, y, maxW, size) { ctx.font = `700 ${size}px 'Trebuchet MS',system-ui,sans-serif`; const words = s.split(' '); let line = '', lines = []; for (const w of words) { const tt = line ? line + ' ' + w : w; if (ctx.measureText(tt).width > maxW && line) { lines.push(line); line = w; } else line = tt; } lines.push(line); lines.slice(0, 3).forEach((l, i, a) => txt(l, x, y + (i - (a.length - 1) / 2) * (size + 2), size, msgT > 0 && /AUTO|OTOMATİK|EXC|SIÇ|BYPASS|DEVRE/.test(msg) ? '#ff9aa6' : '#e6f0ff', 'center', 700)); }
const goalText = () => scen === 1 ? t('goal1') : scen === 2 ? t('goal2') : t('goal3');

/* ---------- Boyutlandırma ---------- */
let sc = 1, dpr = 1;
function resize() { const r = cw.getBoundingClientRect(); sc = Math.max(0.3, Math.min(r.width / W, r.height / H)); dpr = Math.min(2.5, window.devicePixelRatio || 1); cv.style.width = W * sc + 'px'; cv.style.height = H * sc + 'px'; cv.width = Math.round(W * sc * dpr); cv.height = Math.round(H * sc * dpr); }
window.addEventListener('resize', resize);

/* ---------- Senaryo ---------- */
function say(k, raw) { msg = raw || t(k); msgT = 7; }
function initScenario(n) {
  scen = n; ended = false; flags = {}; hist = []; xh = []; histT = 0; scenT = 0; score = { ok: 0, tot: 0 }; rate = 0; ts = 1; slowT = 0; lastN = 0;
  if (n === 1) { S = M.create({ n: 0.5, p: 4.3, flow: 1, nHist: 0.5 }); setpt = 0.5; S.auto = true; S.nSet = 0.5; }
  else if (n === 2) { S = M.create({ n: 0.22, p: 5.6, flow: 1, nHist: 1.0, sub: 0.15 }); setpt = 0.22; S.auto = true; S.nSet = 0.22; }
  else { S = M.create({ n: 1, p: 3.5, flow: 1, nHist: 1 }); setpt = 1; }
  S.interlock = true; S.bypass = false; S._dxe = 0; S._xe0 = M.xenonPct(S);

function setBypass(on) { S.bypass = on; S.interlock = !on; flags.bypassUsed = flags.bypassUsed || on; say(on ? 'm_byp' : 'm_lock'); syncUI(); }
function syncUI(force) {

  el('lr').textContent = auto ? t('set') : t('rods'); const sl = el('rods');
  if (auto) { sl.min = 30; sl.max = 1600; sl.step = 10; if (force || !sl.matches(':active')) sl.value = Math.round(S.nSet * PN); el('vr').textContent = Math.round(S.nSet * PN) + ' MW'; sl.disabled = S.az; }
  else { sl.min = 0; sl.max = 700; sl.step = 1; if (force || !sl.matches(':active')) sl.value = Math.round(S.pTarget * 100); el('vr').textContent = S.p.toFixed(2) + ' → ' + S.pTarget.toFixed(1) + ' m'; sl.disabled = locked; }
  el('lf').textContent = t('flow'); flowEl.disabled = S.test || S.az; if (!flowEl.matches(':active')) flowEl.value = Math.round(S.flowTarget * 100); el('vf').textContent = Math.round(S.flow * 100) + '%';
  const b = el('bypass'); b.textContent = bypArm ? t('conf') : S.bypass ? t('byp') : t('lock'); b.classList.toggle('off', S.bypass); b.classList.toggle('arm', !!bypArm);
  el('auto').textContent = auto ? t('auto') : t('man'); el('auto').classList.toggle('on', auto); el('auto').disabled = S.az || locked;
  el('test').hidden = scen !== 2; el('test').textContent = t('test'); el('test').disabled = S.test || S.az || scenT < 100 || S.n < 0.04;
}
rodsEl.addEventListener('input', () => { if (!S || S.az) return; if (S.auto) { S.nSet = rodsEl.value / PN; setpt = S.nSet; } else { let v = rodsEl.value / 100; if (S.interlock && v < Math.min(S.p, 3.5) - 0.01) { v = Math.min(S.p, 3.5); rodsEl.value = Math.round(v * 100); if (!flags.lockMsg || scenT - flags.lockMsg > 4) { flags.lockMsg = scenT; say('m_lock'); tone(300, 0.15, 'square', 0.05); } } S.pTarget = v; } syncUI(); });
flowEl.addEventListener('input', () => { if (S && !S.test && !S.az) { S.flowTarget = flowEl.value / 100; syncUI(); } });
el('auto').addEventListener('click', () => { initAudio(); S.auto = !S.auto; if (S.auto) { S.nSet = clamp(S.n, 0.01, 0.5); setpt = S.nSet; } syncUI(true); });
el('test').addEventListener('click', () => { if (scen === 2 && !S.test) { S.test = true; S.testT = 0; S.flowBase = S.flow; flags.ormAtTest = M.ORM(S.p); say('m_a3'); syncUI(); } });
el('spd').addEventListener('click', () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; el('spd').textContent = '×' + speed; });

const azb = el('az'), cover = el('cover'); let coverT = 0;

const azDown = e => { e.preventDefault(); if (!playing || S.az || !cover.classList.contains('open')) return; azHold = performance.now(); };
const azUp = () => { azHold = 0; azb.firstChild.style.width = '0'; };

/* ---------- Menü ekranları ---------- */

function menu() {

}
function pauseMenu() { playing = false; ov.hidden = false; ov.innerHTML = `<div class="pad" style="margin-top:60px"><h2>II</h2><button class="btn" data-a="resume">${t('resume')}</button><button class="ghost" data-a="help">? ${t('how')}</button><button class="ghost" data-a="mute">${save.muted ? '🔇' : '🔊'} ${t('snd')}</button><button class="ghost" data-a="menu">${t('menu')}</button></div>`; }
function helpScreen(fromGame) {
  ov.hidden = false; flags.helpFrom = fromGame ? 'game' : 'menu';
  const c = (a, b) => `<div class="hc"><b>${t(a)}</b><span>${t(b)}</span></div>`;
  ov.innerHTML = `<div class="pad" style="margin-top:18px"><h2>${t('how')}</h2></div><div class="help">${c('g_orm', 'g_ormT')}${c('g_xe', 'g_xeT')}${c('g_void', 'g_voidT')}${c('g_rod', 'g_rodT')}${c('g_rho', 'g_rhoT')}</div><button class="btn" data-a="closehelp">${t('close')}</button>`;
}
ov.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; initAudio(); const d = b.dataset;
  if (d.s) { initScenario(+d.s); ov.hidden = true; playing = true; tone(660, 0.1, 'triangle', 0.05); }
  else if (d.a === 'menu') menu(); else if (d.a === 'again') { initScenario(scen); ov.hidden = true; playing = true; }
  else if (d.a === 'resume') { ov.hidden = true; playing = true; }
  else if (d.a === 'help') helpScreen(false);
  else if (d.a === 'closehelp') { if (flags.helpFrom === 'game' && S && !ended) { ov.hidden = true; playing = true; } else if (S && !ended && ov.dataset.k === 'x') menu(); else menu(); }
  else if (d.a === 'mute') { save.muted = !save.muted; persist(); const h = ov.querySelector('.card') ? menu : pauseMenu; h(); }
});
function finish(kind) {

  const orm = S.azORM !== undefined ? S.azORM : M.ORM(S.p); let stars = 0, title = t('done'), body = '';
  const star = () => `<div class="stars">${[0, 1, 2].map(i => `<i class="${i < stars ? 'on' : ''}">★</i>`).join('')}</div>`;
  if (scen === 1) { const p = Math.round(score.ok / Math.max(1, score.tot) * 100); stars = p >= 85 ? 3 : p >= 65 ? 2 : p >= 40 ? 1 : 0; body = `${star()}<p>${t('score')}: <b>${p}%</b></p>`; }

    if (dead) { title = t('destroyed'); stars = 0; }
    else if (S.az) { title = t('safe'); stars = flags.bypassUsed || orm < 15 ? 1 : (S.test && S.testT >= 55 && (flags.minORMtest === undefined || flags.minORMtest >= 15)) ? 3 : 2; }
    li.push(`ORM: <b>${orm.toFixed(1)}</b> · ${orm < 15 ? t('why5') : t('okOrm')}`);
    if (S.az) li.push(`${t('peak')}: <b>${pk.toLocaleString('en-US')} MW</b>`);
    if (flags.bypassUsed) li.push(t('why6'));
    if (spike) li.push(t('why2') + ` (+${(S.psF * M.ps0).toFixed(1)} β)`);
    if ((flags.maxV || 0) > 0.05 && (spike || dead)) li.push(t('why1'));
    if (mo < 15) li.push(t('why3', mo.toFixed(0)));
    if (S.jammed) li.push(t('why4'));
    if (stars === 3) li.push(t('why7'));

  }
  if (scen > 0 && scen < 3) { if (stars > (save.stars[scen] || 0)) { save.stars[scen] = stars; persist(); } }
  ov.hidden = false; ov.innerHTML = `<div class="pad" style="margin-top:34px"><h2>${title}</h2>${body}<button class="btn" data-a="again">${t('again')}</button><button class="ghost" data-a="menu">${t('menu')}</button><small class="d">${t('read')}</small></div>`;
  tone(stars ? 784 : 196, 0.4, 'triangle', 0.07);
}

/* ---------- Simülasyon ---------- */
function tick() {
  M.step(S, DT); scenT += DT;

  ts = slowT > 0 ? 0.22 : 1;

    let why = null; if (isFinite(per) && per < 10 && S.n > 0.02) why = 'm_tp'; else if (S.n > 1.2) why = 'm_th'; else if (S.flow < 0.45 && S.n > 0.2) why = 'm_tf';

    for (const [tt, k, v] of [[30, 'm_t2', 0.35], [75, 'm_t2', 0.5], [110, 'm_t2', 0.42]]) if (scenT >= tt && !flags['m' + tt]) { flags['m' + tt] = 1; say(k); setpt = v; S.nSet = v; S.auto = true; syncUI(true); }

  }
  if (scen === 2) {
    for (const [tt, k] of [[60, 'm_a1'], [100, 'm_a2'], [140, 'm_a2b']]) if (scenT >= tt && !flags['m' + tt]) { flags['m' + tt] = 1; say(k); }
    if (scenT >= 60 && !flags.dip) { flags.dip = 1; S.auto = false; S.pTarget = Math.min(7, S.p + 2.8); syncUI(true); }
    if (S.test && S.testT > 55 && !flags.m4) { flags.m4 = 1; say('m_a4'); }

  histT += DT; if (histT >= 1) { histT = 0; hist.push(mw); xh.push(M.xenonPct(S)); if (hist.length > 700) { hist.shift(); xh.shift(); } }
  if (S.destroyed && S.destroyT > 2.5) finish('destroyed'); else if (S.az && !S.destroyed && S.azT > 30 && S.n < 0.05) finish('done');
}
let last = 0, acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000 || 0); last = now;
  if (playing && S) {

    if (msgT > 0) msgT -= dt; if (Math.floor(now / 160) % 2 === 0) syncUI();
    const orm = M.ORM(S.p), per = S._per; if (!S.destroyed && now - lastBeep > (S.az ? 900 : 700)) { if (S.az) { lastBeep = now; tone(440, 0.12, 'square', 0.03); } else if (orm < 15) { lastBeep = now; tone(880, 0.1, 'square', 0.03); } else if (isFinite(per) && per < 20 && S.n > 0.02) { lastBeep = now; tone(1100, 0.08, 'square', 0.04); } }
  }

}
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pauseMenu(); });
resize(); menu(); requestAnimationFrame(frame);
if (window.__RB_TEST__) window.__rb = { M, get S() { return S; }, initScenario, tick, finish, fireAz, setBypass, get scenT() { return scenT; }, get playing() { return playing; }, set playing(v) { playing = v; }, get ts() { return ts; } };
})();
