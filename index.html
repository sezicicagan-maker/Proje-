<body>
<title>Evolute Prototip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: tek ekran oyun; 360x720 sanal sahne pencereye sığdırılır, kenarlarda 16px+ boşluk kalır.
   Tek görünüm (koyu) bilerek seçildi: oyun kendi dünyasını çiziyor. */
:root{
  --bg:#0b1626; --panel:#142640; --panel2:#1b3253; --ink:#e9f2ff; --muted:#92a9c8;
  --water:#3aa9ff; --poison:#7bd34a; --volt:#ffd23f; --enemy:#ff5d6c; --accent:#ff8a3d; --accent-ink:#241206;
  --font:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  box-sizing:border-box; margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px; overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none;
}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#stage{position:relative;--u:1px;border-radius:calc(var(--u)*14);overflow:hidden;background:#0c1a2e;box-shadow:0 0 0 1px #1d3556}
#c{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--u)*16);background:rgba(7,13,24,.88);text-align:center;overflow-y:auto;touch-action:pan-y}
.in{margin:auto;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*10);width:100%}
.ov h1{margin:0;font-size:calc(var(--u)*44);letter-spacing:.06em;line-height:1;text-wrap:balance}
.ov h2{margin:0;font-size:calc(var(--u)*30);line-height:1.05;text-wrap:balance}
.ov p{margin:0;font-size:calc(var(--u)*14);color:var(--muted);line-height:1.35;max-width:calc(var(--u)*290)}
.tag{font-size:calc(var(--u)*12);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.btn{font:700 calc(var(--u)*18)/1 var(--font);padding:calc(var(--u)*14) calc(var(--u)*34);background:var(--accent);color:var(--accent-ink);
  border:0;border-radius:calc(var(--u)*14);cursor:pointer;min-width:calc(var(--u)*170)}
.btn:focus-visible,.mini:focus-visible,.card:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.how{display:flex;gap:calc(var(--u)*8);align-items:center;justify-content:center;font-size:calc(var(--u)*13);color:var(--ink)}
.dot{display:inline-block;width:calc(var(--u)*12);height:calc(var(--u)*12);border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:calc(var(--u)*6) calc(var(--u)*18);font-size:calc(var(--u)*14);color:var(--muted)}
.stats b{color:var(--ink);font-weight:700}
.lab{width:100%;max-width:calc(var(--u)*310);display:flex;flex-direction:column;gap:calc(var(--u)*6)}
.bank{font-size:calc(var(--u)*14);color:var(--muted)} .bank b{color:var(--volt);font-size:calc(var(--u)*20)}
.row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*10);text-align:left;
  background:var(--panel);border-radius:calc(var(--u)*10);padding:calc(var(--u)*7) calc(var(--u)*10);font-size:calc(var(--u)*14)}
.row small{display:block;color:var(--muted);font-size:calc(var(--u)*12)}
.lv{color:var(--muted);font-size:calc(var(--u)*12)}
.mini{font:700 calc(var(--u)*14)/1 var(--font);padding:calc(var(--u)*9) calc(var(--u)*12);border:0;border-radius:calc(var(--u)*9);
  background:var(--volt);color:#2b2300;cursor:pointer;min-width:calc(var(--u)*64)}
.mini:disabled{background:#2a3c58;color:#6d83a3;cursor:default}
.cards{display:flex;flex-direction:column;gap:calc(var(--u)*8);width:100%;max-width:calc(var(--u)*310)}
.card{font:500 calc(var(--u)*14)/1.3 var(--font);text-align:left;background:var(--panel);color:var(--ink);border:2px solid var(--panel2);
  border-radius:calc(var(--u)*12);padding:calc(var(--u)*11) calc(var(--u)*13);cursor:pointer}
.card b{display:block;font-size:calc(var(--u)*17);color:var(--accent)}
.card span{color:var(--muted);font-size:calc(var(--u)*12)}
.eras{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*10);width:100%;max-width:calc(var(--u)*310);
  background:var(--panel);border-radius:calc(var(--u)*12);padding:calc(var(--u)*8) calc(var(--u)*10)}
.eras>div{display:flex;flex-direction:column;gap:calc(var(--u)*2)} .eras b{font-size:calc(var(--u)*18)} .eras small{color:var(--muted);font-size:calc(var(--u)*12)}
.ghost{font:500 calc(var(--u)*14)/1 var(--font);padding:calc(var(--u)*10) calc(var(--u)*14);background:transparent;color:var(--ink);
  border:2px solid var(--panel2);border-radius:calc(var(--u)*11);cursor:pointer}
.ghost:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pair{display:flex;gap:calc(var(--u)*8);flex-wrap:wrap;justify-content:center}
.crow{display:flex;gap:calc(var(--u)*9);align-items:flex-start;text-align:left;background:var(--panel);border-radius:calc(var(--u)*10);padding:calc(var(--u)*8) calc(var(--u)*10);font-size:calc(var(--u)*14)}
.crow .dot{margin-top:calc(var(--u)*4);flex:none} .crow small{display:block;color:var(--muted);font-size:calc(var(--u)*12);line-height:1.5} .crow small b{color:var(--ink);font-size:inherit} .crow small i{opacity:.55}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*8);width:100%;max-width:calc(var(--u)*310)}
.mini-card{background:var(--panel);border-radius:calc(var(--u)*12);padding:calc(var(--u)*9) calc(var(--u)*8);display:flex;flex-direction:column;gap:calc(var(--u)*5);align-items:center;font-size:calc(var(--u)*14)}
.mini-card small{color:var(--muted);font-size:calc(var(--u)*11.5);line-height:1.25}
.ghost.sel{border-color:var(--accent);color:var(--accent)} .danger{color:#ff8d98;border-color:#6b2a36}
.mini.danger{background:#6b2a36;color:#ffd6db}
p.big{font-size:calc(var(--u)*18);color:var(--ink);max-width:calc(var(--u)*300)}
.goals{width:100%;max-width:calc(var(--u)*310);display:flex;flex-direction:column;gap:calc(var(--u)*4);font-size:calc(var(--u)*13);text-align:left;background:var(--panel);border-radius:calc(var(--u)*10);padding:calc(var(--u)*8) calc(var(--u)*10);color:var(--muted)}
.goals b{color:var(--ink);font-size:calc(var(--u)*13)} .goals i{float:right;font-style:normal;opacity:.8}
.goals span{display:inline-block;width:calc(var(--u)*18)} .goals .ok{color:var(--poison)}
.nextup{width:100%;max-width:calc(var(--u)*310);display:flex;flex-direction:column;gap:calc(var(--u)*4);color:var(--muted);font-size:calc(var(--u)*12)}
.bar{height:calc(var(--u)*8);background:#1c3050;border-radius:calc(var(--u)*6);overflow:hidden;width:100%} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--volt))}
.pulse{border-color:var(--volt)!important;color:var(--volt)!important;animation:pl 1.2s ease-in-out infinite} @keyframes pl{50%{box-shadow:0 0 0 calc(var(--u)*5) rgba(255,210,63,.22)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

/* ---- Arayüz yenileme ---- */
.ov{background:radial-gradient(ellipse at 50% 35%,rgba(7,13,24,.82),rgba(5,9,18,.94));animation:ovin .22s ease-out both}
.ov.menu{background:radial-gradient(ellipse at 50% 38%,rgba(6,12,24,.18),rgba(6,12,24,.62))}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.in>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.in>*:nth-child(2){animation-delay:.05s}.in>*:nth-child(3){animation-delay:.1s}.in>*:nth-child(4){animation-delay:.15s}.in>*:nth-child(5){animation-delay:.2s}.in>*:nth-child(6){animation-delay:.25s}.in>*:nth-child(7){animation-delay:.3s}.in>*:nth-child(8){animation-delay:.35s}.in>*:nth-child(n+9){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(calc(var(--u)*16)) scale(.98)}to{opacity:1;transform:none}}
.ov h1{background:linear-gradient(180deg,#ffffff 20%,#8fd0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 calc(var(--u)*14) rgba(95,227,255,.35));letter-spacing:.08em}
.btn{background:linear-gradient(180deg,#ffb066,#ff7a2a);box-shadow:0 calc(var(--u)*4) 0 #b3501c,0 calc(var(--u)*12) calc(var(--u)*22) rgba(255,122,42,.3);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(calc(var(--u)*3));box-shadow:0 calc(var(--u)*1) 0 #b3501c,0 calc(var(--u)*6) calc(var(--u)*12) rgba(255,122,42,.25)}
.mini{background:linear-gradient(180deg,#ffe27a,#ffc414);box-shadow:0 calc(var(--u)*2) 0 #9c7600;transition:transform .08s}
.mini:active:not(:disabled){transform:translateY(calc(var(--u)*2));box-shadow:none}
.mini:disabled{box-shadow:none;background:#2a3c58}
.ghost{background:rgba(255,255,255,.04);border:2px solid rgba(130,170,230,.28);transition:transform .08s,background .15s}
.ghost:active{transform:scale(.96);background:rgba(255,255,255,.09)}
.row,.eras,.mini-card,.goals,.crow,.card{background:linear-gradient(180deg,rgba(32,56,92,.92),rgba(20,38,64,.92));border:1px solid rgba(160,200,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 calc(var(--u)*6) calc(var(--u)*14) rgba(0,0,0,.25)}
.row{border-left:calc(var(--u)*4) solid var(--c,rgba(160,200,255,.2))}
.rt{flex:1;min-width:0}
.lvbar{height:calc(var(--u)*4);background:rgba(0,0,0,.35);border-radius:calc(var(--u)*3);margin-top:calc(var(--u)*5);overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--c,#5fe3ff);border-radius:inherit}
.dna{width:calc(var(--u)*13);height:calc(var(--u)*18);vertical-align:middle;margin-left:calc(var(--u)*3);animation:dnaspin 3s ease-in-out infinite}
@keyframes dnaspin{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.gain{font-size:calc(var(--u)*46);font-weight:700;color:#e9f2ff;display:flex;align-items:center;justify-content:center;line-height:1;text-shadow:0 0 calc(var(--u)*18) rgba(95,227,255,.35)}
.gain .dna{width:calc(var(--u)*22);height:calc(var(--u)*32);margin-left:calc(var(--u)*6)}
.stars{display:flex;gap:calc(var(--u)*8);font-size:calc(var(--u)*34);line-height:1}
.star{color:#27405f;transform:scale(.6);opacity:0;animation:starin .5s cubic-bezier(.2,1.6,.4,1) forwards}
.star.on{color:#ffd23f;filter:drop-shadow(0 0 calc(var(--u)*8) rgba(255,210,63,.6))}
@keyframes starin{to{transform:scale(1);opacity:1}}
.dots{display:flex;gap:calc(var(--u)*5);justify-content:center;margin-top:calc(var(--u)*3)}
.dots i{width:calc(var(--u)*6);height:calc(var(--u)*6);border-radius:50%;background:#37557f}
.dots i.on{background:var(--accent);box-shadow:0 0 calc(var(--u)*6) var(--accent)}
.card{display:flex;gap:calc(var(--u)*11);align-items:center;border-left:calc(var(--u)*4) solid var(--c);transition:transform .1s}
.card:active{transform:scale(.98)} .card b{color:var(--c)} .card>div{min-width:0}
.chip{flex:none;width:calc(var(--u)*34);height:calc(var(--u)*34);border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:calc(var(--u)*16);color:#0b1626;background:var(--c);box-shadow:0 0 calc(var(--u)*10) var(--c)}
.tutdemo{position:relative;width:calc(var(--u)*180);height:calc(var(--u)*70)}
.tutdemo i{position:absolute;top:50%;width:calc(var(--u)*34);height:calc(var(--u)*34);margin-top:calc(var(--u)*-17);border-radius:50%;background:radial-gradient(circle at 35% 30%,#b4e5ff,#3aa9ff 60%,#1d6fb8)}
.tutdemo .a{left:calc(var(--u)*20);animation:ta 2.4s ease-in-out infinite}.tutdemo .b{right:calc(var(--u)*20);animation:tb 2.4s ease-in-out infinite}
.tutdemo .c{left:50%;width:calc(var(--u)*52);height:calc(var(--u)*52);margin-left:calc(var(--u)*-26);margin-top:calc(var(--u)*-26);opacity:0;animation:tc 2.4s ease-in-out infinite}
@keyframes ta{0%,15%{transform:none;opacity:1}45%,100%{transform:translateX(calc(var(--u)*50));opacity:0}}
@keyframes tb{0%,15%{transform:none;opacity:1}45%,100%{transform:translateX(calc(var(--u)*-50));opacity:0}}
@keyframes tc{0%,40%{opacity:0;transform:scale(.3)}55%{opacity:1;transform:scale(1.2)}70%,92%{opacity:1;transform:scale(1)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.in>*,.ov,.dna,.star{animation:none!important}.star{opacity:1;transform:none}.tutdemo i{animation:none!important}.tutdemo .c{opacity:1}}

.ov h1{background:linear-gradient(100deg,#8fd0ff 0%,#ffffff 30%,#8fd0ff 50%,#ffffff 70%,#8fd0ff 100%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*8);width:100%;max-width:calc(var(--u)*310)}
.bestl{color:var(--muted);font-size:calc(var(--u)*12);margin-top:calc(var(--u)*-4);max-width:calc(var(--u)*300);line-height:1.35} .bestl b{color:var(--accent)}
.ghost:disabled{opacity:.4;cursor:default}
.trophy{font-size:calc(var(--u)*26);color:#4d6a92;line-height:1}.trophy.on{color:#ffd23f;filter:drop-shadow(0 0 calc(var(--u)*6) rgba(255,210,63,.55))}
.goals.ach{border-color:rgba(255,210,63,.35)} .goals.ach b{color:#ffd23f}
.ver{color:#5f789c;font-size:calc(var(--u)*11)}
@media (prefers-reduced-motion:reduce){.ov h1{animation:none!important}}

.ov.habitat{background:none!important;pointer-events:none;overflow:hidden;animation:none}
.ov.habitat .in{margin:0;height:100%;justify-content:space-between;width:100%}
.ov.habitat .in>*{pointer-events:auto}
.habtop{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*10);width:100%;padding:calc(var(--u)*8) calc(var(--u)*10);border-radius:calc(var(--u)*14);background:linear-gradient(180deg,rgba(14,28,50,.82),rgba(14,28,50,.55));border:1px solid rgba(160,200,255,.12)}
.habtop>div{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2);text-align:center}
.habtop b{font-size:calc(var(--u)*18)} .habhint{color:var(--muted);font-size:calc(var(--u)*11);max-width:calc(var(--u)*190);line-height:1.25}
.bestl.warn{color:#ffb347;font-size:calc(var(--u)*12);background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.35);border-radius:calc(var(--u)*8);padding:calc(var(--u)*6) calc(var(--u)*9)}

/* ---- düğmeye özel basma animasyonları ---- */
@keyframes fxjelly{0%{transform:scale(1)}20%{transform:scale(1.14,.82)}45%{transform:scale(.9,1.14)}70%{transform:scale(1.05,.97)}100%{transform:scale(1)}}
@keyframes fxpop{0%{transform:scale(1)}35%{transform:scale(1.35) rotate(-6deg)}70%{transform:scale(.94) rotate(3deg)}100%{transform:scale(1)}}
@keyframes fxbounce{0%{transform:translateY(0)}30%{transform:translateY(calc(var(--u)*-9))}55%{transform:translateY(calc(var(--u)*2))}75%{transform:translateY(calc(var(--u)*-3))}100%{transform:translateY(0)}}
@keyframes fxswing{0%{transform:rotate(0)}25%{transform:rotate(-9deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
@keyframes fxsway{0%{transform:skewX(0)}30%{transform:skewX(-9deg) translateX(calc(var(--u)*-3))}65%{transform:skewX(7deg) translateX(calc(var(--u)*3))}100%{transform:skewX(0)}}
@keyframes fxflip{0%{transform:perspective(400px) rotateX(0)}50%{transform:perspective(400px) rotateX(90deg)}51%{transform:perspective(400px) rotateX(-90deg)}100%{transform:perspective(400px) rotateX(0)}}
@keyframes fxspin{0%{transform:rotate(0) scale(1)}60%{transform:rotate(200deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
@keyframes fxsqueeze{0%{transform:scaleX(1)}35%{transform:scaleX(.7)}70%{transform:scaleX(1.12)}100%{transform:scaleX(1)}}
@keyframes fxnudgeL{0%{transform:translateX(0)}35%{transform:translateX(calc(var(--u)*-10))}100%{transform:translateX(0)}}
@keyframes fxnudgeR{0%{transform:translateX(0)}35%{transform:translateX(calc(var(--u)*10))}100%{transform:translateX(0)}}
@keyframes fxwobble{0%{transform:rotate(0)}20%{transform:rotate(5deg) scale(1.06)}40%{transform:rotate(-5deg) scale(1.06)}60%{transform:rotate(3deg)}80%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
@keyframes fxtilt{0%{transform:perspective(500px) rotateY(0) scale(1)}40%{transform:perspective(500px) rotateY(-12deg) scale(1.05)}100%{transform:perspective(500px) rotateY(0) scale(1)}}
@keyframes fxslide{0%{transform:translateX(0);opacity:1}40%{transform:translateX(calc(var(--u)*-16));opacity:.6}100%{transform:translateX(0);opacity:1}}
@keyframes fxshake{0%,100%{transform:translateX(0)}20%{transform:translateX(calc(var(--u)*-7))}40%{transform:translateX(calc(var(--u)*7))}60%{transform:translateX(calc(var(--u)*-5))}80%{transform:translateX(calc(var(--u)*4))}}
@keyframes fxpress{0%{transform:scale(1)}40%{transform:scale(.93)}100%{transform:scale(1)}}
.fx{animation-duration:.42s;animation-timing-function:cubic-bezier(.3,.7,.3,1);animation-fill-mode:both}
.fx-jelly{animation-name:fxjelly;animation-duration:.55s}.fx-pop{animation-name:fxpop}.fx-bounce{animation-name:fxbounce}.fx-swing{animation-name:fxswing;transform-origin:50% 0}
.fx-sway{animation-name:fxsway}.fx-flip{animation-name:fxflip;animation-duration:.45s}.fx-spin{animation-name:fxspin;animation-duration:.6s}.fx-squeeze{animation-name:fxsqueeze}
.fx-nudgeL{animation-name:fxnudgeL}.fx-nudgeR{animation-name:fxnudgeR}.fx-wobble{animation-name:fxwobble}.fx-tilt{animation-name:fxtilt}.fx-slide{animation-name:fxslide}.fx-shake{animation-name:fxshake;animation-duration:.38s}.fx-press{animation-name:fxpress;animation-duration:.25s}
/* parçacıklar */
.bp{position:absolute;pointer-events:none;z-index:9;font-size:calc(var(--u)*15);line-height:1;color:var(--bc,#ffd23f);text-shadow:0 0 calc(var(--u)*8) var(--bc,#ffd23f);animation:bp .7s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes bp{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot));opacity:0}}
.rip{position:absolute;pointer-events:none;z-index:8;border-radius:50%;border:calc(var(--u)*2) solid var(--bc,#fff);animation:rip .5s ease-out forwards}
@keyframes rip{0%{transform:translate(-50%,-50%) scale(.2);opacity:.9}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
/* ekran geçişleri */
